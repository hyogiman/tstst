/* 쎄뇨라유 스페인어 — studio redesign v2: warm editorial design system */
:root{
 --bg:#f5f6f7;--surface:#ffffff;--ink:#20303d;--muted:#71808b;
 --line:#e5eaf0;--primary:#c9604d;--primary-deep:#a94637;
 --primary-light:#fff0e9;--accent:#efba67;--danger:#b84f50;
 --shadow:0 10px 32px rgba(28,44,58,.035);--radius:18px;
 --navy:#1a2e3a;--navy2:#253c49;--peach:#fff3e7;
}
html{scroll-behavior:smooth}body{background:var(--bg);font-family:'Manrope','Noto Sans KR',system-ui,sans-serif;letter-spacing:-.22px;line-height:1.55}
h1,h2,h3,h4{font-weight:800;color:var(--ink);letter-spacing:-1px}
h1{font-size:clamp(29px,2.7vw,39px);line-height:1.28}h2{font-size:24px}h3{font-size:18px}
small{font-size:12px}button,input,select,textarea{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #eeb17d;outline-offset:2px}
.eyebrow{color:var(--primary);font-size:10px;letter-spacing:2.4px;font-weight:800;margin-bottom:9px}
.muted,.hint{color:var(--muted)}.hint{line-height:1.65}
.card{border:1px solid var(--line);border-radius:19px;padding:25px;box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.btn{border-radius:11px;min-height:44px;padding:11px 17px;font-weight:800;font-size:13px;box-shadow:none;transition:background .18s,border-color .18s,transform .18s}
.btn:hover{box-shadow:0 7px 15px rgba(130,59,41,.095)}
.btn.secondary{border-color:#dfe5e9;background:white;color:#344652}
.btn.secondary:hover{background:#f7f9fa}
.btn.soft{background:#fff2eb;color:#ac5140;border-color:#f7e3d8}
.btn.soft:hover{background:#ffe8dc}
.btn.danger{background:#fff1f0;border-color:#f5d4d1;color:#b44444}
.btn.small{min-height:37px;font-size:12px;padding:8px 13px}
.btn.ghost{color:var(--muted)}
.logo{background:var(--primary);border-radius:14px;width:45px;height:45px;box-shadow:none;color:white;font-family:Georgia,serif;font-size:30px}
.brand strong{font-size:18px;letter-spacing:-.8px}.brand small{letter-spacing:1.15px;color:var(--muted)}
.pill{font-size:11px;border-radius:7px;padding:5px 10px;line-height:1.5;background:#f3f5f7;color:#60717d}
.pill.green{background:#eaf7f0;color:#207853}.pill.amber{background:#fff3e3;color:#a26d27}.pill.red{background:#fff0ed;color:#b35043}.pill.gray{background:#f2f4f6;color:#76848e}
.field>label,.field-label{font-weight:800;font-size:12px;color:#465662}
.field input,.field select,.field textarea,.input{border:1px solid #dce4ea;border-radius:11px;min-height:45px;padding:11px 13px;font-size:14px;color:var(--ink)}
.field textarea{line-height:1.75}.field input:focus,.field select:focus,.field textarea:focus,.input:focus{border-color:#cd7563;box-shadow:0 0 0 3px #fae8e1;outline:0}
.card .subtle,.subtle{background:#f8f9fa;border:1px solid #ecf0f2;border-radius:13px;padding:17px}
.notice{background:#eff8f3;color:#267a5d;border-radius:10px;font-size:13px;padding:13px 15px}
.notice.warn{background:#fff5e8;color:#93652b}
.section-title{margin-bottom:22px;align-items:center;gap:22px}.section-title p,.page-head p{font-size:13px;margin-top:8px;color:var(--muted)}
.tabset{background:#edf0f3;border-radius:12px;padding:4px;gap:4px}.tab{border-radius:9px;font-size:13px;font-weight:750;min-height:40px}
.tab.active{background:white;color:var(--primary);box-shadow:0 2px 7px #192b3210}
.empty{background:#fbfcfd;border:1px dashed #dce4e9;padding:54px 20px}.empty strong{color:var(--ink)}
.loading{min-height:86px;justify-content:flex-start;padding:17px 0;gap:12px;font-size:13px}
.loading:before{border:2px solid #f0ddd8;border-top-color:var(--primary);width:16px;height:16px}
.mini-stat{background:#fff;border:1px solid var(--line);padding:25px;border-radius:18px;min-height:134px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.mini-stat strong{font-size:37px;letter-spacing:-1.8px;color:var(--navy);line-height:1.1}.mini-stat span{font-size:13px}
/* Admin workspace */
.admin-shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh;background:var(--bg)}
.sidebar{height:100dvh;top:0;position:sticky;background:var(--navy);border:0;padding:31px 16px 20px;gap:43px;overflow-y:auto}
.sidebar .brand{padding:0 12px}.sidebar .brand .logo{background:#e89b70;color:#222e37}
.sidebar .brand strong{color:#fff;font-size:19px}.sidebar .brand small{color:#8eabb9;font-size:9px}
.side-nav{display:flex;flex-direction:column;gap:5px}

async function uploadMedia(file,path,kind,progressEl){

      // 다운로드 URL을 가진 사람은 링크를 공유할 수 있으므로 유료/고보안 음성 보호에는 적합하지 않습니다.

function sanitizeRich(html){
  const parsed=new DOMParser().parseFromString(`<div>${html||''}</div>`,'text/html');

  function safeNode(node){
    if(node.nodeType===Node.TEXT_NODE)return document.createTextNode(node.textContent);
    if(node.nodeType!==Node.ELEMENT_NODE)return document.createDocumentFragment();
    const tag=node.tagName; const el=allowed.has(tag)?document.createElement(tag.toLowerCase()):document.createDocumentFragment();

async function ensureProfile(user){
  const r=doc(db,'users',user.uid),snap=await getDoc(r);

    const profile=snap.data();

    const authName=(user.displayName||'').trim();
    if(profile.role==='student' && (!profile.displayName || profile.displayName==='수강생') && authName && authName!=='수강생'){
      await updateDoc(r,{displayName:authName,updatedAt:serverTimestamp()});
      return {...profile,displayName:authName};
    }
    return profile;
  }
  const data={displayName:(user.displayName||'').trim()||'수강생',email:user.email||'',role:'student',createdAt:serverTimestamp()};
  await setDoc(r,data);

// 녹음은 한 번에 하나만 합니다. 녹음 결과는 '녹음을 시작한 대상'에만 저장되고,
// 화면을 옮기면 자동으로 멈춰 마이크를 끕니다(P0-02). 파일 선택 업로드도 대안으로 제공합니다.
let activeRecorder=null;
const formatDuration=sec=>`${Math.floor(sec/60)}:${String(Math.round(sec)%60).padStart(2,'0')}`;
async function recordStart(onFile,onStatus,label=''){
  if(activeRecorder)throw Error('현재 녹음 중인 항목을 먼저 종료해 주세요.');
  if(!navigator.mediaDevices?.getUserMedia||!globalThis.MediaRecorder)throw Error('이 브라우저에서 음성 녹음을 지원하지 않습니다. 음성 파일을 선택해 주세요.');
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const options=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg'].find(t=>MediaRecorder.isTypeSupported(t));
  let recorder;try{recorder=options?new MediaRecorder(stream,{mimeType:options}):new MediaRecorder(stream)}catch(err){stream.getTracks().forEach(t=>t.stop());throw err}
  const chunks=[],startedAt=Date.now();
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  recorder.onstop=()=>{
    stream.getTracks().forEach(t=>t.stop());
    activeRecorder=null;
    const mime=recorder.mimeType||'audio/webm';
    const ext=mime.includes('mp4')?'m4a':mime.includes('ogg')?'ogg':'webm';
    const file=new File(chunks,`recording-${Date.now()}.${ext}`,{type:mime});
    // webm 녹음은 길이 정보가 비어 있는 경우가 있어 시작·종료 시각으로 계산합니다.
    file.durationSec=Math.max(1,Math.round((Date.now()-startedAt)/1000));
    onFile(file);
    onStatus(`녹음 완료 · ${formatDuration(file.durationSec)}`);
  };
  recorder.start();
  activeRecorder={recorder,stream,label};
  onStatus('● 녹음 중입니다. 종료 버튼을 눌러 주세요.');
}
function recordStop(){if(activeRecorder?.recorder.state==='recording')activeRecorder.recorder.stop()}
function isRecording(){return !!activeRecorder}
// 화면 전환·로그아웃 때 호출합니다. 녹음 중이면 멈추고 마이크를 끄며, 결과는 녹음을 시작한 대상의 초안으로 보관됩니다.
function stopRecordingForNavigation(){
  if(!activeRecorder)return false;
  const {recorder,stream,label}=activeRecorder;
  if(recorder.state==='recording')recorder.stop();
  stream.getTracks().forEach(t=>t.stop());
  toast(label?`녹음을 멈췄어요. ${label} 초안에 보관했어요.`:'녹음을 멈췄어요.');
  return true;
}
function makeMediaUi(kind,label){return `<div class="stack media-ui"><div class="record-controls"><button class="btn soft small" type="button" data-record-start><span aria-hidden="true">●</span> 녹음 시작</button><button class="btn secondary small" type="button" data-record-stop><span aria-hidden="true">■</span> 녹음 종료</button><span class="file-note" data-rec-status role="status"></span></div><div class="field"><label>${esc(label||'또는 음성 파일 선택')}</label><input type="file" accept="audio/*" data-audio-input></div><div class="media-draft hide" data-media-draft><audio controls data-local-audio></audio><div class="media-draft-meta"><span data-media-draft-name></span><button type="button" class="btn ghost small" data-record-clear>첨부 취소</button></div></div><p class="hint">마이크 권한과 HTTPS 연결이 필요합니다. 음성 파일은 최대 15MB입니다.</p></div>`}
// onFile(file|null): 선택·녹음한 파일을 해당 대상의 초안에 저장(null이면 첨부 취소). initialFile: 보관된 초안 복원
function wireMediaUi(container,onFile,{label='',initialFile=null}={}){
  const status=$('[data-rec-status]',container),player=$('[data-local-audio]',container),draft=$('[data-media-draft]',container),name=$('[data-media-draft-name]',container),input=$('[data-audio-input]',container);
  const show=(file,prefix)=>{
    if(player.dataset.blob){URL.revokeObjectURL(player.dataset.blob);delete player.dataset.blob}
    if(!file){player.removeAttribute('src');draft.classList.add('hide');return}
    const url=URL.createObjectURL(file);player.dataset.blob=url;player.src=url;
    name.textContent=`${prefix}: ${file.name}${file.durationSec?` · ${formatDuration(file.durationSec)}`:''}`;
    draft.classList.remove('hide');
  };
  const onSelected=file=>{if(!file)return;onFile(file);if(container.isConnected){show(file,'첨부할 음성');status.textContent=''}};
  $('[data-record-start]',container)?.addEventListener('click',async()=>{try{await recordStart(onSelected,t=>{if(status.isConnected)status.textContent=t},label)}catch(e){toast(ex(e),true)}});
  $('[data-record-stop]',container)?.addEventListener('click',recordStop);
  input?.addEventListener('change',e=>onSelected(e.target.files[0]));
  $('[data-record-clear]',container)?.addEventListener('click',()=>{onFile(null);show(null);if(input)input.value='';status.textContent='첨부를 취소했어요.'});
  if(initialFile)show(initialFile,'보관된 음성');
}

function modalDialog({title='확인',message='',value=null,choices=null,placeholder='',danger=false,confirmText='확인',verify=null,multiline=false,allowEmpty=false}={}){
  return new Promise(resolve=>{
    document.querySelector('.app-modal-backdrop')?.remove();
    const layer=document.createElement('div');layer.className='app-modal-backdrop';
    layer.innerHTML=`<section class="app-modal" role="dialog" aria-modal="true" aria-labelledby="app-modal-title"><div class="app-modal-head"><div><span class="eyebrow">쎄뇨라유 · 안내</span><h2 id="app-modal-title">${esc(title)}</h2></div><button type="button" class="app-modal-x" aria-label="닫기">×</button></div><p class="app-modal-message">${esc(message)}</p>${choices?`<div class="field"><label>선택</label><select class="input app-modal-input">${choices.map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join('')}</select></div>`:value!==null?`<div class="field"><label>${verify?'삭제할 반 이름':'입력'}</label>${multiline?`<textarea class="input app-modal-input" rows="7" maxlength="500" placeholder="${esc(placeholder)}">${esc(value)}</textarea>`:`<input class="input app-modal-input" maxlength="1000" placeholder="${esc(placeholder)}" value="${esc(value)}" ${verify?'autocomplete="off"':''}>`}</div>`:''}${verify?`<p class="app-modal-verify">확인을 위해 <strong>${esc(verify)}</strong>을(를) 정확히 입력해 주세요.</p>`:''}<div class="app-modal-actions"><button type="button" class="btn secondary app-modal-cancel">취소</button><button type="button" class="btn ${danger?'danger-solid':''} app-modal-ok">${esc(confirmText)}</button></div></section>`;
    document.body.appendChild(layer);document.body.classList.add('modal-open');const input=layer.querySelector('.app-modal-input'),ok=layer.querySelector('.app-modal-ok');
    if(verify)ok.disabled=true;
    const done=v=>{document.removeEventListener('keydown',keyHandler);layer.remove();document.body.classList.remove('modal-open');resolve(v)};
    function keyHandler(e){if(e.key==='Escape'){e.preventDefault();done(null)}if(e.key==='Enter'&&document.activeElement===input){e.preventDefault();if(!ok.disabled)ok.click()}}
    document.addEventListener('keydown',keyHandler);
    layer.querySelector('.app-modal-cancel').onclick=()=>done(null);layer.querySelector('.app-modal-x').onclick=()=>done(null);
    layer.onclick=e=>{if(e.target===layer)done(null)};
    input?.addEventListener('input',()=>{if(verify)ok.disabled=input.value.trim()!==verify});
    ok.onclick=()=>{if(input&&value!==null&&!verify&&!allowEmpty&&!input.value.trim()){input.focus();return}done(input?input.value:true)};
    requestAnimationFrame(()=>{(input||ok).focus();if(input&&value!==null&&!verify)input.select()});
  });
}

async function roster(){

   // D2: 출석·불참 두 가지로 집계합니다(이전 형식의 지각=출석, 인정결석=불참).
   for(const a of d.attendance){if(!active.has(a.id))continue;
     const v=attendanceValue(a.status);
     if(v==='present'){attendance.present++;attendance.total++;row.attended++;row.attTotal++}
     if(v==='absent'){attendance.absent++;attendance.total++;row.absent++;row.attTotal++}
   }
   if(w.published&&w.assignment?.enabled){
     row.assignmentTotal=members.length;row.assignmentDone=d.submissions.filter(x=>active.has(x.id)).length;
     assignmentTotal+=row.assignmentTotal;assignmentDone+=row.assignmentDone;
   }

async function deleteClassDeep(c){
  const cid=c.id,paths=new Set();
  await updateDoc(doc(db,'classes',cid),{archived:true,updatedAt:serverTimestamp()});
  async function purgeDocs(ref){const snap=await getDocs(ref);for(let i=0;i<snap.docs.length;i+=350){const batch=writeBatch(db);snap.docs.slice(i,i+350).forEach(x=>batch.delete(x.ref));await batch.commit()}return snap.docs}
  const weeks=await getDocs(collection(db,'classes',cid,'weeks'));
  for(const w of weeks.docs){
    const wd=w.data(),wid=w.id,p=wd.preview||{};
    if(p.imagePath)paths.add(p.imagePath);(p.videos||[]).forEach(x=>x.path&&paths.add(x.path));(p.files||[]).forEach(x=>x.path&&paths.add(x.path));
    for(const name of ['submissions','quizResults']){
      const docs=await getDocs(collection(db,'classes',cid,'weeks',wid,name));
      for(const d of docs.docs){const data=d.data();if(data.audioPath)paths.add(data.audioPath);if(data.feedback?.audioPath)paths.add(data.feedback.audioPath);(data.feedbacks||[]).forEach(f=>f.audioPath&&paths.add(f.audioPath));if(name==='quizResults')await purgeDocs(collection(db,'classes',cid,'weeks',wid,'quizResults',d.id,'attempts'))}
      await purgeDocs(collection(db,'classes',cid,'weeks',wid,name));
    }
    await purgeDocs(collection(db,'classes',cid,'weeks',wid,'attendance'));
  }
  await purgeDocs(collection(db,'classes',cid,'weeks'));
  const questions=await getDocs(collection(db,'classes',cid,'questions'));
  for(const q of questions.docs)await purgeDocs(collection(db,'classes',cid,'questions',q.id,'replies'));
  await purgeDocs(collection(db,'classes',cid,'questions'));
  await purgeDocs(collection(db,'classes',cid,'members'));
  await purgeDocs(collection(db,'classes',cid,'teacherNotes'));
  const enrollments=await getDocs(query(collection(db,'enrollments'),where('classId','==',cid)));
  for(const e of enrollments.docs){const uid=e.data().uid;const ref=doc(db,'users',uid),snap=await getDoc(ref);if(snap.exists()&&snap.data().assignedClassId===cid)await updateDoc(ref,{assignedClassId:deleteField()})}
  for(let i=0;i<enrollments.docs.length;i+=350){const batch=writeBatch(db);enrollments.docs.slice(i,i+350).forEach(e=>batch.delete(e.ref));await batch.commit()}
  if(c.joinCode)await deleteDoc(doc(db,'joinCodes',String(c.joinCode).toUpperCase()));
  // 직접 관리 중인 등록 파일을 정리합니다. 오래된 미참조 파일은 Storage에 잔존할 수 있습니다.
  let fileFailures=0;for(const path of paths){try{await deleteObject(storageRef(storage,path))}catch(e){if(e.code!=='storage/object-not-found'){fileFailures++;console.warn('파일 정리 필요',path,e)}}}
  await deleteDoc(doc(db,'classes',cid));
  if(A.classId===cid){A.classId='';localStorage.removeItem(classPrefKey())}
  if(fileFailures)toast(`반은 삭제되었습니다. 파일 ${fileFailures}개는 Storage에서 직접 정리해야 합니다.`,true);
}

async function deleteWeekDeep(cid,wid){
  const rootRef=doc(db,'classes',cid,'weeks',wid),ws=await getDoc(rootRef);if(!ws.exists())throw Error('이미 삭제된 주차입니다.');
  // 문서만 삭제하면 하위 컬렉션이 남으므로 시도 기록 → 제출/퀴즈 → 출석 → 주차 순으로 삭제합니다.
  const paths=new Set(),p=ws.data().preview||{};
  if(p.imagePath)paths.add(p.imagePath);
  for(const item of [...(p.videos||[]),...(p.files||[])])if(item.path)paths.add(item.path);
  async function clearDocs(ref){const snap=await getDocs(ref);for(let i=0;i<snap.docs.length;i+=350){const batch=writeBatch(db);snap.docs.slice(i,i+350).forEach(x=>batch.delete(x.ref));await batch.commit()}return snap.docs}
  for(const kind of ['submissions','quizResults']){
    const data=await getDocs(collection(db,'classes',cid,'weeks',wid,kind));
    for(const d of data.docs){const value=d.data();if(value.audioPath)paths.add(value.audioPath);if(value.feedback?.audioPath)paths.add(value.feedback.audioPath);
      for(const fb of value.feedbacks||[])if(fb.audioPath)paths.add(fb.audioPath);
      if(kind==='quizResults')await clearDocs(collection(db,'classes',cid,'weeks',wid,'quizResults',d.id,'attempts'));
    }
    await clearDocs(collection(db,'classes',cid,'weeks',wid,kind));
  }
  await clearDocs(collection(db,'classes',cid,'weeks',wid,'attendance'));
  const c=A.classes.find(x=>x.id===cid),schedule=classSchedule(c).filter(x=>x.weekId!==wid);
  const batch=writeBatch(db);batch.delete(rootRef);batch.update(doc(db,'classes',cid),{schedule,updatedAt:serverTimestamp()});await batch.commit();
  if(c)c.schedule=schedule;
  let failed=0;for(const path of paths){try{await deleteObject(storageRef(storage,path))}catch(e){if(e.code!=='storage/object-not-found'){failed++;console.warn('미디어 삭제 실패',path,e)}}}
  if(failed)toast(`주차는 삭제됐지만 Storage 파일 ${failed}개는 별도 확인이 필요합니다.`,true);
}
// 구버전 {correctIndex} 데이터도 그대로 지원합니다.
function normalizeQuestion(q={}){
  const type=['single','multiple','ox'].includes(q.type)?q.type:'single';
  let options=type==='ox'?['O','X']:Array.isArray(q.options)?q.options.slice(0,12):['','','',''];
  if(type!=='ox' && options.length<2)options=[...options,...Array(2-options.length).fill('')];
  let correctIndices=Array.isArray(q.correctIndices)?q.correctIndices.map(Number):[Number(q.correctIndex??0)];
  correctIndices=[...new Set(correctIndices.filter(i=>Number.isInteger(i)&&i>=0&&i<options.length))];
  if(type!=='multiple')correctIndices=correctIndices.slice(0,1);
  if(!correctIndices.length)correctIndices=[0];
  return {id:q.id||makeId(),type,stem:q.stem||'',options,correctIndices,correctIndex:correctIndices[0],explanation:q.explanation||''};
}
function newQuestion(type='single') {return normalizeQuestion({type,options:type==='ox'?['O','X']:['','','','']})}

function validateQuizQuestions(qs){
  if(!qs.length)throw Error('복습 퀴즈에는 최소 한 문항이 필요합니다.');
  if(qs.length>200)throw Error('한 주차의 퀴즈는 최대 200문항까지 등록할 수 있습니다.');
  qs.forEach((q,i)=>{
    const pos=`${i+1}번 문항`;
    if(!q.stem)throw Error(`${pos}: 문제를 입력해 주세요.`);
    if(q.options.length<2||q.options.length>12||q.options.some(x=>!x))throw Error(`${pos}: 모든 선택지를 입력해 주세요 (2~12개).`);
    if(!q.correctIndices.length)throw Error(`${pos}: 정답을 선택해 주세요.`);
    if(q.type!=='multiple'&&q.correctIndices.length!==1)throw Error(`${pos}: 정답을 하나 지정해 주세요.`);
    if(q.type==='multiple'&&q.correctIndices.length<2)throw Error(`${pos}: 복수정답은 정답을 두 개 이상 지정해 주세요.`);
  });
}

// D2: 출석은 '출석'·'불참' 두 가지만 씁니다. 이전 형식의 지각은 출석, 인정결석은 불참으로 읽습니다.
const attendanceOptions=[['unchecked','미입력'],['present','출석'],['absent','불참']];
const attendanceValue=status=>status==='present'||status==='late'?'present':status==='absent'||status==='excused'?'absent':'';
const attendanceLabel=v=>v==='present'?'출석':v==='absent'?'불참':'미입력';

function defaultSessionId(list){
  const today=kstToday();
  const past=list.filter(s=>s.date&&s.date<today).sort((a,b)=>a.date.localeCompare(b.date));
  return (list.find(s=>s.date===today)||past.at(-1)||list[0])?.weekId||'';
}

    }
  }
  if(snap.docs.some(d=>d.id===targetId))batch.update(doc(db,'enrollments',targetId),{status:'active'});
  else batch.set(doc(db,'enrollments',targetId),{uid,classId:targetClassId,studentName:realName,email:student.email||'',joinCode:target.joinCode||'',status:'active',joinedAt:serverTimestamp()});
  batch.set(doc(db,'classes',targetClassId,'members',uid),{uid,name:publicName,status:'active',joinedAt:serverTimestamp()},{merge:true});
  batch.update(doc(db,'users',uid),{assignedClassId:targetClassId});
  try{await batch.commit()}
  catch(e){if(e?.code==='permission-denied')throw Error('권한이 없어 반을 옮기지 못했어요. Firestore 규칙에서 강사의 수강 등록 생성을 허용해야 합니다(저장소의 firestore.rules 참고).');throw e}
}
async function otherActiveClasses(uid,exceptClassId){
  const snap=await getDocs(query(collection(db,'enrollments'),where('uid','==',uid)));
  return snap.docs.map(d=>d.data()).filter(e=>e.status==='active'&&e.classId!==exceptClassId).map(e=>A.classes.find(c=>c.id===e.classId)||{id:e.classId,name:'다른 반'});
}
async function duplicateActiveStudents(){
  try{
    const snap=await getDocs(query(collection(db,'enrollments'),where('status','==','active')));
    const count={};snap.docs.forEach(d=>{const u=d.data().uid;count[u]=(count[u]||0)+1});
    return new Set(Object.keys(count).filter(u=>count[u]>1));
  }catch(e){console.warn('중복 수강 확인 실패',e);return new Set()}
}
async function showStudents(b){
  adminStopLive('students');adminStopLive('studentsMembers');
  b.innerHTML=`<div class="section-title"><div><div class="eyebrow">STUDENT DIRECTORY · 수강생</div><h1>수강생 관리 <span class="current-class">(${esc(activeClass()?.name||"선택된 반")})</span></h1><p>이름을 눌러 해당 수강생의 차시별 출결을 수정할 수 있습니다.</p></div><button id="students-back" class="btn secondary" type="button">← 클래스 목록</button></div>
  <div class="roster-summary"><div class="roster-summary-left"><div id="roster-count" class="roster-count">—</div><div><strong id="roster-total">수강생 불러오는 중</strong><small>${esc(activeClass()?.name||'선택된 반')}</small></div></div><div class="roster-tools"><input id="roster-search" type="search" placeholder="이름 또는 이메일 검색" aria-label="수강생 검색"><select id="roster-status" aria-label="수강 상태 필터"><option value="all">전체 학생</option><option value="active">수강 중</option><option value="inactive">수강 중지</option><option value="transferred">반 이동</option></select></div></div>
  <div class="card roster-card"><div id="roster-list" class="roster-content loading">학생 목록 확인 중</div></div><p class="hint" style="margin-top:15px">※ 이름은 계정의 최신 프로필을 기준으로 표시합니다. 이름이 등록되지 않은 학생은 강사가 수정할 수 있습니다.</p>`;
  $('#students-back').onclick=()=>{A.classFilter='all';navigateAdminPage('classes')};
  const list=$('#roster-list');
  try{
    const cid=A.classId;let students=await roster();
    if(cid!==A.classId || !list.isConnected)return;
    // D4: 다른 반에도 수강 중으로 남아 있는 학생(이전 버전 데이터)을 찾아 경고합니다.
    const duplicateActive=await duplicateActiveStudents();
    const active=students.filter(s=>s.status==='active');
    $('#roster-count').textContent=active.length;
    $('#roster-total').textContent=`${active.length}명 수강 중 · 전체 ${students.length}명`;
    function renderRows(){
      const queryText=$('#roster-search')?.value.trim().toLocaleLowerCase('ko')||'';
      const filter=$('#roster-status')?.value||'all';
      const filtered=students.filter(s=>(filter==='all'||s.status===filter)&&(
        !queryText || (s.studentName||'').toLocaleLowerCase('ko').includes(queryText) || (s.email||'').toLocaleLowerCase('ko').includes(queryText)
      ));
      if(!filtered.length){loaded(list,`<div class="roster-empty">${empty(students.length?'조건에 맞는 수강생이 없습니다':'아직 등록된 수강생이 없습니다',students.length?'검색어나 필터를 변경해 주세요.':'강사가 발급한 수강 코드를 공유해 주세요.')}</div>`);return}
      loaded(list,`<div class="data-table-wrap"><table class="data-table"><thead><tr><th>수강생</th><th>이메일 · 로그인 ID</th><th>수강 상태</th><th>등록일</th><th>출석현황</th><th>강사 메모</th><th>관리</th></tr></thead><tbody>${filtered.map(s=>`<tr><td><div class="name-cell"><span class="name-avatar" aria-hidden="true">${esc((s.studentName||'?').slice(0,1))}</span><div><button class="student-name-link" data-student-attendance="${esc(s.uid)}">${esc(s.studentName)}</button>${s.hasGenericName?'<small>이름 확인 필요</small>':'<small>학습자 프로필</small>'}${duplicateActive.has(s.uid)?`<small class="dup-warning">활성 반 중복 · <button type="button" class="linkbutton" data-keep-class="${esc(s.uid)}">이 반만 남기기</button></small>`:''}</div></div></td><td>${esc(s.email||'—')}</td><td><span class="pill ${s.status==='active'?'green':'gray'}">${s.status==='active'?'수강 중':s.status==='transferred'?'반 이동':'수강 중지'}</span></td><td>${fmt(s.joinedAt)}</td><td><button type="button" class="btn secondary small" data-student-attendance="${esc(s.uid)}">출석현황</button></td><td><button type="button" class="btn btn-outline-red small" data-student-memo="${esc(s.uid)}">메모 입력</button></td><td><div class="row-actions"><button type="button" class="btn secondary small" data-edit-name="${esc(s.uid)}">실명 수정</button><button type="button" class="btn soft small" data-move-student="${esc(s.uid)}">반 이동</button><button type="button" class="btn ${s.status==='active'?'danger':'soft'} small" data-status-uid="${esc(s.uid)}">${s.status==='active'?'수강 중지':'재등록'}</button></div></td></tr>`).join('')}</tbody></table></div>`);
      $$('[data-student-attendance]',list).forEach(el=>el.onclick=()=>{const student=students.find(s=>s.uid===el.dataset.studentAttendance);if(student)showStudentAttendance(student)});
      $$('[data-student-memo]',list).forEach(el=>el.onclick=async()=>{
        const student=students.find(x=>x.uid===el.dataset.studentMemo);if(!student)return;const ref=doc(db,'classes',cid,'teacherNotes',student.uid);
        try{const existing=await getDoc(ref);const previous=existing.exists()?existing.data().text||'':'';
          const content=await modalDialog({title:`${student.studentName} · 강사 메모`,message:'수업 중 특이사항을 입력해 주세요. 이 메모는 강사 페이지에서만 보이며 학생에게 공개되지 않습니다.',value:previous,multiline:true,allowEmpty:true,confirmText:'메모 저장'});
          if(content===null)return;if(content.length>500){toast('메모는 500자 이내로 작성해 주세요.',true);return}
          if(content.trim())await setDoc(ref,{text:content.trim(),studentUid:student.uid,updatedAt:serverTimestamp(),updatedBy:A.user.uid},{merge:true});else if(existing.exists())await deleteDoc(ref);
          toast('강사 메모를 저장했습니다.');
        }catch(e){toast(ex(e),true)}
      });
      $$('[data-edit-name]',list).forEach(el=>el.onclick=async()=>{
        const student=students.find(x=>x.uid===el.dataset.editName);if(!student)return;
        const name=await modalInput('수강생의 실명을 입력해 주세요. 학생의 별명은 그대로 유지됩니다.',student.realName||'');
        if(name===null)return;
        const trimmed=name.trim();if(!trimmed||trimmed.length>35){toast('이름을 1~35자로 입력해 주세요.',true);return}
        try{
          const nickname=student.nickname&&student.nickname!==trimmed?student.nickname:'';
          const publicName=nickname||trimmed;
          await updateDoc(doc(db,'users',student.uid),{realName:trimmed,nickname,displayName:publicName,updatedAt:serverTimestamp()});
          await updateDoc(doc(db,'enrollments',student.id),{studentName:trimmed});
          await setDoc(doc(db,'classes',cid,'members',student.uid),{uid:student.uid,name:publicName,status:student.status},{merge:true});
          Object.assign(student,{realName:trimmed,nickname,publicName,studentName:nickname?`${nickname}(${trimmed})`:trimmed,hasGenericName:false});
          toast('실명을 수정했습니다.');renderRows();
        }catch(err){toast(ex(err),true)}
      });
      $$('[data-move-student]',list).forEach(el=>el.onclick=async()=>{
        const student=students.find(x=>x.uid===el.dataset.moveStudent);if(!student)return;
        const destinations=A.classes.filter(c=>!c.archived&&c.id!==cid);
        if(!destinations.length){toast('이동할 다른 운영 반을 먼저 개설해 주세요.',true);return}
        const choices=destinations.map((c,i)=>`${i+1}. ${c.name}`).join('\n');
        const answer=await modalDialog({title:'반 이동',message:`${student.studentName}님이 이동할 반을 선택해 주세요.`,choices:destinations.map(c=>({value:c.id,label:c.name})),confirmText:'반 이동'});if(answer===null)return;
        const target=destinations.find(c=>c.id===answer);if(!target){toast('반 번호를 확인해 주세요.',true);return}
        if(!await modalConfirm(`${student.studentName}님을 ${target.name}(으)로 이동할까요?\n이전 반의 학습 기록은 보존되지만 새 반에 복사되지 않습니다.`))return;
        try{await activateEnrollment(student,target.id);toast('수강생의 반 이동이 완료되었습니다.');await showStudents(b)}
        catch(e){toast(ex(e),true)}
      });
      $$('[data-status-uid]',list).forEach(el=>el.onclick=async()=>{
        const student=students.find(x=>x.uid===el.dataset.statusUid);if(!student)return;
        try{
          if(student.status==='active'){
            if(!await modalConfirm(`${student.studentName}님을 수강 중지할까요?\n학습 기록은 그대로 보존됩니다.`))return;
            await updateDoc(doc(db,'enrollments',student.id),{status:'inactive'});
            await setDoc(doc(db,'classes',cid,'members',student.uid),{uid:student.uid,name:student.publicName,status:'inactive'},{merge:true});
            toast('수강을 중지했어요.');
          }else{
            // D4: 다른 반을 수강 중이면 그 반은 '반 이동'으로 바뀌고 이 반만 수강 중이 됩니다.
            const others=await otherActiveClasses(student.uid,cid);
            const message=others.length?`${student.studentName}님은 지금 ${others.map(c=>c.name).join(', ')}을(를) 수강 중이에요.\n이 반(${activeClass()?.name||''})으로 다시 옮길까요?`:`${student.studentName}님을 다시 수강 중으로 바꿀까요?`;
            if(!await modalConfirm(message))return;
            await activateEnrollment(student,cid);
            toast('다시 수강 중으로 바꿨어요.');
          }
          await showStudents(b);
        }catch(err){toast(ex(err),true)}
      });
      $$('[data-keep-class]',list).forEach(el=>el.onclick=async()=>{
        const student=students.find(x=>x.uid===el.dataset.keepClass);if(!student)return;
        if(!await modalConfirm(`${student.studentName}님의 다른 반 수강을 '반 이동'으로 정리하고 이 반만 남길까요?`))return;
        try{await activateEnrollment(student,cid);toast('이 반만 수강 중으로 정리했어요.');await showStudents(b)}catch(err){toast(ex(err),true)}
      });
    }
    $('#roster-search').addEventListener('input',renderRows);
    $('#roster-status').addEventListener('change',renderRows);
    renderRows();
    let initialMemberEvent=true;
    A.live.studentsMembers=onSnapshot(collection(db,'classes',cid,'members'),async()=>{
      if(initialMemberEvent){initialMemberEvent=false;return}
      if(A.page!=='students'||A.classId!==cid||!list.isConnected)return;
      if(document.activeElement?.matches('input,textarea,select'))return;
      students=await roster();
      if(A.page!=='students'||A.classId!==cid||!list.isConnected)return;
      const activeCount=students.filter(x=>x.status==='active').length;
      $('#roster-count').textContent=activeCount;
      $('#roster-total').textContent=`${activeCount}명 수강 중 · 전체 ${students.length}명`;
      renderRows();
    },adminLiveError);
    let initial=true;
    A.live.students=onSnapshot(query(collection(db,'enrollments'),where('classId','==',cid)),()=>{
      if(initial){initial=false;return}
      if(A.page!=='students'||A.classId!==cid)return;
      if(document.activeElement?.matches('input,textarea,select')){toast('수강생 명단에 변경사항이 있습니다. 메뉴를 다시 열면 갱신됩니다.');return}
      showStudents(b);
    },adminLiveError);
  }catch(err){loaded(list,`<div class="roster-error error">${esc(ex(err))}</div>`)}
}
if(CONFIGURED){onAuthStateChanged(auth,async user=>{try{if(!user){resetAdminSession();mountAuth(root,{signup:false});return}root.innerHTML='<div class="loading" style="min-height:95vh">강사 권한을 확인하고 있습니다</div>';A.user=user;const snap=await getDoc(doc(db,'users',user.uid));if(!snap.exists()||snap.data().role!=='admin'){root.innerHTML=`<div class="card" style="max-width:620px;margin:8vh auto"><div class="eyebrow">ACCESS CONTROL</div><h2>강사 권한이 필요합니다</h2><p style="margin-top:12px">관리자 계정은 가입만으로 생성되지 않습니다. Firebase Authentication에 강사 계정을 만든 뒤, Firestore <code>users/${esc(user.uid)}</code> 문서의 <code>role</code> 필드를 <code>admin</code>으로 등록해 주세요.</p><div class="subtle" style="margin-top:18px"><strong>현재 로그인 UID</strong><p style="overflow-wrap:anywhere">${esc(user.uid)}</p></div><div class="row" style="margin-top:18px"><button class="btn secondary" id="admin-signout">다른 계정으로 로그인</button><a class="btn soft" href="index.html">수강생 페이지</a></div></div>`;$('#admin-signout').onclick=()=>{resetAdminSession();signOut(auth)};return}A.profile=snap.data();await loadAdmin()}catch(err){root.innerHTML=`<div class="card" style="max-width:570px;margin:60px auto"><h3>관리자 페이지 불러오기 실패</h3><p class="error">${esc(ex(err))}</p><button class="btn secondary" onclick="location.reload()">새로고침</button></div>`}})}else mountAuth(root,{signup:false});


</script>
