// ===== ADMIN PAGE =====
const root=$('#root');
// 로그아웃하면 이 초기값으로 되돌립니다(P0-09).
const adminInitialState=()=>({user:null,profile:null,classes:[],classId:'',classFilter:'all',weeks:[],weekId:'',page:'overview',weekTab:'assignment',feedbackTab:'submissions',preview:{},pendingDeletes:[],voiceDrafts:{},live:{},activeQuestionId:'',feedbackSelectedUid:'',feedbackSearch:'',feedbackFilter:'all',feedbackRenderToken:0,questionSearch:'',questionNameMap:new Map(),attendanceWeekId:''});
const A=adminInitialState();
// 계정마다 마지막으로 본 반을 따로 기억합니다.
const classPrefKey=()=>'spanish-lms-admin-class:'+(A.user?.uid||'');
const activeClass=()=>A.classes.find(c=>c.id===A.classId);
const activeWeek=()=>A.weeks.find(w=>w.id===A.weekId);
function adminStopLive(key){if(A.live[key]){A.live[key]();delete A.live[key]}}
function adminClearLive(){for(const key of Object.keys(A.live))adminStopLive(key)}
// 로그아웃 때 실시간 연결·녹음·음성 초안·화면 상태를 모두 정리합니다(P0-09).
function resetAdminSession(){
  stopRecordingForNavigation();
  adminClearLive();
  Object.assign(A,adminInitialState());
}
window.addEventListener('beforeunload',e=>{if(A.user&&(isRecording()||Object.keys(A.voiceDrafts).length||isFeedbackTextDirty())){e.preventDefault();e.returnValue=''}});
function adminLiveError(err){console.error('실시간 연결 실패',err);toast('실시간 구독 오류: '+ex(err),true)}
const weekKey=(cid,wid)=>`classes/${cid}/weeks/${wid}`;
const codeGen=()=>Array.from(crypto.getRandomValues(new Uint8Array(8))).map(n=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[n%32]).join('');
// 코드만으로 입장하기 위한 비공개 목록 없는 단일 조회용 연결표.
// 기존 반은 강사 페이지에 로그인하면 자동으로 수강 코드 연결표가 생성됩니다.
async function syncJoinCodes(classes){
  for(const c of classes){
    if(!c.joinCode)continue;
    try{
      const r=doc(db,'joinCodes',String(c.joinCode).toUpperCase());
      const snap=await getDoc(r);
      if(!snap.exists() || snap.data().classId!==c.id){
        await setDoc(r,{classId:c.id,createdBy:A.user.uid,updatedAt:serverTimestamp()});
      }
    }catch(err){console.warn('수강 코드 연결표 동기화 실패:',c.name,err);toast('수강 코드 설정 확인이 필요합니다. 새 Firestore 규칙을 적용해 주세요.',true);}
  }
}
async function uniqueJoinCode(){
  for(let i=0;i<6;i++){
    const code=codeGen();
    if(!(await getDoc(doc(db,'joinCodes',code))).exists())return code;
  }
  throw Error('새 수강 코드를 발급하지 못했습니다. 다시 시도해 주세요.');
}
function enterHistory(){if(history.state?.senorayu)return;history.replaceState({senorayu:true,page:'overview'},'');history.pushState({senorayu:true,page:A.page},'','#'+A.page)}
window.addEventListener('popstate',e=>{if(!A.user||!document.querySelector('.admin-shell'))return;A.page=e.state?.senorayu?e.state.page:'overview';renderPage()});
function navigateAdminPage(key){if(A.page!==key){A.page=key;history.pushState({senorayu:true,page:key},'','#'+key)}renderPage()}

const SIDE_ICONS={
 overview:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
 classes:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h5"/>',
 students:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 11a3 3 0 0 0 0-6M18 14a5 5 0 0 1 3 5v1"/>',
 weeks:'<path d="M12 7C8 4 5 4 2 5v14c3-1 6-1 10 2 4-3 7-3 10-2V5c-3-1-6-1-10 2zM12 7v14"/>',
 feedback:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h10M7 13h7M7 17h4"/>',
 questions:'<path d="M20 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-3-.4-4.2-1.1L3 20l1.2-4.2A8.5 8.5 0 1 1 20 11.5z"/><path d="M9.5 10a2.5 2.5 0 0 1 5 0c0 1.4-2.5 1.7-2.5 3M12 16h.01"/>',
 attendance:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6M17 2v6M3 10h18m-13 6 2 2 4-4"/>'
};
function sideIcon(name){return `<svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${SIDE_ICONS[name]||SIDE_ICONS.overview}</svg>`}
function shortDate(ts){if(!ts)return '—';const d=ts.toDate?.()??new Date(ts);return isNaN(+d)?'—':`${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,'0')}. ${String(d.getDate()).padStart(2,'0')}.`}

// v7: 반별 수업 날짜는 클래스 schedule과 각 weeks 문서에 연결해 과거 출석기록을 보존합니다.
function classSchedule(c){
  if(Array.isArray(c?.schedule)&&c.schedule.length)return c.schedule.map((s,i)=>({weekId:s.weekId||'',label:s.label||`${i+1}차시`,date:s.date||''}));
  return A.weeks.filter(w=>!c||c.id===A.classId).map((w,i)=>({weekId:w.id,label:w.label||`${i+1}차시`,date:w.sessionDate||''}));
}
async function openClassRoster(cid){
  if(!A.classes.some(c=>c.id===cid))return;
  adminClearLive();A.classId=cid;localStorage.setItem(classPrefKey(),cid);A.weekId='';
  await loadWeeks();frame();navigateAdminPage('students');
}
async function classEditor(c=null){
 const existing=c?await getDocs(collection(db,'classes',c.id,'weeks')):null;
 const weeks=existing?existing.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0)):[];
 const stored=Array.isArray(c?.schedule)?c.schedule:[];
 const known=new Map(stored.map(x=>[x.weekId,x]));
 const rows=weeks.length?weeks.map((w,i)=>({weekId:w.id,label:w.label||`${i+1}차시`,date:known.get(w.id)?.date||w.sessionDate||'',original:true})):
     stored.length?stored.map((w,i)=>({...w,original:!!w.weekId})):Array.from({length:8},(_,i)=>({weekId:'',label:`${i+1}차시`,date:'',original:false}));
 const promise=new Promise(resolve=>{
   document.querySelector('.app-modal-backdrop')?.remove();
   const layer=document.createElement('div');layer.className='app-modal-backdrop';
   layer.innerHTML=`<section class="app-modal course-editor-modal" role="dialog" aria-modal="true" aria-labelledby="course-dialog-title"><div class="app-modal-head"><div><div class="eyebrow">CLASS & SCHEDULE</div><h2 id="course-dialog-title">${c?'클래스 · 수업일정 수정':'새 클래스 개설'}</h2></div><button type="button" class="app-modal-x" aria-label="닫기">×</button></div><form id="course-form" class="stack"><div class="grid2"><div class="field"><label>클래스 이름</label><input id="course-name" maxlength="80" required value="${esc(c?.name||'')}" placeholder="예: 스페인어 초급반"></div><div class="field"><label>클래스 소개 (선택)</label><input id="course-description" maxlength="200" value="${esc(c?.description||'')}" placeholder="예: 화요일 저녁반"></div></div><div class="course-date-heading"><div><h3>차시별 수업 날짜</h3><p class="hint">날짜를 아직 모른다면 비워두셔도 됩니다. 나중에 언제든 수정할 수 있습니다.</p></div><button type="button" class="btn secondary small" id="course-weekly">7일 간격 채우기</button></div><div class="course-date-fields" id="course-date-fields"></div><div class="row"><button type="button" class="btn soft small" id="course-add-session">+ 차시 추가</button><span class="hint" id="course-date-help">기존 차시는 학습 기록을 보호하기 위해 삭제하지 않습니다.</span></div><div id="course-error" class="error" role="alert"></div><div class="app-modal-actions"><button type="button" class="btn secondary" id="course-cancel">취소</button><button class="btn" id="course-submit" type="submit">${c?'변경사항 저장':'클래스 만들기'}</button></div></form></section>`;
   document.body.appendChild(layer);document.body.classList.add('modal-open');
   const wrap=layer.querySelector('#course-date-fields');
   const draw=()=>{wrap.innerHTML=rows.map((r,i)=>`<div class="course-date-row" data-session="${i}"><span class="course-date-number">${i+1}</span><label class="field"><span class="sr-only">${i+1}차시 이름</span><input data-session-label maxlength="80" value="${esc(r.label||`${i+1}차시`)}" required aria-label="${i+1}차시 이름"></label><label class="field"><span class="sr-only">${i+1}차시 날짜</span><input type="date" data-session-date value="${esc(r.date||'')}" aria-label="${i+1}차시 날짜"></label>${r.original?'<span class="course-lock" title="기존 기록 보존">유지</span>':`<button type="button" class="db-light-button" data-remove-session="${i}" aria-label="${i+1}차시 제거">×</button>`}</div>`).join('');wrap.querySelectorAll('[data-remove-session]').forEach(b=>b.onclick=()=>{readRows();if(rows.length<=1)return;rows.splice(Number(b.dataset.removeSession),1);draw()})};
   const readRows=()=>{wrap.querySelectorAll('[data-session]').forEach(row=>{const r=rows[Number(row.dataset.session)];if(r){r.label=row.querySelector('[data-session-label]').value.trim();r.date=row.querySelector('[data-session-date]').value}})};
   draw();
   const done=v=>{layer.remove();document.body.classList.remove('modal-open');document.removeEventListener('keydown',onKey);resolve(v)};
   const onKey=e=>{if(e.key==='Escape')done(null)};document.addEventListener('keydown',onKey);
   layer.querySelector('#course-cancel').onclick=()=>done(null);layer.querySelector('.app-modal-x').onclick=()=>done(null);
   layer.querySelector('#course-add-session').onclick=()=>{readRows();if(rows.length>=52)return toast('최대 52차시까지 등록할 수 있습니다.',true);rows.push({weekId:'',label:`${rows.length+1}차시`,date:'',original:false});draw();wrap.lastElementChild?.scrollIntoView({block:'nearest',behavior:'smooth'})};
   layer.querySelector('#course-weekly').onclick=()=>{readRows();const start=rows.find(r=>r.date)?.date;if(!start){toast('먼저 첫 수업 날짜를 선택해 주세요.',true);return}const first=rows.findIndex(r=>r.date);const from=new Date(start+'T12:00:00');rows.forEach((r,i)=>{if(i>=first){const d=new Date(from);d.setDate(d.getDate()+7*(i-first));r.date=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}});draw()};
   layer.querySelector('#course-form').onsubmit=e=>{e.preventDefault();readRows();const name=layer.querySelector('#course-name').value.trim(),description=layer.querySelector('#course-description').value.trim();if(!name||rows.some(r=>!r.label)){layer.querySelector('#course-error').textContent='클래스 이름과 차시 이름을 확인해 주세요.';return}done({name,description,sessions:rows})};
   layer.querySelector('#course-name').focus();
 });
 const data=await promise;if(!data)return;
 try{
   const cid=c?.id||doc(collection(db,'classes')).id;
   const entries=data.sessions.map((r,i)=>({weekId:r.weekId||doc(collection(db,'classes',cid,'weeks')).id,label:r.label,date:r.date,order:i+1}));
   const batch=writeBatch(db);
   for(const e of entries){const old=weeks.find(w=>w.id===e.weekId);const ref=doc(db,'classes',cid,'weeks',e.weekId);
      if(!old){batch.set(ref,{label:e.label,order:e.order,sessionDate:e.date,published:false,assignment:{enabled:false,title:'',instructions:'',allowText:true,allowAudio:true,dueAt:''},quiz:{enabled:false,title:'단어 복습',questions:[]},preview:{enabled:false,title:'다음 차시',mode:'rich',richHtml:'',imagePath:'',videos:[],files:[]},createdAt:serverTimestamp()})}
      else{batch.update(ref,{label:e.label,sessionDate:e.date,updatedAt:serverTimestamp()})}
   }
   const schedule=entries.map(({weekId,label,date})=>({weekId,label,date}));
   if(c){batch.update(doc(db,'classes',cid),{name:data.name,description:data.description,schedule,updatedAt:serverTimestamp()})}
   else{const code=await uniqueJoinCode();batch.set(doc(db,'classes',cid),{name:data.name,description:data.description,schedule,joinCode:code,archived:false,createdAt:serverTimestamp(),createdBy:A.user.uid});batch.set(doc(db,'joinCodes',code),{classId:cid,createdBy:A.user.uid,updatedAt:serverTimestamp()})}
   await batch.commit();
   toast(c?'클래스와 수업 날짜를 수정했습니다.':'클래스를 개설하고 차시를 만들었습니다.');A.page='classes';await loadAdmin(cid);
 }catch(err){toast('클래스 저장에 실패했습니다: '+ex(err),true)}
}
async function showStudentAttendance(student){
 const cid=A.classId;const sch=classSchedule(activeClass());
 if(!sch.length){toast('클래스 수정에서 차시별 날짜를 먼저 등록해 주세요.',true);return}
 const records=await Promise.all(sch.map(async s=>{try{const d=await getDoc(doc(db,'classes',cid,'weeks',s.weekId,'attendance',student.uid));const raw=d.exists()?d.data():null;return {...s,exists:!!raw,value:attendanceValue(raw?.status),note:raw?.note||''}}catch(e){return {...s,exists:false,value:'',note:'',error:ex(e)}}}));
 const layer=document.createElement('div');layer.className='app-modal-backdrop';document.querySelector('.app-modal-backdrop')?.remove();
 layer.innerHTML=`<section class="app-modal student-attendance-modal" role="dialog" aria-modal="true" aria-labelledby="student-attendance-title"><header class="app-modal-head"><div><div class="eyebrow">ASISTENCIA</div><h2 id="student-attendance-title">${esc(student.studentName)} · 출석현황</h2><p class="hint">${esc(activeClass()?.name||'')} · 전체 ${records.length}차시</p></div><button class="app-modal-x" type="button" aria-label="닫기">×</button></header><form id="student-attendance-form"><div class="student-attendance-list">${records.map((r,i)=>`<div class="student-attendance-row" data-att-row="${i}"><div><strong>${esc(r.label)}</strong><small>${esc(r.date||'날짜 미정')}</small></div><select class="input" data-att-status aria-label="${esc(r.label)} 출결">${attendanceOptions.map(([v,label])=>`<option value="${v}" ${v===(r.value||'unchecked')?'selected':''}>${label}</option>`).join('')}</select><input class="input" data-att-note value="${esc(r.note)}" maxlength="200" placeholder="메모 (선택)" aria-label="${esc(r.label)} 출결 메모"></div>`).join('')}</div><div class="app-modal-actions"><button type="button" class="btn secondary" id="student-attendance-close">취소</button><button class="btn" id="student-attendance-save" type="submit">출석현황 저장</button></div></form></section>`;
 document.body.appendChild(layer);document.body.classList.add('modal-open');
 const close=()=>{layer.remove();document.body.classList.remove('modal-open');document.removeEventListener('keydown',onKey)};
 const onKey=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',onKey);
 layer.querySelector('.app-modal-x').onclick=close;layer.querySelector('#student-attendance-close').onclick=close;
 layer.querySelector('#student-attendance-form').onsubmit=async e=>{e.preventDefault();const btn=layer.querySelector('#student-attendance-save');
   // P0-01: 바뀐 차시만 저장합니다. '미입력'으로 되돌린 차시는 저장된 기록을 지웁니다.
   const changes=[...layer.querySelectorAll('[data-att-row]')].map(node=>{const r=records[Number(node.dataset.attRow)],raw=node.querySelector('[data-att-status]').value;return {r,value:raw==='unchecked'?'':raw,note:node.querySelector('[data-att-note]').value.trim()}}).filter(x=>x.value!==x.r.value||x.note!==x.r.note);
   if(!changes.length){toast('바뀐 내용이 없습니다.');return}
   const removals=changes.filter(x=>!x.value&&x.r.exists).length;
   if(removals&&!await modalConfirm(`출결 기록 ${removals}건을 '미입력'으로 되돌리면 저장된 기록이 삭제됩니다. 계속할까요?`))return;
   btn.disabled=true;
   try{const batch=writeBatch(db);changes.forEach(({r,value,note})=>{const ref=doc(db,'classes',cid,'weeks',r.weekId,'attendance',student.uid);if(value)batch.set(ref,{status:value,note,updatedAt:serverTimestamp()},{merge:true});else if(r.exists)batch.delete(ref)});await batch.commit();toast(`${student.studentName}님의 출결 ${changes.length}건을 저장했어요.`);close()}catch(err){toast(ex(err),true);btn.disabled=false}};
}
function frame(){
  enterHistory();

async function loadAdmin(preferred=''){const cs=await getDocs(collection(db,'classes'));A.classes=cs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));await syncJoinCodes(A.classes);const choice=preferred||A.classId||localStorage.getItem(classPrefKey());A.classId=A.classes.some(c=>c.id===choice)?choice:(A.classes.find(c=>!c.archived)?.id||A.classes[0]?.id||'');if(A.classId){localStorage.setItem(classPrefKey(),A.classId);await loadWeeks();await syncMemberDirectory().catch(e=>console.warn('명단 동기화 실패',e))}else{A.weeks=[];A.weekId=''}frame()}

async function roster(){
  const snap=await getDocs(query(collection(db,'enrollments'),where('classId','==',A.classId)));
  const members=snap.docs.map(d=>({id:d.id,...d.data()}));
  // 학생 등록 시점의 복사본 대신 최신 users 프로필을 사용합니다.
  // 과거 가입 오류로 studentName="수강생"이 저장된 경우도 이름을 복구합니다.
  const profiles=await Promise.all(members.map(async member=>{
    try{const user=await getDoc(doc(db,'users',member.uid));return user.exists()?user.data():null}
    catch(e){console.warn('프로필을 읽지 못했습니다',member.uid,e);return null}
  }));
  return members.map((m,i)=>{
    const p=profiles[i]||{};
    // 예전에는 가입 이름을 enrollment.studentName에 복사해 두었습니다.
    // 프로필의 realName이 아직 없다면 그 당시 가입명을 우선 사용합니다.
    const storedReal=[p.realName,m.realName,m.studentName,p.displayName].map(x=>String(x||'').trim()).find(x=>x&&x!=='수강생')||'';
    const storedAlias=String(p.nickname||'').trim();
    const legacyAlias=!storedAlias && !p.realName && p.displayName && p.displayName!==storedReal && p.displayName!=='수강생' ? String(p.displayName).trim():'';
    const nickname=storedAlias||legacyAlias;
    const publicName=nickname||storedReal||'이름 미등록';
    return {...m,realName:storedReal,nickname,publicName,
      studentName:nickname && nickname!==storedReal ? `${nickname}(${storedReal||'실명 확인 필요'})` : publicName,
      email:p.email||m.email||'',hasGenericName:!storedReal};
  }).sort((a,b)=>(a.studentName||'').localeCompare(b.studentName||'','ko'));
}
async function syncMemberDirectory(){

  const writes=members.filter(m=>m.uid && (prev.get(m.uid)?.name!==m.publicName||prev.get(m.uid)?.status!==m.status));
  for(let i=0;i<writes.length;i+=350){const batch=writeBatch(db);for(const m of writes.slice(i,i+350)){batch.set(doc(db,'classes',cid,'members',m.uid),{uid:m.uid,name:m.publicName,status:m.status,joinedAt:m.joinedAt||serverTimestamp()},{merge:true})}await batch.commit()}
}

// Firestore는 상위 문서만 삭제해도 하위 컬렉션이 지워지지 않습니다. 모든 알려진 하위 경로를 먼저 지웁니다.
async function deleteClassDeep(c){
  const cid=c.id,paths=new Set();
  await updateDoc(doc(db,'classes',cid),{archived:true,updatedAt:serverTimestamp()});
  async function purgeDocs(ref){const snap=await getDocs(ref);for(let i=0;i<snap.docs.length;i+=350){const batch=writeBatch(db);snap.docs.slice(i,i+350).forEach(x=>batch.delete(x.ref));await batch.commit()}return snap.docs}
  const weeks=await getDocs(collection(db,'classes',cid,'weeks'));
  for(const w of weeks.docs){
    const wd=w.data(),wid=w.id,p=wd.preview||{};
    if(p.imagePath)paths.add(p.imagePath);(p.videos||[]).forEach(x=>x.path&&paths.add(x.path));(p.files||[]).forEach(x=>x.path&&paths.add(x.path));
    for(const name of ['submissions','quizResults']){
      const docs=await getDocs(collection(db,'classes',cid,'weeks',wid,name));
      for(const d of docs.docs){const data=d.data();if(data.audioPath)paths.add(data.audioPath);if(data.feedback?.audioPath)paths.add(data.feedback.audioPath);(data.feedbacks||[]).forEach(f=>f.audioPath&&paths.add(f.audioPath));if(name==='quizResults')await purgeDocs(collection(db,'classes',cid,'weeks',wid,'quizResults',d.id,'attempts'))}
      await purgeDocs(collection(db,'classes',cid,'weeks',wid,name));
    }
    await purgeDocs(collection(db,'classes',cid,'weeks',wid,'attendance'));
  }
  await purgeDocs(collection(db,'classes',cid,'weeks'));
  const questions=await getDocs(collection(db,'classes',cid,'questions'));
  for(const q of questions.docs)await purgeDocs(collection(db,'classes',cid,'questions',q.id,'replies'));
  await purgeDocs(collection(db,'classes',cid,'questions'));
  await purgeDocs(collection(db,'classes',cid,'members'));
  await purgeDocs(collection(db,'classes',cid,'teacherNotes'));
  const enrollments=await getDocs(query(collection(db,'enrollments'),where('classId','==',cid)));
  for(const e of enrollments.docs){const uid=e.data().uid;const ref=doc(db,'users',uid),snap=await getDoc(ref);if(snap.exists()&&snap.data().assignedClassId===cid)await updateDoc(ref,{assignedClassId:deleteField()})}
  for(let i=0;i<enrollments.docs.length;i+=350){const batch=writeBatch(db);enrollments.docs.slice(i,i+350).forEach(e=>batch.delete(e.ref));await batch.commit()}
  if(c.joinCode)await deleteDoc(doc(db,'joinCodes',String(c.joinCode).toUpperCase()));
  // 직접 관리 중인 등록 파일을 정리합니다. 오래된 미참조 파일은 Storage에 잔존할 수 있습니다.
  let fileFailures=0;for(const path of paths){try{await deleteObject(storageRef(storage,path))}catch(e){if(e.code!=='storage/object-not-found'){fileFailures++;console.warn('파일 정리 필요',path,e)}}}
  await deleteDoc(doc(db,'classes',cid));
  if(A.classId===cid){A.classId='';localStorage.removeItem(classPrefKey())}
  if(fileFailures)toast(`반은 삭제되었습니다. 파일 ${fileFailures}개는 Storage에서 직접 정리해야 합니다.`,true);
}

async function deleteWeekDeep(cid,wid){
  const rootRef=doc(db,'classes',cid,'weeks',wid),ws=await getDoc(rootRef);if(!ws.exists())throw Error('이미 삭제된 주차입니다.');
  // 문서만 삭제하면 하위 컬렉션이 남으므로 시도 기록 → 제출/퀴즈 → 출석 → 주차 순으로 삭제합니다.
  const paths=new Set(),p=ws.data().preview||{};
  if(p.imagePath)paths.add(p.imagePath);
  for(const item of [...(p.videos||[]),...(p.files||[])])if(item.path)paths.add(item.path);
  async function clearDocs(ref){const snap=await getDocs(ref);for(let i=0;i<snap.docs.length;i+=350){const batch=writeBatch(db);snap.docs.slice(i,i+350).forEach(x=>batch.delete(x.ref));await batch.commit()}return snap.docs}
  for(const kind of ['submissions','quizResults']){
    const data=await getDocs(collection(db,'classes',cid,'weeks',wid,kind));
    for(const d of data.docs){const value=d.data();if(value.audioPath)paths.add(value.audioPath);if(value.feedback?.audioPath)paths.add(value.feedback.audioPath);
      for(const fb of value.feedbacks||[])if(fb.audioPath)paths.add(fb.audioPath);
      if(kind==='quizResults')await clearDocs(collection(db,'classes',cid,'weeks',wid,'quizResults',d.id,'attempts'));
    }
    await clearDocs(collection(db,'classes',cid,'weeks',wid,kind));
  }
  await clearDocs(collection(db,'classes',cid,'weeks',wid,'attendance'));
  const c=A.classes.find(x=>x.id===cid),schedule=classSchedule(c).filter(x=>x.weekId!==wid);
  const batch=writeBatch(db);batch.delete(rootRef);batch.update(doc(db,'classes',cid),{schedule,updatedAt:serverTimestamp()});await batch.commit();
  if(c)c.schedule=schedule;
  let failed=0;for(const path of paths){try{await deleteObject(storageRef(storage,path))}catch(e){if(e.code!=='storage/object-not-found'){failed++;console.warn('미디어 삭제 실패',path,e)}}}
  if(failed)toast(`주차는 삭제됐지만 Storage 파일 ${failed}개는 별도 확인이 필요합니다.`,true);
}
// 구버전 {correctIndex} 데이터도 그대로 지원합니다.
function normalizeQuestion(q={}){
  const type=['single','multiple','ox'].includes(q.type)?q.type:'single';
  let options=type==='ox'?['O','X']:Array.isArray(q.options)?q.options.slice(0,12):['','','',''];
  if(type!=='ox' && options.length<2)options=[...options,...Array(2-options.length).fill('')];
  let correctIndices=Array.isArray(q.correctIndices)?q.correctIndices.map(Number):[Number(q.correctIndex??0)];
  correctIndices=[...new Set(correctIndices.filter(i=>Number.isInteger(i)&&i>=0&&i<options.length))];
  if(type!=='multiple')correctIndices=correctIndices.slice(0,1);
  if(!correctIndices.length)correctIndices=[0];
  return {id:q.id||makeId(),type,stem:q.stem||'',options,correctIndices,correctIndex:correctIndices[0],explanation:q.explanation||''};
}
function newQuestion(type='single') {return normalizeQuestion({type,options:type==='ox'?['O','X']:['','','','']})}

  <div class="field" style="margin-top:12px"><label>해설 (선택)</label><input data-explanation maxlength="1000" value="${esc(q.explanation)}" placeholder="학습자에게 보여줄 해설"></div>
  </div>`;
}

function validateQuizQuestions(qs){
  if(!qs.length)throw Error('복습 퀴즈에는 최소 한 문항이 필요합니다.');
  if(qs.length>200)throw Error('한 주차의 퀴즈는 최대 200문항까지 등록할 수 있습니다.');
  qs.forEach((q,i)=>{
    const pos=`${i+1}번 문항`;
    if(!q.stem)throw Error(`${pos}: 문제를 입력해 주세요.`);
    if(q.options.length<2||q.options.length>12||q.options.some(x=>!x))throw Error(`${pos}: 모든 선택지를 입력해 주세요 (2~12개).`);
    if(!q.correctIndices.length)throw Error(`${pos}: 정답을 선택해 주세요.`);
    if(q.type!=='multiple'&&q.correctIndices.length!==1)throw Error(`${pos}: 정답을 하나 지정해 주세요.`);
    if(q.type==='multiple'&&q.correctIndices.length<2)throw Error(`${pos}: 복수정답은 정답을 두 개 이상 지정해 주세요.`);
  });
}

async function updateFeedbackItem(cid,wid,kind,uid,position,operation){

  await runTransaction(db,async tx=>{
    const snap=await tx.get(ref);if(!snap.exists())throw Error('제출 문서를 찾을 수 없습니다.');const data=snap.data();const list=[...(data.feedbacks||[])];const existing=position===-1?data.feedback:list[position];
    if(!existing || existing.createdAt!==old.createdAt || existing.text!==old.text || existing.audioPath!==old.audioPath)throw Error('피드백이 그 사이 변경되었습니다. 다시 열어 주세요.');

    else {if(operation==='delete')list.splice(position,1);else list[position]={...existing,text:text.trim(),updatedAt:new Date().toISOString()};tx.update(ref,{feedbacks:list})}
  });
  if(operation==='delete'&&old.audioPath){try{await deleteObject(storageRef(storage,old.audioPath))}catch(e){if(e.code!=='storage/object-not-found')console.warn('삭제한 댓글의 음성 파일 정리 실패',e)}}

function defaultSessionId(list){

async function activateEnrollment(student,targetClassId){
  const uid=student.uid,target=A.classes.find(c=>c.id===targetClassId);
  if(!target)throw Error('반 정보를 찾을 수 없습니다.');
  const snap=await getDocs(query(collection(db,'enrollments'),where('uid','==',uid)));
  const targetId=enId(uid,targetClassId),batch=writeBatch(db);
  const publicName=student.publicName||student.studentName||'',realName=student.realName||student.studentName||'';
  for(const d of snap.docs){
    const e=d.data();
    if(d.id!==targetId&&e.status==='active'){
      batch.update(d.ref,{status:'transferred'});
      batch.set(doc(db,'classes',e.classId,'members',uid),{uid,name:publicName,status:'transferred'},{merge:true});
    }
  }
  if(snap.docs.some(d=>d.id===targetId))batch.update(doc(db,'enrollments',targetId),{status:'active'});
  else batch.set(doc(db,'enrollments',targetId),{uid,classId:targetClassId,studentName:realName,email:student.email||'',joinCode:target.joinCode||'',status:'active',joinedAt:serverTimestamp()});
  batch.set(doc(db,'classes',targetClassId,'members',uid),{uid,name:publicName,status:'active',joinedAt:serverTimestamp()},{merge:true});
  batch.update(doc(db,'users',uid),{assignedClassId:targetClassId});
  try{await batch.commit()}
  catch(e){if(e?.code==='permission-denied')throw Error('권한이 없어 반을 옮기지 못했어요. Firestore 규칙에서 강사의 수강 등록 생성을 허용해야 합니다(저장소의 firestore.rules 참고).');throw e}
}

          await updateDoc(doc(db,'enrollments',student.id),{studentName:trimmed});
          await setDoc(doc(db,'classes',cid,'members',student.uid),{uid:student.uid,name:publicName,status:student.status},{merge:true});
          Object.assign(student,{realName:trimmed,nickname,publicName,studentName:nickname?`${nickname}(${trimmed})`:trimmed,hasGenericName:false});
          toast('실명을 수정했습니다.');renderRows();
        }catch(err){toast(ex(err),true)}
      });
      $$('[data-move-student]',list).forEach(el=>el.onclick=async()=>{
        const student=students.find(x=>x.uid===el.dataset.moveStudent);if(!student)return;
        const destinations=A.classes.filter(c=>!c.archived&&c.id!==cid);
        if(!destinations.length){toast('이동할 다른 운영 반을 먼저 개설해 주세요.',true);return}
        const answer=await modalDialog({title:'반 이동',message:`${student.studentName}님이 이동할 반을 선택해 주세요.`,choices:destinations.map(c=>({value:c.id,label:c.name})),confirmText:'반 이동'});if(answer===null)return;
        const target=destinations.find(c=>c.id===answer);if(!target){toast('반 번호를 확인해 주세요.',true);return}
        if(!await modalConfirm(`${student.studentName}님을 ${target.name}(으)로 이동할까요?\n이전 반의 학습 기록은 보존되지만 새 반에 복사되지 않습니다.`))return;
        try{await activateEnrollment(student,target.id);toast('수강생의 반 이동이 완료되었습니다.');await showStudents(b)}
        catch(e){toast(ex(e),true)}
      });
      $$('[data-status-uid]',list).forEach(el=>el.onclick=async()=>{
        const student=students.find(x=>x.uid===el.dataset.statusUid);if(!student)return;
        try{
          if(student.status==='active'){
            if(!await modalConfirm(`${student.studentName}님을 수강 중지할까요?\n학습 기록은 그대로 보존됩니다.`))return;
            await updateDoc(doc(db,'enrollments',student.id),{status:'inactive'});
            await setDoc(doc(db,'classes',cid,'members',student.uid),{uid:student.uid,name:student.publicName,status:'inactive'},{merge:true});
            toast('수강을 중지했어요.');
          }else{
            // D4: 다른 반을 수강 중이면 그 반은 '반 이동'으로 바뀌고 이 반만 수강 중이 됩니다.
            const others=await otherActiveClasses(student.uid,cid);
            const message=others.length?`${student.studentName}님은 지금 ${others.map(c=>c.name).join(', ')}을(를) 수강 중이에요.\n이 반(${activeClass()?.name||''})으로 다시 옮길까요?`:`${student.studentName}님을 다시 수강 중으로 바꿀까요?`;
            if(!await modalConfirm(message))return;
            await activateEnrollment(student,cid);
            toast('다시 수강 중으로 바꿨어요.');
          }
          await showStudents(b);
        }catch(err){toast(ex(err),true)}
      });
      $$('[data-keep-class]',list).forEach(el=>el.onclick=async()=>{
        const student=students.find(x=>x.uid===el.dataset.keepClass);if(!student)return;
        if(!await modalConfirm(`${student.studentName}님의 다른 반 수강을 '반 이동'으로 정리하고 이 반만 남길까요?`))return;
        try{await activateEnrollment(student,cid);toast('이 반만 수강 중으로 정리했어요.');await showStudents(b)}catch(err){toast(ex(err),true)}
      });
    }
    $('#roster-search').addEventListener('input',renderRows);
    $('#roster-status').addEventListener('change',renderRows);
    renderRows();
    let initialMemberEvent=true;
    A.live.studentsMembers=onSnapshot(collection(db,'classes',cid,'members'),async()=>{
      if(initialMemberEvent){initialMemberEvent=false;return}
      if(A.page!=='students'||A.classId!==cid||!list.isConnected)return;
      if(document.activeElement?.matches('input,textarea,select'))return;
      students=await roster();
      if(A.page!=='students'||A.classId!==cid||!list.isConnected)return;
      const activeCount=students.filter(x=>x.status==='active').length;
      $('#roster-count').textContent=activeCount;
      $('#roster-total').textContent=`${activeCount}명 수강 중 · 전체 ${students.length}명`;
      renderRows();
    },adminLiveError);
    let initial=true;
    A.live.students=onSnapshot(query(collection(db,'enrollments'),where('classId','==',cid)),()=>{
      if(initial){initial=false;return}
      if(A.page!=='students'||A.classId!==cid)return;
      if(document.activeElement?.matches('input,textarea,select')){toast('수강생 명단에 변경사항이 있습니다. 메뉴를 다시 열면 갱신됩니다.');return}
      showStudents(b);
    },adminLiveError);
  }catch(err){loaded(list,`<div class="roster-error error">${esc(ex(err))}</div>`)}
}
if(CONFIGURED){onAuthStateChanged(auth,async user=>{try{if(!user){resetAdminSession();mountAuth(root,{signup:false,variant:'admin'});return}root.innerHTML='<div class="loading" style="min-height:95vh">강사 권한을 확인하고 있습니다</div>';A.user=user;const snap=await getDoc(doc(db,'users',user.uid));if(!snap.exists()||snap.data().role!=='admin'){root.innerHTML=`<div class="card" style="max-width:620px;margin:8vh auto"><div class="eyebrow">ACCESS CONTROL</div><h2>강사 권한이 필요합니다</h2><p style="margin-top:12px">관리자 계정은 가입만으로 생성되지 않습니다. Firebase Authentication에 강사 계정을 만든 뒤, Firestore <code>users/${esc(user.uid)}</code> 문서의 <code>role</code> 필드를 <code>admin</code>으로 등록해 주세요.</p><div class="subtle" style="margin-top:18px"><strong>현재 로그인 UID</strong><p style="overflow-wrap:anywhere">${esc(user.uid)}</p></div><div class="row" style="margin-top:18px"><button class="btn secondary" id="admin-signout">다른 계정으로 로그인</button><a class="btn soft" href="index.html">수강생 페이지</a></div></div>`;$('#admin-signout').onclick=()=>{resetAdminSession();signOut(auth)};return}A.profile=snap.data();await loadAdmin()}catch(err){root.innerHTML=`<div class="card" style="max-width:570px;margin:60px auto"><h3>관리자 페이지 불러오기 실패</h3><p class="error">${esc(ex(err))}</p><button class="btn secondary" onclick="location.reload()">새로고침</button></div>`}})}else mountAuth(root,{signup:false});


</script>
</body>
