async function syncJoinCodes(classes){
  for(const c of classes){
    if(!c.joinCode)continue;
    try{
      const r=doc(db,'joinCodes',String(c.joinCode).toUpperCase());
      const snap=await getDoc(r);
      if(!snap.exists() || snap.data().classId!==c.id){
        await setDoc(r,{classId:c.id,createdBy:A.user.uid,updatedAt:serverTimestamp()});
      }
    }catch(err){console.warn('수강 코드 연결표 동기화 실패:',c.name,err);toast('수강 코드 설정 확인이 필요합니다. 새 Firestore 규칙을 적용해 주세요.',true);}
  }
}
async function uniqueJoinCode(){
  for(let i=0;i<6;i++){
    const code=codeGen();
    if(!(await getDoc(doc(db,'joinCodes',code))).exists())return code;
  }
  throw Error('새 수강 코드를 발급하지 못했습니다. 다시 시도해 주세요.');
}

// 배치 08: 차시 정보의 기준은 weeks 문서입니다. 반 문서의 schedule은 학생 화면용 사본(학생은 비공개 차시 문서를 못 읽음)이고,
// 차시를 만들고·고치고·지우는 모든 경로에서 같은 일괄 쓰기로 정렬 번호 순 사본을 다시 씁니다.
function scheduleFromWeeks(weeks){
  return [...weeks].sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0)||String(a.label||'').localeCompare(String(b.label||''),'ko'))
    .map(w=>({weekId:w.id,label:w.label||'',date:w.sessionDate||''}));
}
function syncClassSchedule(batch,cid,weeks){
  const schedule=scheduleFromWeeks(weeks);
  batch.update(doc(db,'classes',cid),{schedule,updatedAt:serverTimestamp()});
  const c=A.classes.find(x=>x.id===cid);if(c)c.schedule=schedule;
  return schedule;
}
// 새 차시 문서의 기본값(반 수정 모달과 '+ 새 차시'가 함께 씁니다)
function newWeekDoc({label,order,date=''}){
  return {label,order,sessionDate:date,published:false,
    assignment:{enabled:false,title:'',instructions:'',allowText:true,allowAudio:true,dueAt:'',dueAtTs:null},
    quiz:{enabled:false,title:'단어 복습',questions:[]},
    preview:{enabled:false,title:'',mode:'rich',richHtml:'',imagePath:'',videos:[],files:[]},
    recap:{enabled:false,videos:[]},
    createdAt:serverTimestamp()};
}

function classSchedule(c){
  if(Array.isArray(c?.schedule)&&c.schedule.length)return c.schedule.map((s,i)=>({weekId:s.weekId||'',label:s.label||`${i+1}차시`,date:s.date||''}));

}

async function classEditor(c=null){
 const existing=c?await getDocs(collection(db,'classes',c.id,'weeks')):null;
 const weeks=existing?existing.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0)):[];
 const stored=Array.isArray(c?.schedule)?c.schedule:[];
 const known=new Map(stored.map(x=>[x.weekId,x]));
 const rows=weeks.length?weeks.map((w,i)=>({weekId:w.id,label:w.label||`${i+1}차시`,date:known.get(w.id)?.date||w.sessionDate||'',original:true})):
     stored.length?stored.map((w,i)=>({...w,original:!!w.weekId})):Array.from({length:8},(_,i)=>({weekId:'',label:`${i+1}차시`,date:'',original:false}));
 const promise=new Promise(resolve=>{
   const layer=document.createElement('div');layer.className='app-modal-backdrop';
   layer.innerHTML=`<section class="app-modal course-editor-modal" role="dialog" aria-modal="true" aria-labelledby="course-dialog-title"><div class="app-modal-head"><div><div class="eyebrow" lang="es">Clase y calendario</div><h2 id="course-dialog-title">${c?'클래스 · 수업일정 수정':'새 클래스 개설'}</h2></div><button type="button" class="app-modal-x" aria-label="닫기">×</button></div><form id="course-form" class="stack"><div class="grid2"><div class="field"><label for="course-name">클래스 이름</label><input id="course-name" maxlength="80" required value="${esc(c?.name||'')}" placeholder="예: 스페인어 초급반"></div><div class="field"><label for="course-description">클래스 소개 (선택)</label><input id="course-description" maxlength="200" value="${esc(c?.description||'')}" placeholder="예: 화요일 저녁반"></div></div><div class="course-date-heading"><div><h3>차시별 수업 날짜</h3><p class="hint">날짜를 아직 모른다면 비워두셔도 됩니다. 나중에 언제든 수정할 수 있습니다.</p></div><button type="button" class="btn secondary small" id="course-weekly">7일 간격 채우기</button></div><div class="course-date-fields" id="course-date-fields"></div><div class="row"><button type="button" class="btn soft small" id="course-add-session">+ 차시 추가</button><span class="hint" id="course-date-help">기존 차시는 학습 기록을 보호하기 위해 삭제하지 않습니다.</span></div><div id="course-error" class="error" role="alert"></div><div class="app-modal-actions"><button type="button" class="btn secondary" id="course-cancel">취소</button><button class="btn" id="course-submit" type="submit">${c?'변경사항 저장':'클래스 만들기'}</button></div></form></section>`;
   const close=openModalLayer(layer,{onEscape:()=>done(null)}); // P0-06: Escape·포커스 가두기·포커스 복귀
   const wrap=layer.querySelector('#course-date-fields');
   const draw=()=>{wrap.innerHTML=rows.map((r,i)=>`<div class="course-date-row" data-session="${i}"><span class="course-date-number">${i+1}</span><label class="field"><span class="sr-only">${i+1}차시 이름</span><input data-session-label maxlength="80" value="${esc(r.label||`${i+1}차시`)}" required aria-label="${i+1}차시 이름"></label><label class="field"><span class="sr-only">${i+1}차시 날짜</span><input type="date" data-session-date value="${esc(r.date||'')}" aria-label="${i+1}차시 날짜"></label>${r.original?'<span class="course-lock" title="기존 기록 보존">유지</span>':`<button type="button" class="db-light-button" data-remove-session="${i}" aria-label="${i+1}차시 제거">×</button>`}</div>`).join('');wrap.querySelectorAll('[data-remove-session]').forEach(b=>b.onclick=()=>{readRows();if(rows.length<=1)return;rows.splice(Number(b.dataset.removeSession),1);draw()})};
   const readRows=()=>{wrap.querySelectorAll('[data-session]').forEach(row=>{const r=rows[Number(row.dataset.session)];if(r){r.label=row.querySelector('[data-session-label]').value.trim();r.date=row.querySelector('[data-session-date]').value}})};
   draw();
   const done=v=>{close();resolve(v)};
   layer.querySelector('#course-cancel').onclick=()=>done(null);layer.querySelector('.app-modal-x').onclick=()=>done(null);
   layer.querySelector('#course-add-session').onclick=()=>{readRows();if(rows.length>=52)return toast('최대 52차시까지 등록할 수 있습니다.',true);rows.push({weekId:'',label:`${rows.length+1}차시`,date:'',original:false});draw();wrap.lastElementChild?.scrollIntoView({block:'nearest',behavior:'smooth'})};
   layer.querySelector('#course-weekly').onclick=()=>{readRows();const start=rows.find(r=>r.date)?.date;if(!start){toast('먼저 첫 수업 날짜를 선택해 주세요.',true);return}const first=rows.findIndex(r=>r.date);const from=new Date(start+'T12:00:00');rows.forEach((r,i)=>{if(i>=first){const d=new Date(from);d.setDate(d.getDate()+7*(i-first));r.date=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}});draw()};
   layer.querySelector('#course-form').onsubmit=e=>{e.preventDefault();readRows();const name=layer.querySelector('#course-name').value.trim(),description=layer.querySelector('#course-description').value.trim();if(!name||rows.some(r=>!r.label)){layer.querySelector('#course-error').textContent='클래스 이름과 차시 이름을 확인해 주세요.';return}done({name,description,sessions:rows})};
   layer.querySelector('#course-name').focus();
 });
 const data=await promise;if(!data)return;
 try{
   const cid=c?.id||doc(collection(db,'classes')).id;
   // 기존 차시는 정렬 번호를 그대로 두고, 새 차시는 뒤에 붙입니다. 반 문서의 schedule은 weeks 기준 사본으로 씁니다(배치 08).
   const maxOrder=Math.max(0,...weeks.map(w=>Number(w.order)||0));let added=0;
   const entries=data.sessions.map(r=>{const old=weeks.find(w=>w.id===r.weekId);return {weekId:r.weekId||doc(collection(db,'classes',cid,'weeks')).id,label:r.label,date:r.date,order:old?(Number(old.order)||0):maxOrder+(++added),old}});
   const batch=writeBatch(db);
   for(const e of entries){const ref=doc(db,'classes',cid,'weeks',e.weekId);
      if(!e.old)batch.set(ref,newWeekDoc({label:e.label,order:e.order,date:e.date}));

   }
   const schedule=scheduleFromWeeks(entries.map(e=>({id:e.weekId,label:e.label,order:e.order,sessionDate:e.date})));
   if(c){batch.update(doc(db,'classes',cid),{name:data.name,description:data.description,schedule,updatedAt:serverTimestamp()})}
   else{const code=await uniqueJoinCode();batch.set(doc(db,'classes',cid),{name:data.name,description:data.description,schedule,joinCode:code,archived:false,createdAt:serverTimestamp(),createdBy:A.user.uid});batch.set(doc(db,'joinCodes',code),{classId:cid,createdBy:A.user.uid,updatedAt:serverTimestamp()})}
   await batch.commit();
   toast(c?'클래스와 수업 날짜를 수정했습니다.':'클래스를 개설하고 차시를 만들었습니다.');A.page='classes';await loadAdmin(cid);
 }catch(err){toast('클래스 저장에 실패했습니다: '+ex(err),true)}
}

async function loadAdmin(preferred=''){const cs=await getDocs(collection(db,'classes'));A.classes=cs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));await syncJoinCodes(A.classes);const choice=preferred||A.classId||localStorage.getItem(classPrefKey());A.classId=A.classes.some(c=>c.id===choice)?choice:(A.classes.find(c=>!c.archived)?.id||A.classes[0]?.id||'');if(A.classId){localStorage.setItem(classPrefKey(),A.classId);await loadWeeks();await syncMemberDirectory().catch(e=>console.warn('명단 동기화 실패',e))}else{A.weeks=[];A.weekId=''}frame()}

async function roster(){
  const snap=await getDocs(query(collection(db,'enrollments'),where('classId','==',A.classId)));
  const members=snap.docs.map(d=>({id:d.id,...d.data()}));
  // 학생 등록 시점의 복사본 대신 최신 users 프로필을 사용합니다.
  // 과거 가입 오류로 studentName="수강생"이 저장된 경우도 이름을 복구합니다.
  const profiles=await Promise.all(members.map(async member=>{
    try{const user=await getDoc(doc(db,'users',member.uid));return user.exists()?user.data():null}
    catch(e){console.warn('프로필을 읽지 못했습니다',member.uid,e);return null}
  }));
  return members.map((m,i)=>{
    const p=profiles[i]||{};
    // 예전에는 가입 이름을 enrollment.studentName에 복사해 두었습니다.
    // 프로필의 realName이 아직 없다면 그 당시 가입명을 우선 사용합니다.
    const storedReal=[p.realName,m.realName,m.studentName,p.displayName].map(x=>String(x||'').trim()).find(x=>x&&x!=='수강생')||'';
    const storedAlias=String(p.nickname||'').trim();
    const legacyAlias=!storedAlias && !p.realName && p.displayName && p.displayName!==storedReal && p.displayName!=='수강생' ? String(p.displayName).trim():'';
    const nickname=storedAlias||legacyAlias;
    const publicName=nickname||storedReal||'이름 미등록';
    return {...m,realName:storedReal,nickname,publicName,
      studentName:nickname && nickname!==storedReal ? `${nickname}(${storedReal||'실명 확인 필요'})` : publicName,
      email:p.email||m.email||'',hasGenericName:!storedReal};
  }).sort((a,b)=>(a.studentName||'').localeCompare(b.studentName||'','ko'));
}
async function syncMemberDirectory(){
  if(!A.classId)return;
  const members=await roster(),cid=A.classId;
  const publicSnap=await getDocs(collection(db,'classes',cid,'members'));
  const prev=new Map(publicSnap.docs.map(d=>[d.id,d.data()]));
  const writes=members.filter(m=>m.uid && (prev.get(m.uid)?.name!==m.publicName||prev.get(m.uid)?.status!==m.status));
  for(let i=0;i<writes.length;i+=350){const batch=writeBatch(db);for(const m of writes.slice(i,i+350)){batch.set(doc(db,'classes',cid,'members',m.uid),{uid:m.uid,name:m.publicName,status:m.status,joinedAt:m.joinedAt||serverTimestamp()},{merge:true})}await batch.commit()}
}

async function purgeDocs(ref){const snap=await getDocs(ref);for(let i=0;i<snap.docs.length;i+=350){const batch=writeBatch(db);snap.docs.slice(i,i+350).forEach(x=>batch.delete(x.ref));await batch.commit()}return snap.docs}
// 차시 하나의 학생 기록(제출·제출 이력·복습·응시·출결)과 퀴즈 버전 사본을 지우고, 정리할 파일 경로를 paths에 모읍니다.
async function purgeWeekRecords(cid,wid,weekData,paths){
  const p=weekData?.preview||{};
  if(p.imagePath)paths.add(p.imagePath);
  for(const item of [...(p.videos||[]),...(p.files||[])])if(item.path)paths.add(item.path);
  for(const item of weekData?.recap?.videos||[])if(item.path)paths.add(item.path); // 복습 수업 영상
  const base=['classes',cid,'weeks',wid];
  for(const kind of ['submissions','quizResults']){
    const docs=await getDocs(collection(db,...base,kind));
    for(const d of docs.docs){
      const v=d.data();
      if(v.audioPath)paths.add(v.audioPath);
      for(const fb of v.feedbacks||[])if(fb.audioPath)paths.add(fb.audioPath);
      if(kind==='submissions'){
        const revisions=await purgeDocs(collection(db,...base,kind,d.id,'revisions')); // P1-01: 제출 이력과 이력 속 음성
        for(const r of revisions){const rv=r.data();if(rv.audioPath)paths.add(rv.audioPath)}
      }
      if(kind==='quizResults')await purgeDocs(collection(db,...base,kind,d.id,'attempts'));
    }
    await purgeDocs(collection(db,...base,kind));
  }
  await purgeDocs(collection(db,...base,'attendance'));
  await purgeDocs(collection(db,...base,'quizVersions')); // P1-02
}
async function deleteClassDeep(c){

  await purgeDocs(collection(db,'classes',cid,'weeks'));
  const questions=await getDocs(collection(db,'classes',cid,'questions'));
  for(const q of questions.docs)await purgeDocs(collection(db,'classes',cid,'questions',q.id,'replies'));
  await purgeDocs(collection(db,'classes',cid,'questions'));
  await purgeDocs(collection(db,'classes',cid,'members'));
  await purgeDocs(collection(db,'classes',cid,'teacherNotes'));

  const enrollments=await getDocs(query(collection(db,'enrollments'),where('classId','==',cid)));

    await purgeDocs(collection(db,'enrollments',e.id,'events')); // P1-04

  }

  if(c.joinCode)await deleteDoc(doc(db,'joinCodes',String(c.joinCode).toUpperCase()));
  // 직접 관리 중인 등록 파일을 정리합니다. 오래된 미참조 파일은 Storage에 잔존할 수 있습니다.
  let fileFailures=0;for(const path of paths){try{await deleteObject(storageRef(storage,path))}catch(e){if(e.code!=='storage/object-not-found'){fileFailures++;console.warn('파일 정리 필요',path,e)}}}
  await deleteDoc(doc(db,'classes',cid));
  if(A.classId===cid){A.classId='';localStorage.removeItem(classPrefKey())}
  if(fileFailures)toast(`반은 삭제되었습니다. 파일 ${fileFailures}개는 Storage에서 직접 정리해야 합니다.`,true);
}

// 정답은 correctIndices로 저장합니다. 업로드 이전 버전의 {correctIndex}만 있는 문항도 읽을 수 있게 남겨 둡니다(시험용 퀴즈 보호).
function normalizeQuestion(q={}){
  const type=['single','multiple','ox'].includes(q.type)?q.type:'single';
  let options=type==='ox'?['O','X']:Array.isArray(q.options)?q.options.slice(0,12):['','','',''];
  if(type!=='ox' && options.length<2)options=[...options,...Array(2-options.length).fill('')];
  let correctIndices=Array.isArray(q.correctIndices)?q.correctIndices.map(Number):[Number(q.correctIndex??0)];
  correctIndices=[...new Set(correctIndices.filter(i=>Number.isInteger(i)&&i>=0&&i<options.length))];
  if(type!=='multiple')correctIndices=correctIndices.slice(0,1);
  if(!correctIndices.length)correctIndices=[0];
  return {id:q.id||makeId(),type,stem:q.stem||'',options,correctIndices,explanation:q.explanation||''};
}
function newQuestion(type='single') {return normalizeQuestion({type,options:type==='ox'?['O','X']:['','','','']})}
function questionCard(raw,i){

  <div class="field"><label>문제</label><input data-stem maxlength="500" value="${esc(q.stem)}" placeholder="예: Buenas noches는 무슨 뜻인가요?"></div>
  <div class="quiz-choice-head"><strong>선택지 · ${isOx?'O / X':q.options.length+'개'}</strong><span class="hint">${isMulti?'정답을 모두 체크하세요': '정답 하나를 선택하세요'}</span></div>
  <div class="quiz-choice-list">${q.options.map((option,j)=>`<div class="quiz-choice-row"><label class="quiz-choice-mark" title="정답 지정"><input data-correct-choice type="${isMulti?'checkbox':'radio'}" name="correct-${esc(q.id)}" value="${j}" ${q.correctIndices.includes(j)?'checked':''}></label><span class="quiz-choice-number">${j+1}</span>${isOx?`<span class="quiz-ox-label">${j?'X':'O'}</span>`:`<input class="input" data-option="${j}" maxlength="200" value="${esc(option)}" placeholder="선택지 ${j+1}"><button type="button" class="btn ghost small" data-remove-option="${j}" ${q.options.length<=2?'disabled':''} title="선택지 삭제">✕</button>`}</div>`).join('')}</div>

  <div class="field" style="margin-top:12px"><label>해설 (선택)</label><input data-explanation maxlength="1000" value="${esc(q.explanation)}" placeholder="학습자에게 보여줄 해설"></div>
  </div>`;

function collectQs(){return $$('.quiz-editor-question').map(el=>{

  let correctIndices=$$('[data-correct-choice]:checked',el).map(x=>Number(x.value));

function validateQuizQuestions(qs){
  if(!qs.length)throw Error('복습 퀴즈에는 최소 한 문항이 필요합니다.');
  if(qs.length>200)throw Error('한 차시의 퀴즈는 최대 200문항까지 등록할 수 있습니다.');
  qs.forEach((q,i)=>{
    const pos=`${i+1}번 문항`;
    if(!q.stem)throw Error(`${pos}: 문제를 입력해 주세요.`);
    if(q.options.length<2||q.options.length>12||q.options.some(x=>!x))throw Error(`${pos}: 모든 선택지를 입력해 주세요 (2~12개).`);
    if(!q.correctIndices.length)throw Error(`${pos}: 정답을 선택해 주세요.`);
    if(q.type!=='multiple'&&q.correctIndices.length!==1)throw Error(`${pos}: 정답을 하나 지정해 주세요.`);
    if(q.type==='multiple'&&q.correctIndices.length<2)throw Error(`${pos}: 복수정답은 정답을 두 개 이상 지정해 주세요.`);
  });
}

// P1-01: 제출 회차 탭과 '이전 제출과 비교'. 이력은 학생 상세를 열 때만 불러옵니다.
async function wireRevisionBar(bar,box,cid,wid,uid){
  try{
    const snap=await getDocs(collection(db,weekKey(cid,wid),'submissions',uid,'revisions'));
    if(!bar.isConnected)return;
    const revs=snap.docs.map(x=>x.data()).sort((a,b)=>a.revision-b.revision);
    if(!revs.length){bar.innerHTML='<span class="hint">제출 이력이 없어요(이력을 남기기 전에 제출된 과제).</span>';return}
    let current=revs.at(-1).revision;
    const label=r=>`${r.revision}차 제출 · ${formatDateTime(r.submittedAt)}`;
    const show=html=>{box.innerHTML=html;useMediaPaths(box)};
    const draw=()=>{
      bar.innerHTML=`<div class="revision-tabs" role="group" aria-label="제출 이력">${revs.map(r=>`<button type="button" class="revision-tab" data-revision="${r.revision}" aria-pressed="${r.revision===current}">${esc(label(r))}</button>`).join('')}</div>${revs.length>1?'<button type="button" class="btn secondary small" data-compare>이전 제출과 비교</button>':''}`;
      $$('[data-revision]',bar).forEach(b=>b.onclick=()=>{current=Number(b.dataset.revision);const r=revs.find(x=>x.revision===current);show(answerView(r,label(r)));draw()});
      const cmp=$('[data-compare]',bar);
      if(cmp)cmp.onclick=()=>{
        // 기본은 고른 회차와 바로 앞 회차. 위의 선택 상자로 아무 두 회차(예: 1차와 3차)나 나란히 볼 수 있습니다.
        const idx=revs.findIndex(x=>x.revision===current);
        let left=revs[idx>0?idx-1:0].revision,right=(idx>0?revs[idx]:revs[1]).revision;
        const options=sel=>revs.map(r=>`<option value="${r.revision}" ${r.revision===sel?'selected':''}>${r.revision}차 제출</option>`).join('');
        const paint=()=>{
          const a=revs.find(r=>r.revision===left),b=revs.find(r=>r.revision===right);
          show(`<div class="revision-compare-head"><label>왼쪽 <select class="input" data-compare-left>${options(left)}</select></label><label>오른쪽 <select class="input" data-compare-right>${options(right)}</select></label></div><div class="revision-compare"><div>${answerView(a,label(a))}</div><div>${answerView(b,label(b))}</div></div>`);
          $('[data-compare-left]',box).onchange=e=>{left=Number(e.target.value);paint()};
          $('[data-compare-right]',box).onchange=e=>{right=Number(e.target.value);paint()};
        };
        paint();
      };
    };
    draw();
  }catch(e){console.error('제출 이력 조회 실패',e);if(bar.isConnected)bar.innerHTML='<span class="error">제출 이력을 불러오지 못했어요.</span>'}
}
// P1-02: 응시 기록 해석에 필요한 문제 버전 사본(강사 전용)

function teacherComments(data,uid,kind){

  const seenAt=toDate(data?.studentSeenFeedbackAt);
  const item=f=>{
    // P1-05: 학생이 이 피드백 이후에 과제·복습 화면을 열었으면 확인 시각을 보여 줍니다.

  };

  let body;
  if(revised){
    const groups=new Map();
    for(const f of lines){const r=Number(f.forRevision)||1;if(!groups.has(r))groups.set(r,[]);groups.get(r).push(f)}

function wireFeedbackDraft(card,cid,wid,kind,uid){

  if(restored){text.value=restored;const status=$('[data-feedback-status]',card);if(status)status.textContent='작성 중이던 피드백을 불러왔어요. 등록하면 학생에게 공개됩니다.'}

// D2: 출석은 '출석'·'불참' 두 가지만 씁니다(이전 형식 읽기는 common.js의 attendanceValue).

}

// D4: 한 학생은 동시에 한 반만 수강합니다. 반 이동·재등록은 모두 이 함수로 처리합니다(P0-08).
// 대상 반 등록을 수강 중으로 만들고, 그 학생의 다른 수강 중 등록은 '반 이동'으로 바꿉니다.
// 보관된 반(수업이 끝난 반)의 등록은 그대로 둡니다. 학생이 지난 자료를 계속 볼 수 있게 하기 위해서입니다.
const isArchivedClass=cid=>!!A.classes.find(c=>c.id===cid)?.archived;
// P1-04: 수강 상태를 바꾸는 모든 경로에서 같은 일괄 쓰기로 기록(변경 불가)을 남깁니다. 차시 대상자 판정(wasActiveAt)에 씁니다.
function addEnrollmentEvent(batch,enrollmentId,type,extra={}){
  batch.set(doc(collection(db,'enrollments',enrollmentId,'events')),{type,at:serverTimestamp(),by:A.user.uid,...extra});
}
async function activateEnrollment(student,targetClassId){
  const uid=student.uid,target=A.classes.find(c=>c.id===targetClassId);
  if(!target)throw Error('반 정보를 찾을 수 없습니다.');
  const snap=await getDocs(query(collection(db,'enrollments'),where('uid','==',uid)));
  const targetId=enId(uid,targetClassId),batch=writeBatch(db);
  const publicName=student.publicName||student.studentName||'',realName=student.realName||student.studentName||'';
  let fromClassId='';
  for(const d of snap.docs){
    const e=d.data();
    if(d.id!==targetId&&e.status==='active'&&!isArchivedClass(e.classId)){
      batch.update(d.ref,{status:'transferred'});
      batch.set(doc(db,'classes',e.classId,'members',uid),{uid,name:publicName,status:'transferred'},{merge:true});
      addEnrollmentEvent(batch,d.id,'transferred_out',{toClassId:targetClassId});
      fromClassId=fromClassId||e.classId;
    }
  }
  const existing=snap.docs.find(d=>d.id===targetId);
  if(existing){
    if(existing.data().status!=='active'){
      batch.update(existing.ref,{status:'active'});
      addEnrollmentEvent(batch,targetId,fromClassId?'transferred_in':'resumed',fromClassId?{fromClassId}:{});
    }
  }else{
    batch.set(doc(db,'enrollments',targetId),{uid,classId:targetClassId,studentName:realName,email:student.email||'',joinCode:target.joinCode||'',status:'active',joinedAt:serverTimestamp()});
    addEnrollmentEvent(batch,targetId,fromClassId?'transferred_in':'joined',fromClassId?{fromClassId}:{});
  }
  batch.set(doc(db,'classes',targetClassId,'members',uid),{uid,name:publicName,status:'active',joinedAt:serverTimestamp()},{merge:true});
  batch.update(doc(db,'users',uid),{assignedClassId:targetClassId});
  try{await batch.commit()}
  catch(e){if(e?.code==='permission-denied')throw Error('권한이 없어 반을 옮기지 못했어요. 저장소의 최신 firestore.rules를 Firebase 콘솔에 게시했는지 확인해 주세요.');throw e}
}

async function duplicateActiveStudents(){

// 기호 칸(진행표와 같은 기호 · 색 · 화면 읽기용 글자)
function symbolCell(kind,c,label){
  const map=kind==='attendance'?GRID_ATT:GRID_ASG,v=c?.[kind];
  if(!c||(!c.target&&!c.outside)||!v||!map[v])return `<span class="sym is-blank" title="${esc(label)} · 대상 아님"><span class="sr-only">${esc(label)} 대상 아님</span></span>`;
  const [cls,symbol,text]=map[v];
  return `<span class="sym ${cls}${c.outside?' is-outside':''}${c.estimated?' is-estimated':''}" title="${esc(label+' · '+text)}"><span aria-hidden="true">${symbol}</span><span class="sr-only">${esc(label)} ${esc(text)}</span></span>`;

// ⋯ 메뉴: Enter·Space·↓로 열고, ↑↓로 이동, Esc로 닫고 버튼으로 돌아갑니다.
function openRowMenu(button,items){
  closeRowMenu();
  const menu=document.createElement('div');menu.className='row-menu';menu.setAttribute('role','menu');menu.id='row-menu';
  menu.setAttribute('aria-label',button.getAttribute('aria-label')||'관리');
  menu.innerHTML=items.map((it,i)=>`<button type="button" role="menuitem" tabindex="-1" class="row-menu-item${it.danger?' is-danger':''}" data-menu-index="${i}" ${it.attr||''}>${esc(it.label)}</button>`).join('');
  document.body.append(menu);
  const r=button.getBoundingClientRect(),w=menu.offsetWidth,h=menu.offsetHeight;
  menu.style.left=Math.max(8,Math.min(r.right-w,innerWidth-w-8))+'px';
  menu.style.top=(r.bottom+h+8>window.innerHeight?Math.max(8,r.top-h-4):r.bottom+4)+'px';
  button.setAttribute('aria-expanded','true');
  const entries=$$('[role="menuitem"]',menu),focusAt=i=>entries[(i+entries.length)%entries.length]?.focus();
  const close=(restore=true)=>{closeRowMenu();if(restore)button.focus()};
  menu.addEventListener('keydown',e=>{
    const i=entries.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){e.preventDefault();focusAt(i+1)}
    else if(e.key==='ArrowUp'){e.preventDefault();focusAt(i-1)}
    else if(e.key==='Home'){e.preventDefault();focusAt(0)}
    else if(e.key==='End'){e.preventDefault();focusAt(entries.length-1)}
    else if(e.key==='Escape'){e.preventDefault();close()}
    else if(e.key==='Tab')close(false);
  });
  entries.forEach((el,i)=>el.onclick=()=>{close(false);items[i].run()});
  rowMenuState={menu,button,outside:e=>{if(!menu.contains(e.target)&&e.target!==button)close(false)},reflow:()=>close(false)};
  setTimeout(()=>{if(rowMenuState?.menu!==menu)return;document.addEventListener('mousedown',rowMenuState.outside);addEventListener('resize',rowMenuState.reflow);addEventListener('scroll',rowMenuState.reflow,true)});
  focusAt(0);
}
let rowMenuState=null;
function closeRowMenu(){
  if(!rowMenuState)return;
  const {menu,button,outside,reflow}=rowMenuState;rowMenuState=null;
  document.removeEventListener('mousedown',outside);removeEventListener('resize',reflow);removeEventListener('scroll',reflow,true);
  menu.remove();button.setAttribute('aria-expanded','false');
}

      if(document.activeElement?.matches('input,textarea,select')||rowMenuState)return;
      students=await roster();
      if(A.page!=='students'||A.classId!==cid||!list.isConnected)return;
      updateCounts();renderRows();
    },adminLiveError);
    let initial=true;
    A.live.students=onSnapshot(query(collection(db,'enrollments'),where('classId','==',cid)),()=>{
      if(initial){initial=false;return}
      if(A.page!=='students'||A.classId!==cid)return;
      if(document.activeElement?.matches('input,textarea,select')||rowMenuState){toast('수강생 명단에 변경사항이 있습니다. 메뉴를 다시 열면 갱신됩니다.');return}
      showStudents(b);
    },adminLiveError);
  }catch(err){showLoadFailed(list,()=>showStudents(b),err)}
}
// ⋯ 메뉴 동작(이전 표의 버튼과 같은 결과)
async function editTeacherNote(student,ctx){
  const ref=doc(db,'classes',ctx.cid,'teacherNotes',student.uid);

async function saveTeacherNote(ctx,student,content){
  const ref=doc(db,'classes',ctx.cid,'teacherNotes',student.uid),text=String(content||'').trim();
  if(text)await setDoc(ref,{text,studentUid:student.uid,updatedAt:serverTimestamp(),updatedBy:A.user.uid},{merge:true});
  else await deleteDoc(ref);
  if(text)ctx.notes.add(student.uid);else ctx.notes.delete(student.uid);
}
async function editRealName(student,ctx,after){
  const name=await modalInput('수강생의 실명을 입력해 주세요. 학생의 별명은 그대로 유지됩니다.',student.realName||'',{title:'실명 수정',label:'실명',maxLength:35});
  if(name===null)return;
  const trimmed=name.trim();if(!trimmed||trimmed.length>35){toast('이름을 1~35자로 입력해 주세요.',true);return}
  try{
    const nickname=student.nickname&&student.nickname!==trimmed?student.nickname:'';
    const publicName=nickname||trimmed;
    await updateDoc(doc(db,'users',student.uid),{realName:trimmed,nickname,displayName:publicName,updatedAt:serverTimestamp()});
    await updateDoc(doc(db,'enrollments',student.id),{studentName:trimmed});
    await setDoc(doc(db,'classes',ctx.cid,'members',student.uid),{uid:student.uid,name:publicName,status:student.status},{merge:true});
    Object.assign(student,{realName:trimmed,nickname,publicName,studentName:nickname?`${nickname}(${trimmed})`:trimmed,hasGenericName:false});
    toast('실명을 수정했습니다.');after();
  }catch(err){toast(ex(err),true)}
}
async function moveStudent(student,ctx){
  const destinations=A.classes.filter(c=>!c.archived&&c.id!==ctx.cid);
  if(!destinations.length){toast('이동할 다른 운영 반을 먼저 개설해 주세요.',true);return}
  const answer=await modalDialog({title:'반 이동',message:`${student.studentName}님이 이동할 반을 선택해 주세요.`,choices:destinations.map(c=>({value:c.id,label:c.name})),confirmText:'반 이동'});if(answer===null)return;
  const target=destinations.find(c=>c.id===answer);if(!target){toast('반 번호를 확인해 주세요.',true);return}
  if(!await modalConfirm(`${student.studentName}님을 ${target.name}(으)로 이동할까요?\n이전 반의 학습 기록은 보존되지만 새 반에 복사되지 않습니다.`,{title:'반 이동',confirmText:'이동하기'}))return;
  try{await activateEnrollment(student,target.id);toast('수강생의 반 이동이 완료되었습니다.');await ctx.rerender()}
  catch(e){toast(ex(e),true)}
}
async function toggleStudentStatus(student,ctx){
  const cid=ctx.cid;
  try{
    if(student.status==='active'){
      if(!await modalConfirm(`${student.studentName}님을 수강 중지할까요?\n학습 기록은 그대로 보존됩니다.`,{title:'수강 상태 변경',confirmText:'수강 중지',danger:true}))return;
      const batch=writeBatch(db);
      batch.update(doc(db,'enrollments',student.id),{status:'inactive'});
      batch.set(doc(db,'classes',cid,'members',student.uid),{uid:student.uid,name:student.publicName,status:'inactive'},{merge:true});
      addEnrollmentEvent(batch,student.id,'stopped');
      await batch.commit();
      toast('수강을 중지했어요.');
    }else{
      // D4: 다른 반을 수강 중이면 그 반은 '반 이동'으로 바뀌고 이 반만 수강 중이 됩니다.
      const others=await otherActiveClasses(student.uid,cid);
      const message=others.length?`${student.studentName}님은 지금 ${others.map(c=>c.name).join(', ')}을(를) 수강 중이에요.\n이 반(${activeClass()?.name||''})으로 다시 옮길까요?`:`${student.studentName}님을 다시 수강 중으로 바꿀까요?`;
      if(!await modalConfirm(message,{title:'수강 상태 변경',confirmText:'다시 수강 중으로'}))return;
      await activateEnrollment(student,cid);
      toast('다시 수강 중으로 바꿨어요.');
    }
    await ctx.rerender();
  }catch(err){toast(ex(err),true)}
}

// ===== 학생 상세 (배치 11 · P3-01) =====
// 기본 정보 · 최근 차시 요약 · 과제 · 복습 · 질문 · 강사 메모(강사 전용) · 다음 학습 목표(학생에게 공개). 열 때 필요한 것만 읽고, 차시가 많으면 최근 8차시부터 보여 줍니다.
async function openStudentDetail(student,ctx,{all=false}={}){
  const panel=$('#student-detail'),ws=$('#students-workspace');if(!panel||!ws)return;
  A.studentDetailUid=student.uid;
  $$('[data-roster-row]').forEach(tr=>tr.classList.toggle('is-selected',tr.dataset.rosterRow===student.uid));
  ws.classList.add('has-detail');panel.hidden=false;document.body.classList.add('detail-open');
  const head=`<div class="detail-head"><button type="button" class="btn ghost small detail-back" data-detail-close>← 목록</button><div class="detail-title"><span class="name-avatar" aria-hidden="true">${esc((student.studentName||'?').slice(0,1))}</span><div><h2 id="student-detail-title" tabindex="-1">${esc(student.studentName)}</h2><p class="hint">${esc(student.email||'')}</p></div></div><button type="button" class="app-modal-x detail-x" data-detail-close aria-label="학생 상세 닫기">×</button></div>`;
  panel.setAttribute('aria-labelledby','student-detail-title');
  panel.innerHTML=head+'<div class="loading">학생 기록을 모으는 중입니다</div>';
  const wire=()=>$$('[data-detail-close]',panel).forEach(el=>el.onclick=()=>closeStudentDetail());
  wire();
  if(matchMedia('(max-width:900px)').matches)window.scrollTo(0,0);
  const cid=ctx.cid,uid=student.uid,today=todayKey();
  const weeks=datedWeeks(),held=weeks.filter(w=>['done','today'].includes(sessionState(w,today)));
  const shown=all?held:held.slice(-DETAIL_SESSIONS);
  try{
    const read=ref=>getDoc(ref).then(d=>d.exists()?d.data():null);
    const [records,events,note,goal,questionsSnap]=await Promise.all([
      Promise.all(shown.map(async w=>{const base=['classes',cid,'weeks',w.id];const [att,sub,quiz]=await Promise.all([read(doc(db,...base,'attendance',uid)),read(doc(db,...base,'submissions',uid)),read(doc(db,...base,'quizResults',uid))]);return {w,att,sub,quiz}})),
      ctx.events?Promise.resolve(ctx.events[student.id]||[]):readEnrollmentEvents([student]).then(x=>x?x[student.id]:null),
      read(doc(db,'classes',cid,'teacherNotes',uid)),
      read(doc(db,'classes',cid,'studentGoals',uid)).catch(()=>null), // 학습 목표 규칙을 게시하기 전에는 비워 둡니다
      getDocs(query(collection(db,'classes',cid,'questions'),where('uid','==',uid))),
    ]);
    if(A.studentDetailUid!==uid||!panel.isConnected)return;
    const docsFor=key=>Object.fromEntries(records.map(r=>[r.w.id,r[key]?[{id:uid,...r[key]}]:[]]));
    const d=computeDashboard({sessions:records.map(r=>r.w),enrollments:[student],events:events===null?null:{[student.id]:events||[]},names:{[uid]:student.studentName},attendance:docsFor('att'),submissions:docsFor('sub'),quizResults:docsFor('quiz'),questions:[]},today,DASH_DEPS);
    const row=d.grid.rows[0],cells=row?.cells||[];
    // 1. 기본 정보
    const history=(events||[]).filter(e=>EVENT_TEXT[e.type]).sort((a,b)=>(toDate(a.at)?.getTime()||0)-(toDate(b.at)?.getTime()||0));
    const className=id=>A.classes.find(c=>c.id===id)?.name||'다른 반';
    const basic=`<section class="detail-section" aria-labelledby="detail-basic"><h3 id="detail-basic">기본 정보</h3><dl class="info-grid"><dt>실명</dt><dd>${esc(student.realName||'확인 필요')}</dd><dt>별명</dt><dd>${esc(student.nickname||'—')}</dd><dt>이메일</dt><dd>${esc(student.email||'—')}</dd><dt>반</dt><dd>${esc(activeClass()?.name||'')}</dd><dt>등록일</dt><dd>${esc(shortDate(student.joinedAt))}</dd><dt>수강 상태</dt><dd>${statusPillOf(student)}</dd></dl>${events===null?'<p class="hint">수강 기간 기록을 읽지 못했어요(보안 규칙 게시 후 표시).</p>':history.length?`<ol class="detail-timeline" aria-label="수강 기간 기록">${history.map(e=>`<li><span>${esc(formatDateTime(e.at,{time:false}))}</span>${esc(EVENT_TEXT[e.type])}${e.type==='transferred_out'&&e.toClassId?` · ${esc(className(e.toClassId))}`:''}${e.type==='transferred_in'&&e.fromClassId?` · ${esc(className(e.fromClassId))}에서`:''}</li>`).join('')}</ol>`:'<p class="hint">수강 기간 기록이 없어요(이전 데이터는 등록일 기준).</p>'}</section>`;
    // 2. 최근 차시 요약(진행표와 같은 기호)
    const gs=d.grid.sessions;
    const quizText=c=>{const q=c?.quiz;if(!q||(!c.target&&!c.outside))return '';if(q==='none')return '–';if(q==='missing')return '미응시';return q.kind==='first'?Math.round(q.pct)+'%':'응시'};
    const summary=gs.length?`<section class="detail-section" aria-labelledby="detail-summary"><h3 id="detail-summary">최근 ${gs.length}차시</h3><div class="dash-grid-scroll" tabindex="0" aria-label="최근 차시 요약 (가로로 스크롤)"><table class="dash-grid detail-grid"><thead><tr><th scope="col" class="dash-grid-name">항목</th>${gs.map(s=>`<th scope="col" title="${esc(s.label)}">${esc(s.short)}<small>${esc(monthDay(s.date))}</small></th>`).join('')}</tr></thead><tbody><tr><th scope="row" class="dash-grid-name">출결</th>${cells.map((c,i)=>`<td class="dash-cell">${symbolCell('attendance',c,gs[i].short+' 출결')}</td>`).join('')}</tr><tr><th scope="row" class="dash-grid-name">과제</th>${cells.map((c,i)=>`<td class="dash-cell">${symbolCell('assignment',c,gs[i].short)}</td>`).join('')}</tr><tr><th scope="row" class="dash-grid-name">복습 첫 응시</th>${cells.map(c=>`<td class="dash-cell is-score">${esc(quizText(c))}</td>`).join('')}</tr></tbody></table></div></section>`:'<section class="detail-section"><h3>최근 차시</h3><p class="hint">아직 지난 수업이 없어요.</p></section>';
    // 3. 과제: 차시별 제출 회차, 최근 피드백, 제출 보기(회차 비교)
    const latestFeedback=x=>[...feedbackItems(x)].sort((a,b)=>(toDate(b.createdAt)?.getTime()||0)-(toDate(a.createdAt)?.getTime()||0))[0];
    const asgRows=records.filter(r=>r.w.assignment?.enabled||r.sub).reverse();
    const assignment=`<section class="detail-section" aria-labelledby="detail-assignment"><h3 id="detail-assignment">과제</h3>${asgRows.length?`<ul class="detail-list">${asgRows.map(r=>{const s=r.sub,fb=s?latestFeedback(s):null,rev=Number(s?.revision)||1;return `<li><div class="between"><strong>${esc(shortLabel(r.w.label))}</strong>${s?statusPill(...REVIEW_LABEL[reviewState(s)]):statusPill('neutral','미제출')}</div>${s?`<p class="hint">${rev>1?`${rev}차 제출 · `:''}${esc(formatDateTime(s.latestSubmittedAt||s.submittedAt))}</p>`:''}${fb?`<p class="detail-quote">${esc(String(fb.text||'음성 피드백').slice(0,90))}${String(fb.text||'').length>90?'…':''}</p>`:''}${s?`<button type="button" class="linkbutton" data-go-feedback="${esc(r.w.id)}">${rev>1?'제출 비교 보기 →':'제출 보기 →'}</button>`:''}</li>`}).join('')}</ul>`:'<p class="hint">과제가 열린 차시가 없어요.</p>'}</section>`;
    // 4. 복습: 첫 응시 → 최근 응시(n 표시). 첫 응시를 알 수 없는 이전 기록은 따로 표시
    const quizRows=records.filter(r=>(r.w.quiz?.enabled&&r.w.quiz.questions?.length)||r.quiz).reverse();
    const pctOf=(sc,t)=>`${Number(sc)||0}/${Number(t)||0} · ${Math.round(100*(Number(sc)||0)/Math.max(1,Number(t)||1))}%`;
    const quiz=`<section class="detail-section" aria-labelledby="detail-quiz"><h3 id="detail-quiz">복습</h3>${quizRows.length?`<table class="data-table detail-table"><thead><tr><th scope="col">차시</th><th scope="col">첫 응시</th><th scope="col">최근 응시</th><th scope="col">응시</th></tr></thead><tbody>${quizRows.map(r=>{const q=r.quiz,first=q?firstAttemptOf(q):null;return `<tr><th scope="row">${esc(shortLabel(r.w.label))}</th><td>${!q?'<span class="hint">미응시</span>':first.kind==='first'?esc(pctOf(q.firstAttempt.score,q.firstAttempt.total)):'<span class="hint" title="첫 응시를 알 수 없는 이전 기록">미상(이전 기록)</span>'}</td><td>${q?esc(pctOf(q.score,q.total)):'—'}</td><td>${q?`${Number(q.attemptCount)||1}회`:'—'}</td></tr>`}).join('')}</tbody></table>`:'<p class="hint">복습이 열린 차시가 없어요.</p>'}</section>`;
    // 5. 질문
    const questions=questionsSnap.docs.map(x=>({id:x.id,...x.data()})).sort(byLastActivity).slice(0,5);
    const qs=`<section class="detail-section" aria-labelledby="detail-questions"><h3 id="detail-questions">질문 <small>${questionsSnap.size}건</small></h3>${questions.length?`<ul class="detail-list">${questions.map(q=>`<li><button type="button" class="detail-question" data-go-question="${esc(q.id)}"><span>${adminQuestionTag(q)?`<span class="question-session-tag">${esc(adminQuestionTag(q))}</span>`:''}${esc(q.title||'제목 없음')}</span>${needsReply(q)?statusPill('warning','답변 대기'):statusPill('success','답변 완료')}</button></li>`).join('')}</ul>`:'<p class="hint">아직 질문이 없어요.</p>'}</section>`;
    // 6. 강사 메모(강사 전용) · 7. 다음 학습 목표(학생 홈에 공개)
    const memo=`<section class="detail-section detail-private" aria-labelledby="detail-memo"><div class="between"><h3 id="detail-memo"><span aria-hidden="true">🔒</span> 강사 메모</h3><span class="private-label">강사만 볼 수 있어요</span></div><label class="sr-only" for="detail-memo-text">강사 메모</label><textarea id="detail-memo-text" rows="4" maxlength="500" placeholder="수업 중 특이사항(학생에게 보이지 않아요)">${esc(note?.text||'')}</textarea><div class="between"><span class="hint">${note?.updatedAt?`마지막 저장 ${esc(formatDateTime(note.updatedAt))}`:'Ctrl+Enter(Mac은 ⌘+Enter)로 저장'}</span><button type="button" class="btn small" id="detail-memo-save">메모 저장</button></div></section>`;
    const goalSection=`<section class="detail-section detail-goal" aria-labelledby="detail-goal-title"><div class="between"><h3 id="detail-goal-title">다음 학습 목표</h3><span class="public-label">학생 홈에 보여요</span></div><label class="sr-only" for="detail-goal-text">다음 학습 목표</label><input id="detail-goal-text" maxlength="200" value="${esc(goal?.text||'')}" placeholder="예: 다음 과제에서는 연결 표현(pero, porque)을 2개 써 보기"><div class="between"><span class="hint">한 줄로, 다음에 해 볼 구체적인 행동을 적어 주세요.</span><div class="row"><button type="button" class="btn ghost small" id="detail-goal-clear" ${goal?.text?'':'disabled'}>지우기</button><button type="button" class="btn small" id="detail-goal-save">목표 저장</button></div></div></section>`;
    const more=!all&&held.length>shown.length?`<button type="button" class="btn secondary small detail-more" id="detail-more">이전 차시 ${held.length-shown.length}개 더 보기</button>`:'';
    panel.innerHTML=head+`<div class="detail-body">${basic}${summary}${assignment}${quiz}${more}${qs}${memo}${goalSection}</div>`;
    wire();
    $('#detail-more',panel)?.addEventListener('click',()=>openStudentDetail(student,ctx,{all:true}));
    $$('[data-go-feedback]',panel).forEach(el=>el.onclick=()=>navigateAdminPage('feedback',{weekId:el.dataset.goFeedback,feedbackTab:'submissions',feedbackFilter:'all',feedbackSelectedUid:uid}));
    $$('[data-go-question]',panel).forEach(el=>el.onclick=()=>navigateAdminPage('questions',{questionFilter:'all',activeQuestionId:el.dataset.goQuestion}));
    const memoText=$('#detail-memo-text',panel),memoSave=$('#detail-memo-save',panel);
    const saveMemo=async()=>{memoSave.disabled=true;try{await saveTeacherNote(ctx,student,memoText.value);toast('강사 메모를 저장했습니다.');const flag=$(`[data-roster-row="${CSS.escape(uid)}"] .memo-cell`);if(flag)flag.innerHTML=ctx.notes.has(uid)?'<span class="memo-flag" title="강사 메모 있음"><span aria-hidden="true">🔒</span><span class="sr-only">강사 메모 있음</span></span>':''}catch(e){toast(ex(e),true)}finally{memoSave.disabled=false}};
    memoSave.onclick=saveMemo;
    memoText.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&!isComposingKey(e)){e.preventDefault();saveMemo()}});
    const goalInput=$('#detail-goal-text',panel),goalSave=$('#detail-goal-save',panel),goalClear=$('#detail-goal-clear',panel);
    const saveGoal=async text=>{goalSave.disabled=true;try{const ref=doc(db,'classes',cid,'studentGoals',uid);if(text)await setDoc(ref,{text,updatedAt:serverTimestamp(),updatedBy:A.user.uid});else await deleteDoc(ref);goalInput.value=text;goalClear.disabled=!text;toast(text?'학습 목표를 저장했어요. 학생 홈에 보여요.':'학습 목표를 지웠어요.')}catch(e){toast(ex(e),true)}finally{goalSave.disabled=false}};
    goalSave.onclick=()=>saveGoal(goalInput.value.trim());
    goalClear.onclick=()=>saveGoal('');
    goalInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!isComposingKey(e)){e.preventDefault();saveGoal(goalInput.value.trim())}});
    useMediaPaths(panel);
    $('#student-detail-title',panel)?.focus({preventScroll:true});
  }catch(err){if(panel.isConnected){panel.innerHTML=head;wire();panel.insertAdjacentHTML('beforeend','<div data-detail-error></div>');showLoadFailed($('[data-detail-error]',panel),()=>openStudentDetail(student,ctx,{all}),err)}}
}

// ---------- 공지사항 (2026-10-29) ----------
// 반 전체에 알리는 글. 학생 홈 맨 위(상단 고정·새 공지)와 학생 '공지사항' 화면에 보입니다. 문자·푸시 알림은 보내지 않습니다.
// 읽음: 공지를 올린 뒤 학생이 공지 화면을 연 경우(noticeReads의 확인 시각 ≥ 올린 시각). 지금 수강 중인 학생만 셉니다.
function showNotices(b){
  const cid=A.classId,cls=activeClass();
  b.innerHTML=`<div class="section-title"><div><div class="eyebrow"><span lang="es">Anuncios</span> · 공지</div><h1>공지사항</h1><p>학생 홈 맨 위에 새 공지와 상단 고정 공지가 보여요. 문자·푸시 알림은 가지 않으니, 급한 내용은 따로도 알려 주세요.</p></div><button type="button" class="btn" id="notice-new">+ 새 공지</button></div>${cls?.archived?'<p class="notice warn">보관된 반이에요. 학생은 지난 반 화면에서 공지를 읽기만 할 수 있어요.</p>':''}<div id="notice-admin-list" class="stack" aria-busy="true"><div class="loading">공지를 불러오는 중</div></div>`;
  const host=$('#notice-admin-list'),data={notices:null,reads:undefined,students:null};
  const isCurrent=()=>A.page==='notices'&&A.classId===cid&&host.isConnected;
  let focusAfter='';
  const readsLine=(n,at)=>{
    if(data.reads===undefined||data.students===null)return '<span class="hint">읽음 확인 중</span>';
    if(data.reads===null)return '<span class="hint">읽음 정보를 불러오지 못했어요</span>';
    const students=data.students;if(!students.length)return '<span class="hint">수강 중인 학생이 없어요</span>';
    // 누가 읽었는지 강사가 바로 보도록 이름을 펼쳐 둡니다(2026-10-30 요청). 기호(✓/–)와 글자로 구분합니다.
    const opened=s=>(toDate(data.reads.get(s.uid))?.getTime()||0)>=at,read=students.filter(opened),unread=students.filter(s=>!opened(s));
    const names=(list,kind,label)=>`<div class="announce-names" data-reads="${kind}"><span class="announce-names-label">${label} ${list.length}명</span>${list.length?list.map(s=>statusPill(kind==='read'?'success':'neutral',s.studentName)).join(''):'<span class="hint">없음</span>'}</div>`;
    return `<span class="hint announce-read-count">읽음 ${read.length}/${students.length}명</span>${names(read,'read','읽음')}${names(unread,'unread','안 읽음')}`;
  };
  const draw=()=>{
    if(!isCurrent()||data.notices===null)return;
    host.removeAttribute('aria-busy');
    const list=sortNotices(data.notices);
    if(!list.length){host.innerHTML=empty('아직 올린 공지가 없어요','휴강·준비물·과제 안내처럼 반 전체에 알릴 내용을 올려 보세요.');return}
    host.innerHTML=list.map(n=>{
      const at=toDate(n.createdAt)?.getTime()||0,edited=(toDate(n.updatedAt)?.getTime()||0)-at>60000;
      return `<article class="card announce-card${n.pinned?' is-pinned':''}" aria-labelledby="notice-${esc(n.id)}-title"><div class="between"><div><h3 id="notice-${esc(n.id)}-title">${esc(n.title)}</h3><p class="hint">${esc(formatDateTime(n.createdAt))}${edited?` · 수정 ${esc(formatDateTime(n.updatedAt))}`:''}</p></div>${n.pinned?statusPill('brand','상단 고정'):''}</div>${n.body?`<p class="announce-body">${linkifyText(n.body)}</p>`:''}<div class="announce-foot"><div class="announce-reads">${readsLine(n,at)}</div><div class="row"><button type="button" class="btn secondary small" data-notice-pin="${esc(n.id)}">${n.pinned?'고정 해제':'상단 고정'}</button><button type="button" class="btn secondary small" data-notice-edit="${esc(n.id)}">수정</button><button type="button" class="btn danger small" data-notice-delete="${esc(n.id)}">삭제</button></div></div></article>`;
    }).join('');
    const find=id=>data.notices.find(n=>n.id===id);
    $$('[data-notice-edit]',host).forEach(el=>el.onclick=()=>noticeEditor(cid,find(el.dataset.noticeEdit)));
    $$('[data-notice-pin]',host).forEach(el=>el.onclick=async()=>{
      const n=find(el.dataset.noticePin);if(!n)return;el.disabled=true;focusAfter=`[data-notice-pin="${n.id}"]`;
      try{await updateDoc(doc(db,'classes',cid,'notices',n.id),{pinned:!n.pinned});toast(n.pinned?'상단 고정을 풀었어요.':'공지를 학생 홈 맨 위에 고정했어요.')}
      catch(e){toast(ex(e),true);el.disabled=false;focusAfter=''}
    });
    $$('[data-notice-delete]',host).forEach(el=>el.onclick=async()=>{
      const n=find(el.dataset.noticeDelete);if(!n)return;
      if(!await modalConfirm(`'${n.title}' 공지를 삭제할까요?\n학생 화면에서도 사라지고 되돌릴 수 없어요.`,{title:'공지 삭제',confirmText:'삭제',danger:true}))return;
      try{await deleteDoc(doc(db,'classes',cid,'notices',n.id));toast('공지를 삭제했어요.');$('#notice-new')?.focus()}catch(e){toast(ex(e),true)}
    });
    if(focusAfter){$(focusAfter,host)?.focus();focusAfter=''} // 고정을 바꾸면 목록을 다시 그리므로, 누른 버튼으로 포커스를 돌립니다
  };
  A.live.notices=onSnapshot(collection(db,'classes',cid,'notices'),snap=>{data.notices=snap.docs.map(d=>({id:d.id,...d.data()}));draw()},
    err=>{if(isCurrent()){host.removeAttribute('aria-busy');showLoadFailed(host,()=>{adminClearLive();showNotices(b)},err)}});
  A.live.noticeReads=onSnapshot(collection(db,'classes',cid,'noticeReads'),snap=>{data.reads=new Map(snap.docs.map(d=>[d.id,d.data().seenAt]));draw()},
    err=>{console.warn('공지 확인 시각 조회 실패',err);data.reads=null;draw()});
  roster().then(list=>{data.students=list.filter(s=>s.status==='active');draw()}).catch(e=>{console.warn('명단 조회 실패',e);data.students=[];draw()});
  $('#notice-new').onclick=()=>noticeEditor(cid,null);
}
// 공지 작성·수정 창. 긴 글을 실수로 잃지 않도록, 고친 내용이 있으면 닫기 전에 묻습니다(바깥을 눌러도 닫히지 않음).
function noticeEditor(cid,n){
  const layer=document.createElement('div');layer.className='app-modal-backdrop';
  layer.innerHTML=`<section class="app-modal announce-modal" role="dialog" aria-modal="true" aria-labelledby="notice-dialog-title"><div class="app-modal-head"><div><div class="eyebrow"><span lang="es">Anuncios</span> · 공지</div><h2 id="notice-dialog-title">${n?'공지 수정':'새 공지'}</h2></div><button type="button" class="app-modal-x" aria-label="닫기">×</button></div><form id="notice-form" class="stack" novalidate><div class="field"><label for="notice-title">제목</label><input id="notice-title" maxlength="100" value="${esc(n?.title||'')}" placeholder="예: 11월 5일 수업은 쉽니다" autocomplete="off"></div><div class="field"><label for="notice-body">내용 (선택)</label><textarea id="notice-body" rows="8" maxlength="5000" aria-describedby="notice-body-hint" placeholder="줄을 바꿔 쓰면 학생 화면에도 그대로 보여요.">${esc(n?.body||'')}</textarea><p class="hint" id="notice-body-hint">최대 5,000자 · http로 시작하는 주소는 학생 화면에서 링크가 돼요 · ${IS_MAC?'⌘':'Ctrl'}+Enter로 저장</p></div><label class="checkline"><input type="checkbox" id="notice-pinned" ${n?.pinned?'checked':''}> 학생 홈 맨 위에 고정</label><p class="error" id="notice-error" role="alert"></p><div class="row app-modal-actions"><button type="button" class="btn secondary" id="notice-cancel">취소</button><button type="submit" class="btn" id="notice-save">${n?'수정 저장':'공지 올리기'}</button></div></form></section>`;
  const title=$('#notice-title',layer),body=$('#notice-body',layer),pinned=$('#notice-pinned',layer),err=$('#notice-error',layer),save=$('#notice-save',layer);
  const snapshot=()=>JSON.stringify([title.value,body.value,pinned.checked]),initial=snapshot();
  let close=()=>{};
  const tryClose=async()=>{if(snapshot()!==initial&&!await modalConfirm('작성 중인 공지를 닫을까요? 고친 내용은 저장되지 않아요.',{title:'공지 닫기',confirmText:'닫기'}))return;close()};
  close=openModalLayer(layer,{onEscape:tryClose}); // P0-06: Escape·포커스 가두기·포커스 복귀
  $('#notice-cancel',layer).onclick=tryClose;$('.app-modal-x',layer).onclick=tryClose;
  title.addEventListener('keydown',e=>{if(e.key==='Enter'&&isComposingKey(e))e.preventDefault()}); // 한글 조합 중 Enter로는 저장하지 않음
  body.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&!isComposingKey(e)){e.preventDefault();save.click()}});
  $('#notice-form',layer).onsubmit=async e=>{
    e.preventDefault();
    const t=title.value.trim(),text=body.value.trim();
    if(!t){err.textContent='제목을 입력해 주세요.';title.focus();return}
    save.disabled=true;err.textContent='';
    try{
      if(n)await updateDoc(doc(db,'classes',cid,'notices',n.id),{title:t,body:text,pinned:pinned.checked,updatedAt:serverTimestamp()});
      else await setDoc(doc(collection(db,'classes',cid,'notices')),{title:t,body:text,pinned:pinned.checked,createdAt:serverTimestamp(),updatedAt:serverTimestamp(),createdBy:A.user.uid,authorName:String(A.profile?.displayName||'선생님').slice(0,60)});
      close();toast(n?'공지를 수정했어요.':'공지를 올렸어요. 학생 홈 맨 위에 보여요.');
    }catch(x){err.textContent=ex(x);save.disabled=false}
  };
  requestAnimationFrame(()=>title.focus());
}

if(CONFIGURED){onAuthStateChanged(auth,async user=>{try{if(!user){resetAdminSession();mountAuth(root,{signup:false,variant:'admin'});return}root.innerHTML='<div class="loading" style="min-height:95vh">강사 권한을 확인하고 있습니다</div>';A.user=user;const snap=await getDoc(doc(db,'users',user.uid));if(!snap.exists()||snap.data().role!=='admin'){root.innerHTML=`<div class="card" style="max-width:620px;margin:8vh auto"><div class="eyebrow" lang="es">Acceso</div><h2>강사 권한이 필요합니다</h2><p style="margin-top:12px">관리자 계정은 가입만으로 생성되지 않습니다. Firebase Authentication에 강사 계정을 만든 뒤, Firestore <code>users/${esc(user.uid)}</code> 문서의 <code>role</code> 필드를 <code>admin</code>으로 등록해 주세요.</p><div class="subtle" style="margin-top:18px"><strong>현재 로그인 UID</strong><p style="overflow-wrap:anywhere">${esc(user.uid)}</p></div><div class="row" style="margin-top:18px"><button class="btn secondary" id="admin-signout">다른 계정으로 로그인</button><a class="btn soft" href="index.html">수강생 페이지</a></div></div>`;$('#admin-signout').onclick=()=>{resetAdminSession();signOut(auth)};return}A.profile=snap.data();await loadAdmin()}catch(err){root.innerHTML=`<div class="card" style="max-width:570px;margin:60px auto"><h3>관리자 페이지 불러오기 실패</h3><p class="error">${esc(ex(err))}</p><button class="btn secondary" onclick="location.reload()">새로고침</button></div>`}})}else mountAuth(root,{signup:false});


</script>
</body>
</html>
