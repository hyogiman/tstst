/* Hola Class — studio redesign v2: warm editorial design system */
:root{
 --bg:#f5f6f7;--surface:#ffffff;--ink:#20303d;--muted:#71808b;
 --line:#e5eaf0;--primary:#c9604d;--primary-deep:#a94637;
 --primary-light:#fff0e9;--accent:#efba67;--danger:#b84f50;
 --shadow:0 10px 32px rgba(28,44,58,.035);--radius:18px;
 --navy:#1a2e3a;--navy2:#253c49;--peach:#fff3e7;
}
html{scroll-behavior:smooth}body{background:var(--bg);font-family:'Manrope','Noto Sans KR',system-ui,sans-serif;letter-spacing:-.22px;line-height:1.55}
h1,h2,h3,h4{font-weight:800;color:var(--ink);letter-spacing:-1px}
h1{font-size:clamp(29px,2.7vw,39px);line-height:1.28}h2{font-size:24px}h3{font-size:18px}
small{font-size:12px}button,input,select,textarea{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #eeb17d;outline-offset:2px}
.eyebrow{color:var(--primary);font-size:10px;letter-spacing:2.4px;font-weight:800;margin-bottom:9px}
.muted,.hint{color:var(--muted)}.hint{line-height:1.65}
.card{border:1px solid var(--line);border-radius:19px;padding:25px;box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.btn{border-radius:11px;min-height:44px;padding:11px 17px;font-weight:800;font-size:13px;box-shadow:none;transition:background .18s,border-color .18s,transform .18s}
.btn:hover{box-shadow:0 7px 15px rgba(130,59,41,.095)}
.btn.secondary{border-color:#dfe5e9;background:white;color:#344652}
.btn.secondary:hover{background:#f7f9fa}
.btn.soft{background:#fff2eb;color:#ac5140;border-color:#f7e3d8}
.btn.soft:hover{background:#ffe8dc}
.btn.danger{background:#fff1f0;border-color:#f5d4d1;color:#b44444}
.btn.small{min-height:37px;font-size:12px;padding:8px 13px}
.btn.ghost{color:var(--muted)}
.logo{background:var(--primary);border-radius:14px;width:45px;height:45px;box-shadow:none;color:white;font-family:Georgia,serif;font-size:30px}
.brand strong{font-size:18px;letter-spacing:-.8px}.brand small{letter-spacing:1.15px;color:var(--muted)}
.pill{font-size:11px;border-radius:7px;padding:5px 10px;line-height:1.5;background:#f3f5f7;color:#60717d}
.pill.green{background:#eaf7f0;color:#207853}.pill.amber{background:#fff3e3;color:#a26d27}.pill.red{background:#fff0ed;color:#b35043}.pill.gray{background:#f2f4f6;color:#76848e}
.field>label,.field-label{font-weight:800;font-size:12px;color:#465662}
.field input,.field select,.field textarea,.input{border:1px solid #dce4ea;border-radius:11px;min-height:45px;padding:11px 13px;font-size:14px;color:var(--ink)}
.field textarea{line-height:1.75}.field input:focus,.field select:focus,.field textarea:focus,.input:focus{border-color:#cd7563;box-shadow:0 0 0 3px #fae8e1;outline:0}
.card .subtle,.subtle{background:#f8f9fa;border:1px solid #ecf0f2;border-radius:13px;padding:17px}
.notice{background:#eff8f3;color:#267a5d;border-radius:10px;font-size:13px;padding:13px 15px}
.notice.warn{background:#fff5e8;color:#93652b}
.section-title{margin-bottom:22px;align-items:center;gap:22px}.section-title p,.page-head p{font-size:13px;margin-top:8px;color:var(--muted)}
.tabset{background:#edf0f3;border-radius:12px;padding:4px;gap:4px}.tab{border-radius:9px;font-size:13px;font-weight:750;min-height:40px}
.tab.active{background:white;color:var(--primary);box-shadow:0 2px 7px #192b3210}
.empty{background:#fbfcfd;border:1px dashed #dce4e9;padding:54px 20px}.empty strong{color:var(--ink)}
.loading{min-height:86px;justify-content:flex-start;padding:17px 0;gap:12px;font-size:13px}
.loading:before{border:2px solid #f0ddd8;border-top-color:var(--primary);width:16px;height:16px}
.mini-stat{background:#fff;border:1px solid var(--line);padding:25px;border-radius:18px;min-height:134px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.mini-stat strong{font-size:37px;letter-spacing:-1.8px;color:var(--navy);line-height:1.1}.mini-stat span{font-size:13px}
/* Admin workspace */
.admin-shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh;background:var(--bg)}
.sidebar{height:100dvh;top:0;position:sticky;background:var(--navy);border:0;padding:31px 16px 20px;gap:43px;overflow-y:auto}
.sidebar .brand{padding:0 12px}.sidebar .brand .logo{background:#e89b70;color:#222e37}

async function uploadMedia(file,path,kind,progressEl){
  if(!file)throw Error('파일을 선택해 주세요.');
  if(!isMedia(file,kind))throw Error('선택한 파일 형식을 확인해 주세요.');
  if(file.size>sizeLimit[kind])throw Error(`파일 크기 제한을 초과했습니다. (${Math.round(sizeLimit[kind]/1024/1024)}MB)`);
  const r=storageRef(storage,path);
  return new Promise((resolve,reject)=>{
    const task=uploadBytesResumable(r,file,{contentType:file.type||'application/octet-stream'});
    task.on('state_changed',snap=>{if(progressEl)progressEl.textContent=`업로드 ${Math.round(snap.bytesTransferred/snap.totalBytes*100)}%`},reject,()=>{if(progressEl)progressEl.textContent='업로드 완료';resolve(path)});
  });

async function urlFor(path){try{return path?await getDownloadURL(storageRef(storage,path)):null}catch(e){console.warn('파일을 열 수 없습니다.',e);return null}}
function useMediaPaths(container){
  if(!container)return;
  $$('[data-media-path]',container).forEach(async el=>{
    const path=el.dataset.mediaPath;
    if(!path)return;
    try{
      // <audio src="Firebase 다운로드 URL">로 바로 재생: getBlob()·CORS 수동 설정 불필요.
      // 다운로드 URL을 가진 사람은 링크를 공유할 수 있으므로 유료/고보안 음성 보호에는 적합하지 않습니다.
      const url=await urlFor(path);
      if(!el.isConnected || !el.closest('body'))return;
      if(!url)throw Error('파일 주소가 없습니다.');
      if(el.tagName==='A'){
        el.href=url;el.target='_blank';el.rel='noopener noreferrer';
      }else{
        el.src=url;
        if(el.tagName==='AUDIO')el.preload='none';
        if(el.tagName==='VIDEO'){el.addEventListener('contextmenu',ev=>ev.preventDefault());el.setAttribute('controlsList','nodownload noremoteplayback');}
      }
    }catch(e){
      console.warn('미디어 주소 확인 실패',path,e);
      if(el.isConnected){
        const message=document.createElement('span');
        message.className='error';message.textContent='파일을 불러오지 못했습니다. 저장 경로 또는 파일 권한을 확인해 주세요.';
        el.replaceWith(message);
      }
    }
  });

function sanitizeRich(html){
  const parsed=new DOMParser().parseFromString(`<div>${html||''}</div>`,'text/html');
  const allowed=new Set(['P','DIV','BR','STRONG','B','EM','I','U','S','UL','OL','LI','H1','H2','H3','H4','BLOCKQUOTE','SPAN','FONT','A']);
  const styleKeys=new Set(['color','background-color','font-size','font-family','font-weight','text-align','font-style','text-decoration']);
  function safeNode(node){
    if(node.nodeType===Node.TEXT_NODE)return document.createTextNode(node.textContent);
    if(node.nodeType!==Node.ELEMENT_NODE)return document.createDocumentFragment();
    const tag=node.tagName; const el=allowed.has(tag)?document.createElement(tag.toLowerCase()):document.createDocumentFragment();
    if(el.nodeType===Node.ELEMENT_NODE){
      if(tag==='A'){const href=node.getAttribute('href')||'';if(/^https?:\/\//i.test(href)){el.setAttribute('href',href);el.setAttribute('target','_blank');el.setAttribute('rel','noopener noreferrer')}}
      if(tag==='FONT'){
        const sz=node.getAttribute('size');if(sz&&/^[1-7]$/.test(sz))el.setAttribute('size',sz);
        const color=node.getAttribute('color');if(color&&/^(#[0-9a-f]{3,8}|[a-z]{3,16}|rgb\([\d\s,%.]+\))$/i.test(color))el.setAttribute('color',color);
        const face=node.getAttribute('face');if(face&&/^[\w가-힣 ,'-]{1,65}$/.test(face))el.setAttribute('face',face);
      }
      const style=node.getAttribute('style');if(style){
        style.split(';').forEach(item=>{const [k,...v]=item.split(':');const key=k?.trim().toLowerCase(), val=v.join(':').trim();if(styleKeys.has(key)&&/^[\w\s#(),.%'-]{1,75}$/.test(val)&&!/(url|expression|behavior|javascript)/i.test(val))el.style.setProperty(key,val)})
      }
    }
    Array.from(node.childNodes).forEach(child=>el.appendChild(safeNode(child)));return el;
  }
  const wrapper=document.createElement('div');Array.from(parsed.body.firstElementChild?.childNodes||[]).forEach(n=>wrapper.appendChild(safeNode(n)));return wrapper.innerHTML;
}
async function ensureProfile(user){
  const r=doc(db,'users',user.uid),snap=await getDoc(r);
  if(snap.exists()){
    const profile=snap.data();
    // 구버전 가입 경쟁 상태로 기본 이름 '수강생'이 저장된 계정을 복구합니다.
    const authName=(user.displayName||'').trim();
    if(profile.role==='student' && (!profile.displayName || profile.displayName==='수강생') && authName && authName!=='수강생'){
      await updateDoc(r,{displayName:authName,updatedAt:serverTimestamp()});
      return {...profile,displayName:authName};
    }
    return profile;
  }
  const data={displayName:(user.displayName||'').trim()||'수강생',email:user.email||'',role:'student',createdAt:serverTimestamp()};
  await setDoc(r,data);

// 한 번에 하나의 마이크 녹음만 활성화됩니다. 파일 선택 업로드를 대안으로 함께 제공합니다.
let activeRecorder=null;
async function recordStart(onFile,onStatus){
  if(activeRecorder)throw Error('현재 녹음 중인 항목을 먼저 종료해 주세요.');
  if(!navigator.mediaDevices?.getUserMedia||!globalThis.MediaRecorder)throw Error('이 브라우저에서 음성 녹음을 지원하지 않습니다. 음성 파일을 선택해 주세요.');
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const options=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg'].find(t=>MediaRecorder.isTypeSupported(t));
  let recorder;try{recorder=options?new MediaRecorder(stream,{mimeType:options}):new MediaRecorder(stream)}catch(err){stream.getTracks().forEach(t=>t.stop());throw err}
  const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());activeRecorder=null;const mime=recorder.mimeType||'audio/webm';const ext=mime.includes('mp4')?'m4a':mime.includes('ogg')?'ogg':'webm';const file=new File(chunks,`recording-${Date.now()}.${ext}`,{type:mime});onFile(file);onStatus('녹음 완료 · '+(file.size/1024).toFixed(0)+'KB');};
  recorder.start();activeRecorder=recorder;onStatus('● 녹음 중입니다. 종료 버튼을 눌러 주세요.');
}
function recordStop(){if(activeRecorder&&activeRecorder.state==='recording')activeRecorder.stop()}

function wireMediaUi(container,onFile){const status=$('[data-rec-status]',container),player=$('[data-local-audio]',container);const onSelected=file=>{if(!file)return;onFile(file);if(player.dataset.blob)URL.revokeObjectURL(player.dataset.blob);const url=URL.createObjectURL(file);player.dataset.blob=url;player.src=url;player.classList.remove('hide');status.textContent=`선택됨: ${file.name}`;};$('[data-record-start]',container)?.addEventListener('click',async()=>{try{await recordStart(onSelected,t=>status.textContent=t)}catch(e){toast(ex(e),true)}});$('[data-record-stop]',container)?.addEventListener('click',recordStop);$('[data-audio-input]',container)?.addEventListener('change',e=>onSelected(e.target.files[0]));}

const codeGen=()=>Array.from(crypto.getRandomValues(new Uint8Array(8))).map(n=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[n%32]).join('');
// 코드만으로 입장하기 위한 비공개 목록 없는 단일 조회용 연결표.

async function syncJoinCodes(classes){
  for(const c of classes){
    if(!c.joinCode)continue;
    try{
      const r=doc(db,'joinCodes',String(c.joinCode).toUpperCase());
      const snap=await getDoc(r);
      if(!snap.exists() || snap.data().classId!==c.id){
        await setDoc(r,{classId:c.id,createdBy:A.user.uid,updatedAt:serverTimestamp()});
      }
    }catch(err){console.warn('수강 코드 연결표 동기화 실패:',c.name,err);toast('수강 코드 설정 확인이 필요합니다. 새 Firestore 규칙을 적용해 주세요.',true);}
  }
}
async function uniqueJoinCode(){
  for(let i=0;i<6;i++){
    const code=codeGen();
    if(!(await getDoc(doc(db,'joinCodes',code))).exists())return code;
  }
  throw Error('새 수강 코드를 발급하지 못했습니다. 다시 시도해 주세요.');
}

// 구버전 {correctIndex} 데이터도 그대로 지원합니다.
function normalizeQuestion(q={}){
  const type=['single','multiple','ox'].includes(q.type)?q.type:'single';
  let options=type==='ox'?['O','X']:Array.isArray(q.options)?q.options.slice(0,12):['','','',''];
  if(type!=='ox' && options.length<2)options=[...options,...Array(2-options.length).fill('')];
  let correctIndices=Array.isArray(q.correctIndices)?q.correctIndices.map(Number):[Number(q.correctIndex??0)];
  correctIndices=[...new Set(correctIndices.filter(i=>Number.isInteger(i)&&i>=0&&i<options.length))];
  if(type!=='multiple')correctIndices=correctIndices.slice(0,1);
  if(!correctIndices.length)correctIndices=[0];
  return {id:q.id||makeId(),type,stem:q.stem||'',options,correctIndices,correctIndex:correctIndices[0],explanation:q.explanation||''};
}
function newQuestion(type='single') {return normalizeQuestion({type,options:type==='ox'?['O','X']:['','','','']})}

  <div class="quiz-choice-list">${q.options.map((option,j)=>`<div class="quiz-choice-row"><label class="quiz-choice-mark" title="정답 지정"><input data-correct-choice type="${isMulti?'checkbox':'radio'}" name="correct-${esc(q.id)}" value="${j}" ${q.correctIndices.includes(j)?'checked':''}></label><span class="quiz-choice-number">${j+1}</span>${isOx?`<span class="quiz-ox-label">${j?'X':'O'}</span>`:`<input class="input" data-option="${j}" maxlength="200" value="${esc(option)}" placeholder="선택지 ${j+1}"><button type="button" class="btn ghost small" data-remove-option="${j}" ${q.options.length<=2?'disabled':''} title="선택지 삭제">✕</button>`}</div>`).join('')}</div>

function validateQuizQuestions(qs){
  if(!qs.length)throw Error('복습 퀴즈에는 최소 한 문항이 필요합니다.');
  if(qs.length>200)throw Error('한 주차의 퀴즈는 최대 200문항까지 등록할 수 있습니다.');
  qs.forEach((q,i)=>{
    const pos=`${i+1}번 문항`;
    if(!q.stem)throw Error(`${pos}: 문제를 입력해 주세요.`);
    if(q.options.length<2||q.options.length>12||q.options.some(x=>!x))throw Error(`${pos}: 모든 선택지를 입력해 주세요 (2~12개).`);
    if(!q.correctIndices.length)throw Error(`${pos}: 정답을 선택해 주세요.`);
    if(q.type!=='multiple'&&q.correctIndices.length!==1)throw Error(`${pos}: 정답을 하나 지정해 주세요.`);
    if(q.type==='multiple'&&q.correctIndices.length<2)throw Error(`${pos}: 복수정답은 정답을 두 개 이상 지정해 주세요.`);
  });
}

  const preview={enabled:$('#preview-enabled').checked,title:$('#preview-title').value.trim(),mode:$('#preview-mode').value,richHtml:sanitizeRich($('#preview-editor').innerHTML),imagePath:A.preview.imagePath||'',videos:A.preview.videos||[],files:A.preview.files||[]};
  if(preview.enabled&&preview.mode==='image'&&!preview.imagePath)throw Error('이미지 모드를 켰다면 안내 이미지를 업로드해 주세요.');
  if($('#week-published').checked&&!assignment.enabled&&!quiz.enabled&&!preview.enabled)throw Error('주차 공개 시 최소 한 가지 콘텐츠를 ON으로 설정해 주세요.');
  const label=$('#week-label').value.trim(),order=Number($('#week-order').value);if(!label||!Number.isInteger(order)||order<=0)throw Error('주차 이름과 정렬 번호를 확인해 주세요.');
  status.textContent='저장하는 중...';await updateDoc(doc(db,weekKey(A.classId,w.id)),{label,order,published:$('#week-published').checked,assignment,quiz,preview,updatedAt:serverTimestamp()});for(const path of A.pendingDeletes){try{await deleteObject(storageRef(storage,path))}catch(e){console.warn('미디어 정리 실패',e)}}A.pendingDeletes=[];toast('주차 콘텐츠가 저장되었습니다.');await loadWeeks();showWeeks($('#admin-body'));
}catch(e){toast(ex(e),true);if(status)status.textContent='저장되지 않았습니다.'}finally{if(btn.isConnected)btn.disabled=false}}
function teacherComments(data){const lines=[...(data?.feedbacks||[])];if(data?.feedback?.text||data?.feedback?.audioPath)lines.unshift({...data.feedback,createdAt:data.feedback.updatedAt});return lines.length?`<div class="stack" style="margin-top:15px;gap:10px"><strong style="font-size:13px">💬 남긴 피드백 (${lines.length})</strong>${lines.map(f=>`<div class="feedback"><div class="hint">${esc(typeof f.createdAt==='string'?f.createdAt.slice(0,16).replace('T',' '):fmt(f.createdAt))}</div>${f.text?`<p style="white-space:pre-wrap">${esc(f.text)}</p>`:''}${f.audioPath?`<audio controls data-media-path="${esc(f.audioPath)}"></audio>`:''}</div>`).join('')}</div>`:''}
async function showFeedback(b){b.innerHTML=`<div class="section-title"><div><div class="eyebrow">LEARNING FEEDBACK</div><h1>제출·피드백</h1><p>학생의 과제와 복습 기록을 확인하고 댓글을 남기세요.</p></div>${A.weeks.length?weekSelect():''}</div><div class="tabset" style="margin-bottom:18px"><button class="tab ${A.feedbackTab==='submissions'?'active':''}" data-feedback-tab="submissions">✍️ 과제 제출</button><button class="tab ${A.feedbackTab==='quizResults'?'active':''}" data-feedback-tab="quizResults">🧠 복습 결과</button></div><div id="feedback-list"></div>`;
  $('#admin-week-picker')?.addEventListener('change',e=>{A.weekId=e.target.value;showFeedback(b)});
  $$('[data-feedback-tab]').forEach(el=>el.onclick=()=>{A.feedbackTab=el.dataset.feedbackTab;showFeedback(b)});await drawFeedbackList();
}
async function drawFeedbackList(){const out=$('#feedback-list');if(!out)return;const w=activeWeek();if(!w){out.innerHTML=empty('먼저 주차를 추가해 주세요');return}loading(out);const cid=A.classId,wid=w.id,kind=A.feedbackTab;
  try{const [students,dataSnap]=await Promise.all([roster(),getDocs(collection(db,weekKey(cid,wid),kind))]);if(cid!==A.classId||wid!==A.weekId||kind!==A.feedbackTab)return;
  const map=new Map(dataSnap.docs.map(d=>[d.id,d.data()]));const active=students.filter(s=>s.status==='active');const done=active.filter(s=>map.has(s.uid)).length;
  out.classList.remove('loading');out.innerHTML=`<div class="between" style="margin-bottom:15px"><span class="pill green">${done} / ${active.length} ${kind==='submissions'?'과제 제출':'복습 완료'}</span><span class="hint">${esc(w.label)} · 미제출자도 표시됩니다</span></div>${active.map(s=>{const d=map.get(s.uid);return `<div class="card" style="margin-bottom:13px"><div class="between"><div><h3>${esc(s.studentName)}</h3><p class="hint">${esc(s.email||'')} · ${d?'제출: '+fmt(d.submittedAt):'아직 제출하지 않았습니다'}</p></div><span class="pill ${d?'green':'gray'}">${d?'제출 완료':'미제출'}</span></div>${d?(kind==='submissions'?`<div class="subtle" style="margin-top:15px"><strong style="font-size:13px">학생 답안</strong>${d.text?`<p style="white-space:pre-wrap;margin-top:8px">${esc(d.text)}</p>`:'<p class="hint">텍스트 답안 없음</p>'}${d.audioPath?`<div style="margin-top:10px"><audio controls preload="none" data-media-path="${esc(d.audioPath)}"></audio></div>`:''}</div>`:`<div class="subtle" style="margin-top:15px"><strong>최근 점수: ${Number(d.score)||0} / ${Number(d.total)||0}</strong>${(w.quiz?.questions||[]).map((raw,i)=>{const q=normalizeQuestion(raw),a=d.answers?.[i],answer=Array.isArray(a)?a:a===null||a===undefined?[]:[a],correct=answer.length===q.correctIndices.length&&answer.every(x=>q.correctIndices.includes(Number(x)));const choices=arr=>arr.length?arr.map(x=>q.options[Number(x)]||'?').join(', '):'미응답';return `<p class="hint" style="margin-top:7px">${i+1}. ${esc(q.stem)} · 학생: ${esc(choices(answer))} · ${correct?'✓':'✗'} 정답: ${esc(choices(q.correctIndices))}</p>`}).join('')}</div>`)+teacherComments(d)+`<div class="separator"></div><div class="stack" style="gap:9px" data-comment-card="${esc(kind)}:${esc(s.uid)}"><div class="field"><label>새 피드백 댓글</label><textarea data-feedback-text rows="3" maxlength="10000" placeholder="좋았던 점과 다음에 개선할 점을 작성해 주세요."></textarea></div><div data-feedback-media>${makeMediaUi('audio','또는 피드백 음성 파일')}</div><div class="between"><span class="hint" data-feedback-status>댓글은 학생에게 즉시 공개됩니다.</span><button type="button" class="btn small" data-feedback-save>피드백 등록 →</button></div></div>`:''}</div>`}).join('')||empty('현재 반에 등록된 수강생이 없습니다')}`;
  $$('[data-comment-card]',out).forEach(card=>{const [type,uid]=card.dataset.commentCard.split(':');const key=type+':'+uid;wireMediaUi($('[data-feedback-media]',card),file=>A.voiceDrafts[key]=file);$('[data-feedback-save]',card).onclick=async e=>{const text=$('[data-feedback-text]',card).value.trim(),file=A.voiceDrafts[key];if(!text&&!file){toast('텍스트나 음성 피드백을 작성해 주세요.',true);return}const btn=e.currentTarget;btn.disabled=true;try{let audioPath='';if(file){audioPath=`classes/${cid}/feedback/${wid}/${uid}/${makeId()}-${file.name.replace(/[^\w.\-]/g,'_')}`;await uploadMedia(file,audioPath,'audio',$('[data-feedback-status]',card))}await updateDoc(doc(db,weekKey(cid,wid),type,uid),{feedbacks:arrayUnion({text,audioPath,createdAt:new Date().toISOString(),author:A.profile.displayName||'선생님'})});delete A.voiceDrafts[key];toast('피드백을 등록했습니다.');await drawFeedbackList()}catch(err){toast(ex(err),true)}finally{if(btn.isConnected)btn.disabled=false}}});useMediaPaths(out);
  }catch(err){loaded(out,`<div class="card"><p class="error">${esc(ex(err))}</p></div>`)}
}
const attendanceOptions=[['unchecked','미체크'],['present','출석'],['late','지각'],['absent','결석'],['excused','인정결석']];
async function showAttendance(b){b.innerHTML=`<div class="section-title"><div><div class="eyebrow">ATTENDANCE</div><h1>출석 관리</h1><p>수업 주차별 출결을 기록하면 수강생 마이페이지에 표시됩니다.</p></div>${A.weeks.length?weekSelect():''}</div><div class="card"><div class="between"><h3>이번 차시 출석부</h3><button class="btn" id="attendance-save">변경사항 저장</button></div><div id="attendance-list" style="margin-top:17px"></div></div>`;
  $('#admin-week-picker')?.addEventListener('change',e=>{A.weekId=e.target.value;showAttendance(b)});
  const w=activeWeek();if(!w){$('#attendance-list').innerHTML=empty('등록된 주차가 없습니다');$('#attendance-save').disabled=true;return}const cid=A.classId,wid=w.id;loading($('#attendance-list'));
  try{const [students,snaps]=await Promise.all([roster(),getDocs(collection(db,weekKey(cid,wid),'attendance'))]);if(A.classId!==cid||A.weekId!==wid)return;const map=new Map(snaps.docs.map(d=>[d.id,d.data()]));
  loaded($('#attendance-list'),`<div class="data-table-wrap"><table class="data-table"><thead><tr><th>이름</th><th>이메일</th><th>출석</th><th>메모 (선택)</th></tr></thead><tbody>${students.filter(s=>s.status==='active').map(s=>`<tr data-attendance-uid="${esc(s.uid)}"><td><strong>${esc(s.studentName)}</strong></td><td>${esc(s.email)}</td><td><select data-attendance-status>${attendanceOptions.map(([v,t])=>`<option value="${v}" ${v===(map.get(s.uid)?.status||'unchecked')?'selected':''}>${t}</option>`).join('')}</select></td><td><input class="input" data-attendance-note maxlength="200" value="${esc(map.get(s.uid)?.note||'')}" placeholder="선택 입력" style="min-width:160px"></td></tr>`).join('')}</tbody></table></div>${students.filter(s=>s.status==='active').length?'':empty('수강생이 없습니다')}`);
  $('#attendance-save').onclick=async e=>{const btn=e.currentTarget;btn.disabled=true;try{const rows=$$('[data-attendance-uid]');await Promise.all(rows.map(async row=>{const uid=row.dataset.attendanceUid,status=$('[data-attendance-status]',row).value,note=$('[data-attendance-note]',row).value.trim();const r=doc(db,weekKey(cid,wid),'attendance',uid);if(status==='unchecked')await deleteDoc(r).catch(err=>{if(err.code!=='not-found')throw err});else await setDoc(r,{status,note,updatedAt:serverTimestamp()},{merge:true})}));toast('출석이 저장되었습니다.')}catch(err){toast(ex(err),true)}finally{btn.disabled=false}};
  }catch(err){loaded($('#attendance-list'),`<p class="error">${esc(ex(err))}</p>`)}
}
async function showStudents(b){
  b.innerHTML=`<div class="section-title"><div><div class="eyebrow">STUDENT DIRECTORY · 수강생</div><h1>수강생 관리</h1><p>우리 반의 학습자를 한눈에 확인하고 이름과 수강 상태를 관리하세요.</p></div></div>
  <div class="roster-summary"><div class="roster-summary-left"><div id="roster-count" class="roster-count">—</div><div><strong id="roster-total">수강생 불러오는 중</strong><small>${esc(activeClass()?.name||'선택된 반')}</small></div></div><div class="roster-tools"><input id="roster-search" type="search" placeholder="이름 또는 이메일 검색" aria-label="수강생 검색"><select id="roster-status" aria-label="수강 상태 필터"><option value="all">전체 학생</option><option value="active">수강 중</option><option value="inactive">수강 중지</option></select></div></div>
  <div class="card roster-card"><div id="roster-list" class="roster-content loading">학생 목록 확인 중</div></div><p class="hint" style="margin-top:15px">※ 이름은 계정의 최신 프로필을 기준으로 표시합니다. 이름이 등록되지 않은 학생은 강사가 수정할 수 있습니다.</p>`;
  const list=$('#roster-list');
  try{
    const cid=A.classId,students=await roster();
    if(cid!==A.classId || !list.isConnected)return;
    const active=students.filter(s=>s.status==='active');
    $('#roster-count').textContent=active.length;
    $('#roster-total').textContent=`${active.length}명 수강 중 · 전체 ${students.length}명`;
    function renderRows(){
      const queryText=$('#roster-search')?.value.trim().toLocaleLowerCase('ko')||'';
      const filter=$('#roster-status')?.value||'all';
      const filtered=students.filter(s=>(filter==='all'||s.status===filter)&&(
        !queryText || (s.studentName||'').toLocaleLowerCase('ko').includes(queryText) || (s.email||'').toLocaleLowerCase('ko').includes(queryText)
      ));
      if(!filtered.length){loaded(list,`<div class="roster-empty">${empty(students.length?'조건에 맞는 수강생이 없습니다':'아직 등록된 수강생이 없습니다',students.length?'검색어나 필터를 변경해 주세요.':'강사가 발급한 수강 코드를 공유해 주세요.')}</div>`);return}
      loaded(list,`<div class="data-table-wrap"><table class="data-table"><thead><tr><th>수강생</th><th>이메일 · 로그인 ID</th><th>수강 상태</th><th>등록일</th><th>관리</th></tr></thead><tbody>${filtered.map(s=>`<tr><td><div class="name-cell"><span class="name-avatar" aria-hidden="true">${esc((s.studentName||'?').slice(0,1))}</span><div><strong>${esc(s.studentName)}</strong>${s.hasGenericName?'<small>이름 확인 필요</small>':'<small>학습자 프로필</small>'}</div></div></td><td>${esc(s.email||'—')}</td><td><span class="pill ${s.status==='active'?'green':'gray'}">${s.status==='active'?'수강 중':'수강 중지'}</span></td><td>${fmt(s.joinedAt)}</td><td><div class="row-actions"><button type="button" class="btn secondary small" data-edit-name="${esc(s.uid)}">이름 수정</button><button type="button" class="btn ${s.status==='active'?'danger':'soft'} small" data-status-uid="${esc(s.uid)}">${s.status==='active'?'수강 중지':'재등록'}</button></div></td></tr>`).join('')}</tbody></table></div>`);
      $$('[data-edit-name]',list).forEach(el=>el.onclick=async()=>{
        const student=students.find(x=>x.uid===el.dataset.editName);if(!student)return;
        const name=prompt('수강생의 표시 이름을 입력해 주세요.',student.studentName==='수강생'?'':student.studentName);
        if(name===null)return;
        const trimmed=name.trim();if(!trimmed||trimmed.length>35){toast('이름을 1~35자로 입력해 주세요.',true);return}
        try{
          await updateDoc(doc(db,'users',student.uid),{displayName:trimmed,updatedAt:serverTimestamp()});
          await updateDoc(doc(db,'enrollments',student.id),{studentName:trimmed});
          student.studentName=trimmed;student.hasGenericName=false;toast('이름을 수정했습니다.');renderRows();
        }catch(err){toast(ex(err),true)}
      });
      $$('[data-status-uid]',list).forEach(el=>el.onclick=async()=>{
        const student=students.find(x=>x.uid===el.dataset.statusUid);if(!student)return;
        if(!confirm(`${student.studentName}님의 수강 상태를 변경하시겠습니까?`))return;
        try{const next=student.status==='active'?'inactive':'active';await updateDoc(doc(db,'enrollments',student.id),{status:next});student.status=next;$('#roster-count').textContent=students.filter(s=>s.status==='active').length;$('#roster-total').textContent=`${students.filter(s=>s.status==='active').length}명 수강 중 · 전체 ${students.length}명`;toast('수강 상태를 변경했습니다.');renderRows()}
        catch(err){toast(ex(err),true)}
      });
    }
    $('#roster-search').addEventListener('input',renderRows);
    $('#roster-status').addEventListener('change',renderRows);
    renderRows();
  }catch(err){loaded(list,`<div class="roster-error error">${esc(ex(err))}</div>`)}
}
if(CONFIGURED){onAuthStateChanged(auth,async user=>{try{if(!user){A.user=null;mountAuth(root,{signup:false});return}root.innerHTML='<div class="loading" style="min-height:95vh">강사 권한을 확인하고 있습니다</div>';A.user=user;const snap=await getDoc(doc(db,'users',user.uid));if(!snap.exists()||snap.data().role!=='admin'){root.innerHTML=`<div class="card" style="max-width:620px;margin:8vh auto"><div class="eyebrow">ACCESS CONTROL</div><h2>강사 권한이 필요합니다</h2><p style="margin-top:12px">관리자 계정은 가입만으로 생성되지 않습니다. Firebase Authentication에 강사 계정을 만든 뒤, Firestore <code>users/${esc(user.uid)}</code> 문서의 <code>role</code> 필드를 <code>admin</code>으로 등록해 주세요.</p><div class="subtle" style="margin-top:18px"><strong>현재 로그인 UID</strong><p style="overflow-wrap:anywhere">${esc(user.uid)}</p></div><div class="row" style="margin-top:18px"><button class="btn secondary" id="admin-signout">다른 계정으로 로그인</button><a class="btn soft" href="index.html">수강생 페이지</a></div></div>`;$('#admin-signout').onclick=()=>signOut(auth);return}A.profile=snap.data();await loadAdmin()}catch(err){root.innerHTML=`<div class="card" style="max-width:570px;margin:60px auto"><h3>관리자 페이지 불러오기 실패</h3><p class="error">${esc(ex(err))}</p><button class="btn secondary" onclick="location.reload()">새로고침</button></div>`}})}else mountAuth(root,{signup:false});

</script>
