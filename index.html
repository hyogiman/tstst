<!-- P1-08: Firebase 등 외부 스크립트를 불러오지 못하면(회사·학교 네트워크 차단 등) 백지 대신 안내를 보여 줍니다. -->
<noscript><div class="boot-error" role="alert"><h2>자바스크립트가 꺼져 있어요</h2><p>이 학습 공간은 자바스크립트가 필요합니다. 브라우저 설정에서 자바스크립트를 켠 뒤 새로고침해 주세요.</p></div></noscript>
<script>
setTimeout(function(){
  if(window.__appStarted)return;
  var root=document.getElementById('root');if(!root)return;
  root.innerHTML='<div class="boot-error" role="alert"><h2>화면을 불러오지 못했어요</h2><p>네트워크를 확인하고 새로고침해 주세요. 회사·학교 네트워크라면 다른 네트워크(휴대폰 데이터 등)로 시도해 보세요.</p><button type="button" class="btn" onclick="location.reload()">새로고침</button></div>';
},window.__BOOT_TIMEOUT_MS||8000);
</script>
<script type="module">
window.__appStarted=true; // 모듈(외부 SDK 포함)을 모두 불러와 앱이 시작되었다는 신호

import { onAuthStateChanged, updateProfile, signOut } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
import { doc, getDoc, getDocs, collection, query, where, addDoc, setDoc, updateDoc, serverTimestamp, onSnapshot, runTransaction, writeBatch } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';
import { CONFIGURED, auth, db, $, $$, esc, fmt, ex, toast, loading, loaded, empty, makeId, enId, uploadMedia, useMediaPaths, sanitizeRich, ensureProfile, mountAuth, isRecording, stopRecordingForNavigation, makeMediaUi, wireMediaUi, showLiveNotice, modalConfirm, formatDateTime, statusPill, paintPill, needsReply, byLastActivity, feedbackItems, reviewState, toDate, todayKey, daysBetween, audioMarkup, parseAnswer, encodeAnswer, normalizeQuizQuestion, isCorrectAnswer, setErrorAudience, installOfflineBanner, showLoadFailed, drafts, draftKey, removeUploaded, sessionState, sessionDateText, youtubeEmbedUrl } from './common.js?v=20261029g';


// ===== INDEX PAGE =====
setErrorAudience('student'); // P1-08: 학생에게는 개발 용어 없는 오류 문구
installOfflineBanner();
const root=$('#root');
// 로그아웃하면 이 초기값으로 되돌립니다(P0-09).
const studentInitialState=()=>({user:null,profile:null,classes:[],classId:'',weeks:[],weekId:'',tab:'assignment',quiz:null,live:{},activeQuestionId:'',directory:[],enrollmentRealName:'',enrollments:[],hadEnrollment:false,audioDrafts:{},joining:false,pastClasses:[],past:null,seenMarked:{}});
const S=studentInitialState();
const NAV=[['assignment','pencil','과제'],['quiz','review','복습'],['preview','book','예습'],['questions','chat','질문'],['classmates','people','우리 반'],['mypage','user','내 정보']];
// 하단 메뉴 아이콘: 강사 화면 사이드바와 같은 선 아이콘(기기마다 모양이 달라지는 이모지 대신)
const NAV_ICONS={
 pencil:'<path d="M4 20h4L19.5 8.5a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/>',
 review:'<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3.5V8h4.5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20.5V16h-4.5"/>',
 book:'<path d="M12 7C8 4 5 4 2 5v14c3-1 6-1 10 2 4-3 7-3 10-2V5c-3-1-6-1-10 2zM12 7v14"/>',
 chat:'<path d="M20 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-3-.4-4.2-1.1L3 20l1.2-4.2A8.5 8.5 0 1 1 20 11.5z"/>',
 people:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 11a3 3 0 0 0 0-6M18 14a5 5 0 0 1 3 5v1"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/>'
};
const navIcon=name=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${NAV_ICONS[name]||''}</svg>`;
const week=()=>S.weeks.find(w=>w.id===S.weekId);
const currentClass=()=>S.classes.find(c=>c.id===S.classId);
function stopLive(key){if(S.live[key]){S.live[key]();delete S.live[key]}}
function clearPageLive(){for(const k of Object.keys(S.live))if(!['enrollments','weeks','classSchedule'].includes(k))stopLive(k)}
function onLiveError(err){console.error('실시간 구독 실패',err);toast('실시간 연결을 확인해 주세요: '+ex(err),true)}
// 실시간 비교에서는 저장 시각만 바뀐 경우를 무시합니다.
const comparableWeeks=list=>JSON.stringify(list.map(({updatedAt,createdAt,...rest})=>rest));
const assignmentDraftKey=(wid=S.weekId)=>`${S.user?.uid}:${S.classId}:${wid}`;
// 저장하지 않은 작업: 녹음 중, 작성 중인 답안, 첨부만 해 둔 음성, 풀고 있는 퀴즈
function studentHasUnsavedWork(){
  if(isRecording())return true;
  const z=S.quiz;
  if(z&&!z.finished&&z.answers.some(a=>Array.isArray(a)?a.length:a!==null))return true;
  const text=$('#assignment-text');
  if(text&&text.value.trim()!==(text.dataset.saved||'').trim())return true;
  return S.tab==='assignment'&&!!S.audioDrafts[assignmentDraftKey()];
}
// P0-10: 작업 중(저장 안 한 작업, 입력칸 사용 중, 퀴즈 결과 확인 중)이면 화면을 다시 그리지 않습니다.
function isStudentBusy(){
  if(studentHasUnsavedWork())return true;
  if(document.activeElement?.matches('textarea,input,select,[contenteditable]'))return true;
  return !!S.quiz?.finished&&S.tab==='quiz';
}
function startWeekLive(){stopLive('weeks');if(!S.classId)return;const cid=S.classId;
  S.live.weeks=onSnapshot(query(collection(db,'classes',cid,'weeks'),where('published','==',true)),snap=>{
    if(S.classId!==cid)return;
    const incoming=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order??0)-(b.order??0));
    if(comparableWeeks(S.weeks)===comparableWeeks(incoming))return;
    const viewingGone=!!S.weekId&&!incoming.some(w=>w.id===S.weekId);
    S.weeks=incoming;
    if(isStudentBusy()){
      showLiveNotice($('#student-body'),viewingGone?'지금 보고 있는 차시가 비공개로 바뀌었어요.':'선생님이 학습 자료를 업데이트했어요.','지금 반영',applyWeekUpdate);
      return;
    }
    applyWeekUpdate();
  },handleClassAccessError);
}
async function applyWeekUpdate(){
  if(studentHasUnsavedWork()&&!(await modalConfirm('풀던 문제나 작성 중인 내용이 사라질 수 있어요. 지금 반영할까요?',{title:'새 학습 자료 반영',confirmText:'지금 반영'}))){
    showLiveNotice($('#student-body'),'선생님이 학습 자료를 업데이트했어요.','지금 반영',applyWeekUpdate);
    return;
  }
  if(!S.weeks.some(w=>w.id===S.weekId))S.weekId=S.weeks.at(-1)?.id||'';
  S.quiz=null;
  if($('#student-body'))renderBody();
}
// P0-08: 반이 보관되었거나 수강이 중지되어 반 자료를 더 읽을 수 없게 되면 수강 정보를 다시 확인합니다.
let reloadingStudent=null;
function reloadStudentClass(){
  if(!reloadingStudent)reloadingStudent=loadStudent().catch(e=>{console.error(e);toast(ex(e),true)}).finally(()=>{reloadingStudent=null});
  return reloadingStudent;
}
function handleClassAccessError(err){
  if(err?.code==='permission-denied'&&S.user){console.warn('반 접근 권한이 바뀌었습니다.',err);reloadStudentClass();return}
  onLiveError(err);
}
function startClassScheduleLive(){stopLive('classSchedule');if(!S.classId)return;const cid=S.classId;
  S.live.classSchedule=onSnapshot(doc(db,'classes',cid),snap=>{
    if(!snap.exists()||S.classId!==cid)return;
    if(snap.data().archived){reloadStudentClass();return}
    const prev=JSON.stringify(currentClass()?.schedule||[]);
    S.classes=[{id:cid,...snap.data()}];
    if(prev!==JSON.stringify(snap.data().schedule||[])&&S.tab==='mypage'&&$('#student-body')){
      if(!document.activeElement?.matches('input,textarea'))renderMyPage($('#student-body'));
      else toast('수업 일정이 바뀌었어요. 내 정보를 다시 열면 반영됩니다.');
    }
  },handleClassAccessError);
}
// D4: 한 학생은 동시에 한 반만 수강합니다. 가장 최근에 등록한 반 중 운영 중인(보관되지 않은) 반을 고릅니다(P0-08).
// 수업이 끝나 보관된 반은 '지난 반'으로 모아, 강의 영상을 뺀 기록을 읽기 전용으로 보여 줍니다(2026-10-29 요청).
const byJoinedDesc=(a,b)=>(b.joinedAt?.seconds||0)-(a.joinedAt?.seconds||0);
async function readClass(cid){
  try{const c=await getDoc(doc(db,'classes',cid));return c.exists()?{id:c.id,...c.data()}:null}
  catch(e){if(e?.code==='permission-denied')return null;throw e} // 보관된 반 읽기를 허용하기 전 규칙에서는 목록에서 빠집니다.
}
async function sortEnrollments(enrollments){
  let current=null;const past=[];
  for(const e of enrollments.filter(x=>x.status==='active').sort(byJoinedDesc)){
    const cls=await readClass(e.classId);
    if(!cls)continue;
    if(cls.archived)past.push(cls);
    else if(!current)current={enrollment:e,cls};
  }
  return {current,past};
}
function startEnrollmentLive(){stopLive('enrollments');
  S.live.enrollments=onSnapshot(query(collection(db,'enrollments'),where('uid','==',S.user.uid)),async snap=>{
    const list=snap.docs.map(d=>({id:d.id,...d.data()}));
    S.enrollments=list;S.hadEnrollment=list.length>0;
    if(S.joining||S.past)return; // 방금 직접 입장했거나 지난 반을 보는 중이면 loadStudent가 처리합니다.
    const {current:picked,past}=await sortEnrollments(list);
    S.pastClasses=past;
    const next=picked?.cls.id||'';
    if(next===S.classId)return;
    stopLive('weeks');stopLive('classSchedule');clearPageLive();
    S.classId=next;S.classes=picked?[picked.cls]:[];S.weeks=[];S.weekId='';S.quiz=null;
    S.enrollmentRealName=String(picked?.enrollment.studentName||'').trim();
    if(next){try{await loadWeeks();startWeekLive();startClassScheduleLive()}catch(e){onLiveError(e)}}
    frame();toast(next?'선생님이 지정한 반 정보가 반영되었어요.':'수강 상태가 바뀌었어요.');
  },onLiveError);
}

const wselect=()=>`<select id="student-week-picker" class="input week-chooser">${S.weeks.map(w=>`<option value="${esc(w.id)}" ${w.id===S.weekId?'selected':''}>${esc(w.label)}</option>`).join('')}</select>`;
function enterStudentHistory(){if(history.state?.senorayuStudent)return;history.replaceState({senorayuStudent:true,tab:'assignment'},'');history.pushState({senorayuStudent:true,tab:S.tab},'','#'+S.tab)}
window.addEventListener('popstate',e=>{if(!S.user||!document.querySelector('.student-app'))return;S.tab=e.state?.senorayuStudent?e.state.tab:'assignment';S.quiz=null;renderBody()});
function frame(){
  enterStudentHistory();
  root.innerHTML=`<div class="student-app"><header class="student-header"><div class="brand"><div class="logo"><img src="senorayu-mark.svg" alt="쎄뇨라유 스페인어 로고"></div><div><strong>쎄뇨라유 스페인어</strong><small>MI ESPACIO DE ESPAÑOL</small></div></div><div class="row"><span class="pill user-pill">${esc(((S.profile?.displayName==='수강생'&&S.user?.displayName)?S.user.displayName:S.profile?.displayName)||S.user?.displayName||'수강생')} 님</span><button id="student-logout" class="btn ghost small">로그아웃</button></div></header>${S.past?`<div class="past-banner" role="note"><div><strong>지난 반 · ${esc(currentClass()?.name||'')}</strong><span>수업이 끝난 반이에요. 기록은 읽기만 할 수 있고, 강의 영상은 볼 수 없어요.</span></div><button type="button" class="btn secondary small" id="past-exit">돌아가기</button></div>`:''}<main id="student-body"></main></div><nav class="student-nav ${S.past?'is-past':''}" aria-label="하단 메뉴"><div class="student-nav-inner">${(S.past?NAV.filter(([key])=>key!=='classmates'):NAV).map(([key,icon,label])=>`<button type="button" class="nav-item ${S.tab===key?'active':''}" data-tab="${key}" aria-label="${label}"><span class="nav-icon">${navIcon(icon)}</span><span>${label}</span></button>`).join('')}</div></nav>`;
  $('#student-logout').addEventListener('click',async()=>{
    // P1-07: 공용 PC에서 다음 사람이 보지 않도록 이 기기의 임시 저장 답안을 지웁니다.
    flushAssignmentDraft();
    if(drafts.countFor(S.user.uid)&&!(await modalConfirm('로그아웃하면 이 기기에 임시 저장된 답안이 지워져요. 로그아웃할까요?',{title:'로그아웃',confirmText:'로그아웃'})))return;
    drafts.clearUser(S.user.uid);
    resetStudentSession();signOut(auth); // P0-09: 구독을 먼저 끊고 로그아웃
  });
  $('#past-exit')?.addEventListener('click',closePastClass);
  $$('[data-tab]').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;if(S.tab==='preview'&&!S.past)S.weekId=upcomingWeekId()||S.weekId;history.pushState({senorayuStudent:true,tab:S.tab},'','#'+S.tab);S.quiz=null;renderBody()}));
  renderBody();
}
function bodyHeader(title,description){return `<div class="page-head"><div class="eyebrow">LEARNING JOURNEY</div><h1>${title}</h1><p>${description}</p></div>`}
function weekHeader(title,description){return `<div class="section-title"><div>${bodyHeader(title,description)}</div>${S.weeks.length?wselect():''}</div>`}
function weeklyPicker(){ $('#student-week-picker')?.addEventListener('change',e=>{S.weekId=e.target.value;S.quiz=null;renderBody()}) }
function renderBody(){
  flushAssignmentDraft(); // P1-07: 화면을 옮기기 전에 작성 중인 답안을 임시 저장
  stopRecordingForNavigation(); // P0-02: 화면을 옮기면 녹음을 멈춥니다.
  clearPageLive();$$('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.tab===S.tab));const body=$('#student-body');if(!body)return;
  if(!S.classes.length){renderJoin(body);return}
  if(S.weeks.length&&!S.weeks.some(w=>w.id===S.weekId))S.weekId=S.weeks.at(-1).id;
  if(S.tab==='mypage'){renderMyPage(body);return}
  if(S.tab==='questions'){renderQuestions(body);return}
  if(S.tab==='classmates'){renderClassmates(body);return}
  if(!S.weeks.length){body.innerHTML=S.past?bodyHeader('지난 반 자료','이 반에는 볼 수 있는 차시가 없어요.')+empty('공개된 차시가 없습니다'):bodyHeader('첫 수업을 준비하고 있어요','선생님이 학습 자료를 공개하면 이곳에서 확인할 수 있어요.')+empty('아직 공개된 차시가 없습니다','선생님이 학습 자료를 게시한 뒤 다시 확인해 주세요.');return}
  if(S.tab==='assignment')renderAssignment(body);
  if(S.tab==='quiz')renderQuiz(body);
  if(S.tab==='preview')renderPreview(body);
}
function renderJoin(body){
  const returning=S.hadEnrollment;
  body.innerHTML=`${bodyHeader(returning?'새 반에 입장해 볼까요?':'우리 반에 입장해 볼까요?',returning?'이전 반 수강이 끝났거나 수강이 중지되었어요.':'선생님이 알려 준 수강 코드 하나로 입장할 수 있어요.')}<div class="card join-card">${returning?'<p class="notice">새로 개설된 반의 수강 코드를 입력해 주세요. 이전 반으로 돌아가거나 반을 바꾸려면 선생님께 문의해 주세요.</p>':''}<form class="stack" id="join-form"><div class="field"><label for="join-code">수강 코드</label><input id="join-code" name="code" required maxlength="30" placeholder="예: HOLA2026" autocomplete="off" autocapitalize="characters"></div><button type="submit" class="btn">반에 참여하기 →</button></form></div>${pastClassesCard()}`;
  wireJoin();wirePastClasses(body);
}
function wireJoin(){const form=$('#join-form');form?.addEventListener('submit',async e=>{
  e.preventDefault();const code=String(new FormData(form).get('code')||'').trim().toUpperCase().replace(/\s+/g,'');
  if(!code){toast('수강 코드를 입력해 주세요.',true);return}
  const btn=$('button[type="submit"]',form);if(btn)btn.disabled=true;
  try{
    const mapping=await getDoc(doc(db,'joinCodes',code));
    if(!mapping.exists()||!mapping.data().classId)throw Error('등록된 수강 코드가 없습니다. 코드를 확인해 주세요.');
    const cid=mapping.data().classId;
    // 같은 반에 이전 등록 기록이 있으면 학생이 스스로 되살릴 수 없습니다. 강사가 다시 등록합니다(P0-08).
    const previous=S.enrollments.find(x=>x.classId===cid);
    if(previous)throw Error(previous.status==='active'?'이미 등록된 반입니다. 화면을 새로고침해 주세요.':'이 반은 이전에 등록한 기록이 있어요. 선생님께 다시 등록을 요청해 주세요.');
    const entry={uid:S.user.uid,classId:cid,studentName:((S.profile.displayName==='수강생'&&S.user.displayName)?S.user.displayName:S.profile.displayName)||S.user.email,email:S.user.email||'',joinCode:code,status:'active',joinedAt:serverTimestamp()};
    S.joining=true;
    try{await createEnrollment(cid,entry)}
    catch(err){if(err?.code==='permission-denied')throw Error('지금은 이 반에 입장할 수 없어요. 이전 반 수강이 아직 진행 중이라면 선생님께 문의해 주세요.');throw err}
    try{await setDoc(doc(db,'classes',cid,'members',S.user.uid),{uid:S.user.uid,name:entry.studentName,status:'active',joinedAt:serverTimestamp()},{merge:true})}catch(err){console.warn('반 명단 업데이트 실패',err)}

async function createEnrollment(cid,entry){

  batch.set(ref,entry);
  batch.set(doc(collection(ref,'events')),{type:'joined',at:serverTimestamp(),by:S.user.uid,toClassId:cid});
  try{await batch.commit()}
  catch(err){
    if(err?.code!=='permission-denied')throw err;
    console.warn('입장 기록을 남기지 못해 수강 등록만 저장합니다(보안 규칙 확인 필요).',err);

  }
}

// P0-04·P1-01: 다시 제출해도 처음 제출 시각은 지키고, 제출 회차(revision)를 올립니다.
// 제출 1회 = revisions/{회차} 문서 1개(변경 불가 이력). 요약 문서는 최신 제출과 회차 정보를 담습니다.
// revision이 없는 이전 문서에 처음 다시 제출하면, 그 내용을 1차 기록으로 먼저 보존하고 새 제출을 2차로 저장합니다.
async function saveSubmission(wid,{text,audioPath,audioDuration=null}){
  const ref=doc(db,'classes',S.classId,'weeks',wid,'submissions',S.user.uid);
  const studentName=((S.profile.displayName==='수강생'&&S.user.displayName)?S.user.displayName:S.profile.displayName)||S.user.email;
  await runTransaction(db,async tx=>{
    const snap=await tx.get(ref),old=snap.exists()?snap.data():null;
    const legacy=old&&!Number.isInteger(old.revision);
    const revision=old?(legacy?2:old.revision+1):1;
    if(legacy&&(old.text||old.audioPath)){
      tx.set(doc(ref,'revisions','1'),{revision:1,text:old.text||'',audioPath:old.audioPath||'',audioDuration:old.audioDuration??null,submittedAt:old.submittedAt,studentName:old.studentName||studentName,legacy:true});
    }
    tx.set(doc(ref,'revisions',String(revision)),{revision,text,audioPath,audioDuration,submittedAt:serverTimestamp(),studentName});
    tx.set(ref,{
      userId:S.user.uid,studentName,email:S.user.email||'',text,audioPath,audioDuration,
      submittedAt:serverTimestamp(),latestSubmittedAt:serverTimestamp(),revision,
      firstSubmittedAt:old?(old.firstSubmittedAt||old.submittedAt||serverTimestamp()):serverTimestamp(),
    },{merge:true});
  });
}
// 이전 4지선다 문제도 자동으로 단일 정답형으로 처리합니다.
function answerLabel(q,answer){
  const a=Array.isArray(answer)?answer:answer===null||answer===undefined?[]:[answer];
  return a.length?a.map(i=>q.options[Number(i)]||'?').join(', '):'미응답';
}
function shuffleQuestion(q){
  const opt=q.options.map((text,index)=>({text,index}));
  if(q.type==='ox')return opt;
  for(let i=opt.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opt[i],opt[j]]=[opt[j],opt[i]]}
  return opt;
}

  body.insertAdjacentHTML('beforeend',`<div class="card" id="quiz-stage"><div class="between"><div><h2>${esc(w.quiz.title||'이번 주 단어 퀴즈')}</h2></div><span class="pill brand">${w.quiz.questions.length}문항</span></div><div id="quiz-last-status">${last?`<p class="notice" style="margin-top:17px">최근 점수: ${last.score??0}/${last.total??0}점 · 다시 풀 수 있습니다.</p>`:''}</div><div id="quiz-live-feedback">${feedbackMarkup(last)}</div><div style="margin-top:19px" id="quiz-content"></div></div>`);
  // P1-02: 응시를 시작할 때의 문항과 버전을 고정합니다. 풀던 중 강사가 퀴즈를 바꿔도 시작한 버전으로 채점·저장합니다.
  const qs=w.quiz.questions.map(normalizeQuizQuestion);
  const progressKey=S.past?'':draftKey(S.user.uid,S.classId,w.id,'quiz',Number(w.quiz.version)||0);
  S.quiz={id:w.id,version:Number(w.quiz.version)||null,questions:qs,shuffled:qs.map(shuffleQuestion),answers:Array(qs.length).fill(null),index:0,last,progressKey};
  useMediaPaths(body);markFeedbackSeen('quizResults',w.id,last);
  // P1-07: 같은 탭에서 풀던 문제가 있으면(다른 탭에 다녀오거나 새로고침) 이어서 풀지 묻습니다.

    $('#quiz-content').innerHTML=`<div class="resume-card"><p><strong>풀던 문제가 있어요</strong> · ${saved.index+1} / ${qs.length}번 문항까지 진행</p><div class="row"><button type="button" class="btn" data-resume>이어서 풀기</button><button type="button" class="btn secondary" data-restart>처음부터</button></div></div>`;
    $('[data-resume]').onclick=()=>{Object.assign(S.quiz,saved);showQuestion()};
    $('[data-restart]').onclick=()=>{drafts.remove(progressKey,'session');showQuestion()};
  }else showQuestion();
  S.live.quiz=onSnapshot(doc(db,'classes',S.classId,'weeks',w.id,'quizResults',S.user.uid),snapshot=>{
    if(S.tab!=='quiz'||S.weekId!==w.id)return;

    markFeedbackSeen('quizResults',w.id,d);
    if(feedback){const html=feedbackMarkup(d);if(feedback.dataset.rendered!==html){feedback.innerHTML=html;feedback.dataset.rendered=html;useMediaPaths(feedback)}}
  },onLiveError);

}
// 풀이 진행(답·현재 문항·보기 섞인 순서)을 이 탭에 보관합니다. 키에 퀴즈 버전이 들어가 문제가 바뀌면 이어 풀지 않습니다.
function saveQuizProgress(){
  const z=S.quiz;if(!z?.progressKey)return;
  const started=z.answers.some(a=>Array.isArray(a)?a.length:a!==null);
  drafts.set(z.progressKey,started?JSON.stringify({answers:z.answers,index:z.index,order:z.shuffled.map(list=>list.map(c=>c.index))}):'','session');
}
function readQuizProgress(key,qs){
  if(!key)return null;
  try{
    const raw=JSON.parse(drafts.get(key,'session')||'null');
    if(!raw||raw.answers?.length!==qs.length||!(raw.index>=0&&raw.index<qs.length))return null;
    const shuffled=raw.order.map((idxs,qi)=>idxs.map(i=>({text:qs[qi].options[i],index:i})));
    if(shuffled.some((list,qi)=>list.length!==qs[qi].options.length))return null;
    return {answers:raw.answers,index:raw.index,shuffled};
  }catch(e){return null}
}
function showQuestion(){const z=S.quiz;if(!z)return;const node=$('#quiz-content');if(!node)return;saveQuizProgress();
  const n=z.index,q=z.questions[n],multi=q.type==='multiple';const current=z.answers[n],selected=Array.isArray(current)?current:current===null?[]:[current];
  node.innerHTML=`<div class="question-count">QUESTION ${n+1} / ${z.questions.length} <span class="pill brand" style="margin-left:7px">${multi?'복수정답':q.type==='ox'?'O / X':'객관식'}</span></div>
  <div class="progress"><div style="width:${((n+1)/z.questions.length)*100}%"></div></div>
  <h3 style="font-size:21px;margin-bottom:8px">${esc(q.stem)}</h3>
  <p class="hint" style="margin-bottom:19px">${multi?'정답이라고 생각하는 항목을 모두 선택하세요.':'정답 한 개를 선택하세요.'}</p>
  <div>${z.shuffled[n].map((choice,i)=>`<button type="button" aria-pressed="${selected.includes(choice.index)}" class="answer-option ${selected.includes(choice.index)?'selected':''}" data-answer="${choice.index}"><span class="answer-key">${multi?(selected.includes(choice.index)?'☑':'□'):(q.type==='ox'?choice.text:i+1)}</span><span>${esc(choice.text)}</span></button>`).join('')}</div>
  <div class="between" style="margin-top:25px"><button class="btn secondary" id="quiz-prev" ${n===0?'disabled':''}>← 이전</button><button class="btn" id="quiz-next">${n===z.questions.length-1?'결과 확인하기':'다음 문제 →'}</button></div>`;
  $$('[data-answer]',node).forEach(el=>el.addEventListener('click',()=>{
    const value=Number(el.dataset.answer);if(multi){const a=Array.isArray(z.answers[n])?[...z.answers[n]]:[];z.answers[n]=a.includes(value)?a.filter(x=>x!==value):[...a,value]}
    else z.answers[n]=value;
    showQuestion();
  }));
  $('#quiz-prev').onclick=()=>{z.index--;showQuestion()};
  $('#quiz-next').onclick=()=>{if(z.answers[n]===null||Array.isArray(z.answers[n])&&!z.answers[n].length){toast('선택지를 하나 이상 선택해 주세요.',true);return}if(n<z.questions.length-1){z.index++;showQuestion()}else finishQuiz()};
}
async function finishQuiz(){const z=S.quiz;if(!z)return;
  if(S.past){
    // 지난 반은 연습 모드: 채점 결과만 보여 주고 저장하지 않습니다.
    const score=z.questions.filter((q,i)=>isCorrectAnswer(q,z.answers[i])).length;
    z.finished=true;showQuizResult($('#quiz-content'),z,score,'연습 결과는 저장되지 않아요.');
    return;
  }
  if(!S.weeks.some(w=>w.id===z.id)){toast('이 차시가 비공개로 바뀌어 지금은 결과를 저장할 수 없어요. 선생님께 문의해 주세요.',true);return}
  const score=z.questions.filter((q,i)=>isCorrectAnswer(q,z.answers[i])).length,target=$('#quiz-content');loading(target);
  try{
    const resultRef=doc(db,'classes',S.classId,'weeks',z.id,'quizResults',S.user.uid);
    const attemptRef=doc(collection(db,'classes',S.classId,'weeks',z.id,'quizResults',S.user.uid,'attempts'));
    // Firestore는 배열 안의 배열을 저장하지 못하므로(복수정답 [0,2]) 문항 ID별 맵과 문자열 목록으로 저장합니다(P1-02).
    const answersById=Object.fromEntries(z.questions.map((q,i)=>[q.id,parseAnswer(z.answers[i])]));
    const record={answers:z.answers.map(encodeAnswer),answersById,questionIds:z.questions.map(q=>q.id),quizVersion:z.version};
    await runTransaction(db,async tx=>{
      const oldSnap=await tx.get(resultRef),old=oldSnap.exists()?oldSnap.data():null;
      const first=old?.firstAttempt || (old?{score:Number(old.score)||0,total:Number(old.total)||0,submittedAt:old.submittedAt||null,answers:(old.answers||[]).map(encodeAnswer),legacy:true}:{score,total:z.questions.length,submittedAt:new Date().toISOString(),answers:record.answers,answersById,quizVersion:z.version,legacy:false});
      const count=Math.max(0,Number(old?.attemptCount)|| (old?1:0))+1;
      const name=((S.profile.displayName==='수강생'&&S.user.displayName)?S.user.displayName:S.profile.displayName)||S.user.email;
      tx.set(attemptRef,{userId:S.user.uid,...record,score,total:z.questions.length,attemptNumber:count,submittedAt:serverTimestamp()});
      tx.set(resultRef,{userId:S.user.uid,studentName:name,email:S.user.email||'',...record,score,total:z.questions.length,submittedAt:serverTimestamp(),firstAttempt:first,attemptCount:count},{merge:true});
    });
    z.finished=true;drafts.remove(z.progressKey,'session');
    if(S.weekId!==z.id||S.tab!=='quiz')return;
    showQuizResult(target,z,score);toast('복습 결과가 저장되었습니다.');
  }catch(e){target.classList.remove('loading');toast(ex(e),true);showQuestion()}
}
function showQuizResult(target,z,score,note=''){
    if(!target)return;
    const pct=Math.round(score/z.questions.length*100);target.classList.remove('loading');
    target.innerHTML=`<div style="text-align:center"><div class="eyebrow">QUIZ COMPLETE ✨</div><h2>복습을 완료했어요!</h2><div class="score-ring" style="--angle:${pct}%"><div class="score-ring-inner"><div><strong>${score} / ${z.questions.length}</strong><br><span>정답 ${pct}%</span></div></div></div><p class="muted">복수정답은 정답을 모두 선택해야 1점입니다.</p>${note?`<p class="notice quiz-note">${esc(note)}</p>`:''}</div><div class="separator"></div>${z.questions.map((q,i)=>{const good=isCorrectAnswer(q,z.answers[i]);return `<div class="review-line"><div class="between"><strong>${i+1}. ${esc(q.stem)}</strong>${good?statusPill('success','정답'):statusPill('danger','오답')}</div><p class="hint" style="margin-top:7px">내 답: ${esc(answerLabel(q,z.answers[i]))} · 정답: ${esc(answerLabel(q,q.correctIndices))}</p>${q.explanation?`<p class="hint" style="margin-top:5px">💡 ${esc(q.explanation)}</p>`:''}</div>`}).join('')}${feedbackMarkup(z.last)}<button id="quiz-retry" class="btn secondary full" style="margin-top:20px">다시 풀기</button>`;
    useMediaPaths(target);$('#quiz-retry').onclick=()=>renderBody();
}
// D8: N차시 문서의 예습 = N차시 수업 전에 볼 자료. 수업 날짜는 차시 문서 → 반 일정 사본 순으로 찾습니다.
const sessionDateOf=w=>w?.sessionDate||currentClass()?.schedule?.find(x=>x.weekId===w?.id)?.date||'';
// 예습 탭을 열 때 기본 차시: 오늘이거나 가장 가까운 다가오는 공개 차시(없으면 마지막 차시)
function upcomingWeekId(){
  const list=S.weeks.map(w=>({w,date:sessionDateOf(w)})).filter(x=>x.date&&['today','upcoming'].includes(sessionState({date:x.date})));
  list.sort((a,b)=>a.date.localeCompare(b.date));
  return (list[0]?.w||S.weeks.at(-1))?.id||'';
}
function videoMarkup(v,i){

async function drawAttendanceOverview(){

  const dict={present:['success','출석'],late:['success','출석'],absent:['danger','불참'],excused:['danger','불참'],unchecked:['neutral','미입력'],failed:['warning','불러오지 못함']};

  for(const w of profileSessions){S.live['attendance:'+w.id]=onSnapshot(doc(db,'classes',S.classId,'weeks',w.id,'attendance',S.user.uid),snap=>{

// 질문 · 답변: 질문은 본인과 강사만, 댓글은 질문 작성자와 강사만 볼 수 있습니다.
function questionPath(qid){return ['classes',S.classId,'questions',qid]}
function renderQuestions(body){
  const newQuestionCard=S.past?'':`<div class="card stack"><h3>새 질문</h3><form id="question-create" class="stack"><div class="field"><label>제목</label><input name="title" required maxlength="100" placeholder="예: 오늘 배운 표현이 궁금해요"></div><div class="field"><label>질문 내용</label><textarea name="content" required maxlength="8000" rows="6" placeholder="질문을 자세히 작성해 주세요."></textarea></div><button class="btn" type="submit">질문 보내기</button></form></div>`;
  // 지난 반: 주고받은 질문과 답변만 읽을 수 있습니다. 새 질문은 현재 반에서 남깁니다.
  body.innerHTML=(S.past?bodyHeader('질문 기록','지난 반에서 주고받은 질문과 답변이에요. 새 질문은 현재 반에서 남겨 주세요.'):bodyHeader('질문하기','궁금한 점을 선생님께 남겨보세요. 답변은 실시간으로 표시됩니다.'))+`<div class="${S.past?'stack':'grid2'}" style="align-items:start">${newQuestionCard}<div class="stack"><div class="between"><h3>내 질문</h3><span class="pill brand" id="question-count">0건</span></div><div id="question-list" class="question-list"><div class="loading">질문 확인 중</div></div></div></div><div id="student-thread" style="margin-top:17px"></div>`;
  if($('#question-create'))$('#question-create').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,fd=new FormData(form);const title=String(fd.get('title')||'').trim(),content=String(fd.get('content')||'').trim();if(!title||!content)return;const btn=$('button[type="submit"]',form);btn.disabled=true;try{await addDoc(collection(db,'classes',S.classId,'questions'),{uid:S.user.uid,studentName:S.profile.displayName||'수강생',title,content,createdAt:serverTimestamp(),status:'open',needsTeacherReply:true,lastMessageAt:serverTimestamp(),lastSenderRole:'student'});form.reset();toast('질문이 전송되었습니다.')}catch(err){toast(ex(err),true)}finally{btn.disabled=false}};
  S.live.questions=onSnapshot(query(collection(db,'classes',S.classId,'questions'),where('uid','==',S.user.uid)),snap=>{
    if(S.tab!=='questions')return;const list=$('#question-list');if(!list)return;
    const docs=snap.docs.map(d=>({id:d.id,...d.data()})).sort(byLastActivity); // 최근 대화순(P0-03)
    $('#question-count').textContent=docs.length+'건';list.classList.remove('loading');
    list.innerHTML=docs.map(q=>`<button class="question-thread ${S.activeQuestionId===q.id?'thread-open':''}" type="button" data-qid="${esc(q.id)}" style="text-align:left"><div class="between"><strong>${esc(q.title)}</strong>${studentQuestionBadge(q)}</div><p class="hint" style="margin-top:5px">${esc(formatDateTime(q.lastMessageAt||q.createdAt))}</p><p class="muted" style="font-size:13px;margin-top:7px">${esc(q.content.slice(0,110))}</p></button>`).join('')||empty('아직 질문이 없습니다','첫 질문을 남겨 보세요.');
    $$('[data-qid]',list).forEach(el=>el.onclick=()=>{S.activeQuestionId=el.dataset.qid;$$('[data-qid]',list).forEach(b=>b.classList.toggle('thread-open',b===el));showStudentThread(docs.find(q=>q.id===S.activeQuestionId))});
    if(S.activeQuestionId)markQuestionSeen(docs.find(q=>q.id===S.activeQuestionId)); // 대화를 연 채로 새 답변이 오면 확인한 것으로
    if(S.activeQuestionId&&!docs.some(q=>q.id===S.activeQuestionId)){S.activeQuestionId='';stopLive('replies');$('#student-thread').innerHTML=''}
    else if(S.activeQuestionId && !S.live.replies)showStudentThread(docs.find(q=>q.id===S.activeQuestionId));
  },err=>{showLoadFailed($('#question-list'),()=>renderBody(),err);onLiveError(err)});
}
// 학생 목록 배지: 선생님이 마지막으로 답했으면 '답변 도착', 학생이 마지막이면 '답변 대기'(P0-03)
function studentQuestionBadge(q){
  if(needsReply(q))return statusPill('warning','답변 대기');
  return statusPill('success',q.lastSenderRole==='admin'?'답변 도착':'답변 완료');
}
// 질문 대화를 연 시각(P1-05): 마지막으로 연 뒤 새 대화가 있을 때만 기록합니다(새 답변 배지의 기준).
function markQuestionSeen(q){
  if(S.past||!q)return;
  const last=toDate(q.lastMessageAt||q.createdAt)?.getTime()||0,seen=toDate(q.studentSeenAt)?.getTime()||0,key='q:'+q.id;
  if(!last||last<=seen||S.seenMarked[key]>=last)return;
  S.seenMarked[key]=last;
  updateDoc(doc(db,...questionPath(q.id)),{studentSeenAt:serverTimestamp()}).catch(e=>console.warn('질문 확인 시각 저장 실패',e));
}
function showStudentThread(q){if(!q)return;stopLive('replies');const holder=$('#student-thread');if(!holder)return;markQuestionSeen(q);
  holder.innerHTML=`<div class="card stack"><div class="between"><div><h3>${esc(q.title)}</h3><p class="hint">${fmt(q.createdAt)}</p></div><button class="btn ghost small" type="button" id="close-thread">닫기 ×</button></div><div class="subtle" style="white-space:pre-wrap">${esc(q.content)}</div><h3>대화</h3><div id="student-replies" class="stack"><div class="loading">답변 확인 중</div></div>${S.past?'':`<form id="student-reply-form" class="stack"><div class="field"><label>추가 질문 또는 답장</label><textarea name="text" rows="3" required maxlength="8000" placeholder="선생님께 전할 말을 작성해 주세요."></textarea></div><button class="btn" type="submit">답장 보내기</button></form>`}</div>`;
  $('#close-thread').onclick=()=>{S.activeQuestionId='';stopLive('replies');holder.innerHTML='';$$('[data-qid]').forEach(b=>b.classList.remove('thread-open'))};
  if($('#student-reply-form'))$('#student-reply-form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,text=String(new FormData(form).get('text')||'').trim();if(!text)return;const btn=$('button[type="submit"]',form);btn.disabled=true;try{
    // 추가 질문·답장은 답장과 질문 상태('답변 대기')를 한 번에 저장합니다(P0-03).
    const batch=writeBatch(db);
    batch.set(doc(collection(db,...questionPath(q.id),'replies')),{uid:S.user.uid,role:'student',author:S.profile.displayName||'수강생',text,createdAt:serverTimestamp()});
    batch.update(doc(db,...questionPath(q.id)),{status:'open',needsTeacherReply:true,lastMessageAt:serverTimestamp(),lastSenderRole:'student',updatedAt:serverTimestamp()});
    await batch.commit();form.reset()}catch(err){toast(ex(err),true)}finally{btn.disabled=false}};
  S.live.replies=onSnapshot(collection(db,...questionPath(q.id),'replies'),snap=>{if(S.activeQuestionId!==q.id)return;const list=$('#student-replies');if(!list)return;const replies=snap.docs.map(d=>d.data()).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));loaded(list,replies.map(r=>`<div class="reply-bubble ${r.role==='admin'?'teacher':'student'}"><p class="hint">${r.role==='admin'?'선생님':'나'} · ${fmt(r.createdAt)}</p><p style="white-space:pre-wrap">${esc(r.text)}</p></div>`).join('')||'<p class="hint">아직 댓글이 없습니다.</p>')},onLiveError);
}
function renderClassmates(body){body.innerHTML=bodyHeader('우리 반','함께 스페인어를 공부하는 친구들이에요.')+`<div class="card"><div class="between" style="margin-bottom:18px"><h3>${esc(currentClass()?.name||'수강반')}</h3><span class="pill brand" id="classmate-count">—</span></div><div id="classmates-list" class="grid3"><div class="loading">수강생 확인 중</div></div><p class="hint" style="margin-top:17px">개인정보 보호를 위해 이름만 공개되며, 이메일이나 개별 학습 성적은 보이지 않습니다.</p></div>`;
  S.live.classmates=onSnapshot(collection(db,'classes',S.classId,'members'),snap=>{
    if(S.tab!=='classmates')return;const list=$('#classmates-list');if(!list)return;const members=snap.docs.map(d=>d.data()).filter(m=>m.status==='active').sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));$('#classmate-count').textContent=members.length+'명';loaded(list,members.map(m=>`<div class="classmate-card"><span class="classmate-avatar">${esc((m.name||'?')[0])}</span><div><strong>${esc(m.name||'이름 미등록')}</strong>${m.uid===S.user.uid?'<p class="hint">나</p>':''}</div></div>`).join('')||empty('아직 반 명단이 없습니다','강사가 수강생 관리를 열면 기존 명단도 동기화됩니다.'));
  },err=>{showLoadFailed($('#classmates-list'),()=>renderBody(),err);onLiveError(err)});
}

if(CONFIGURED){onAuthStateChanged(auth,async user=>{try{if(!user){resetStudentSession();mountAuth(root);return}S.user=user;root.innerHTML='<div class="loading" style="min-height:90vh">학습 정보를 준비하고 있습니다</div>';S.profile=await ensureProfile(user);if(S.profile.role==='admin'){root.innerHTML=`<div style="max-width:450px;margin:100px auto;padding:24px" class="card"><h2>강사 계정입니다</h2><p style="margin:15px 0">강사 관리 페이지를 이용해 주세요.</p><a class="btn" href="admin.html">강사 페이지로 이동 →</a></div>`;return}await loadStudent()}catch(e){console.error(e);root.innerHTML=`<div class="card" style="max-width:550px;margin:70px auto"><h3>불러오기 실패</h3><p class="error">${esc(ex(e))}</p><button class="btn secondary" id="retry-student">다시 시도</button></div>`;$('#retry-student').onclick=()=>location.reload()}})}else mountAuth(root);


</script>
</body>
</html>
