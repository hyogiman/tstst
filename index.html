<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, signOut, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
import { getFirestore, doc, getDoc, getDocs, collection, query, where, addDoc, setDoc, updateDoc, deleteDoc, serverTimestamp, arrayUnion } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';
import { getStorage, ref as storageRef, uploadBytesResumable, getDownloadURL, getBlob, deleteObject } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-storage.js';

// 두 HTML 파일에 동일한 Firebase 웹 앱 설정을 입력하세요. API key는 비밀 키가 아니며 보안은 Rules가 담당합니다.
const firebaseConfig = {
  apiKey: 'PASTE_API_KEY',
  authDomain: 'PASTE_PROJECT_ID.firebaseapp.com',
  projectId: 'PASTE_PROJECT_ID',
  storageBucket: 'PASTE_PROJECT_ID.firebasestorage.app',
  messagingSenderId: 'PASTE_MESSAGING_SENDER_ID',
  appId: 'PASTE_APP_ID'
};
const CONFIGURED = !firebaseConfig.apiKey.startsWith('PASTE_') && !firebaseConfig.projectId.startsWith('PASTE_');
const app = CONFIGURED ? initializeApp(firebaseConfig) : null;
const auth = CONFIGURED ? getAuth(app) : null;
const db = CONFIGURED ? getFirestore(app) : null;
const storage = CONFIGURED ? getStorage(app) : null;
const $ = (s, el=document)=>el.querySelector(s);
const $$ = (s, el=document)=>Array.from(el.querySelectorAll(s));
const esc = v => String(v??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ts => { if (!ts) return '기록 없음'; let d = ts.toDate?.() ?? new Date(ts); return Number.isNaN(+d)?'기록 없음':new Intl.DateTimeFormat('ko-KR',{dateStyle:'medium',timeStyle:'short'}).format(d); };
const ex = e => { console.error(e); const c=e?.code||''; return ({'auth/invalid-credential':'이메일 또는 비밀번호를 확인해 주세요.','auth/email-already-in-use':'이미 가입된 이메일입니다.','auth/weak-password':'비밀번호는 6자 이상으로 설정해 주세요.','auth/invalid-email':'올바른 이메일을 입력해 주세요.','auth/unauthorized-domain':'Firebase Authentication에서 현재 도메인을 승인해 주세요.','auth/too-many-requests':'로그인 시도가 많습니다. 잠시 후 다시 시도해 주세요.','permission-denied':'접근 권한이 없습니다. 보안 규칙 또는 계정 권한을 확인해 주세요.','storage/unauthorized':'파일 저장 권한이 없습니다. Storage 보안 규칙을 확인해 주세요.','storage/quota-exceeded':'Storage 사용량 또는 요금제 제한을 확인해 주세요.'})[c] || e?.message || '처리 중 오류가 발생했습니다.'; };
let toastTimer; function toast(message,bad=false){const box=$('#toast');if(!box)return;box.textContent=message;box.className='toast show'+(bad?' bad':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.className='toast',4200)}
function loading(el){el.innerHTML='<div class="loading">불러오는 중입니다</div>'}
function empty(title,detail=''){return `<div class="empty"><span class="symbol">🌿</span><strong>${esc(title)}</strong><p>${esc(detail)}</p></div>`;}
function makeId(){return (globalThis.crypto?.randomUUID?.() || Math.random().toString(36).slice(2));}
const enId = (uid,cid)=>`${uid}_${cid}`;
const isMedia = (file,kind) => kind==='audio'?file.type.startsWith('audio/'):kind==='image'?file.type.startsWith('image/'):kind==='video'?file.type.startsWith('video/'):true;
const sizeLimit={audio:15*1024*1024,image:8*1024*1024,video:200*1024*1024,file:20*1024*1024};
async function uploadMedia(file,path,kind,progressEl){
  if(!file)throw Error('파일을 선택해 주세요.');
  if(!isMedia(file,kind))throw Error('선택한 파일 형식을 확인해 주세요.');
  if(file.size>sizeLimit[kind])throw Error(`파일 크기 제한을 초과했습니다. (${Math.round(sizeLimit[kind]/1024/1024)}MB)`);
  const r=storageRef(storage,path);
  return new Promise((resolve,reject)=>{
    const task=uploadBytesResumable(r,file,{contentType:file.type||'application/octet-stream'});
    task.on('state_changed',snap=>{if(progressEl)progressEl.textContent=`업로드 ${Math.round(snap.bytesTransferred/snap.totalBytes*100)}%`},reject,()=>{if(progressEl)progressEl.textContent='업로드 완료';resolve(path)});
  });
}
async function urlFor(path){try{return path?await getDownloadURL(storageRef(storage,path)):null}catch(e){console.warn('파일을 열 수 없습니다.',e);return null}}
function useMediaPaths(container){
  if(!container)return;
  $$('[data-media-path]',container).forEach(async el=>{
    const path=el.dataset.mediaPath;
    try{
      // 학생의 과제·피드백 음성은 서명된 다운로드 링크를 만들지 않고,
      // 인증된 Firebase SDK로 Blob을 받아 접근 제어를 재검증합니다. CORS 설정 필요.
      let u;
      if(el.tagName==='A'||el.tagName==='IMG'||el.tagName==='VIDEO')u=await urlFor(path);
      else if(el.tagName==='AUDIO'){
        const blob=await getBlob(storageRef(storage,path),15*1024*1024);
        u=URL.createObjectURL(blob);el.dataset.objectUrl=u;
      }else u=await urlFor(path);
      if(!el.isConnected){if(el.dataset.objectUrl)URL.revokeObjectURL(el.dataset.objectUrl);return}
      if(!u)throw Error('파일 주소 없음');
      if(el.tagName==='A'){el.href=u;el.target='_blank';el.rel='noopener noreferrer';}
      else el.src=u;
    }catch(e){console.warn('미디어 읽기 실패',e);if(el.isConnected)el.replaceWith(Object.assign(document.createElement('span'),{textContent:'파일을 불러오지 못했습니다. (권한/CORS 확인)',className:'error'}))}
  });
}
function sanitizeRich(html){
  const parsed=new DOMParser().parseFromString(`<div>${html||''}</div>`,'text/html');
  const allowed=new Set(['P','DIV','BR','STRONG','B','EM','I','U','S','UL','OL','LI','H1','H2','H3','H4','BLOCKQUOTE','SPAN','FONT','A']);
  const styleKeys=new Set(['color','background-color','font-size','font-family','font-weight','text-align','font-style','text-decoration']);
  function safeNode(node){
    if(node.nodeType===Node.TEXT_NODE)return document.createTextNode(node.textContent);
    if(node.nodeType!==Node.ELEMENT_NODE)return document.createDocumentFragment();
    const tag=node.tagName; const el=allowed.has(tag)?document.createElement(tag.toLowerCase()):document.createDocumentFragment();
    if(el.nodeType===Node.ELEMENT_NODE){
      if(tag==='A'){const href=node.getAttribute('href')||'';if(/^https?:\/\//i.test(href)){el.setAttribute('href',href);el.setAttribute('target','_blank');el.setAttribute('rel','noopener noreferrer')}}
      if(tag==='FONT'){
        const sz=node.getAttribute('size');if(sz&&/^[1-7]$/.test(sz))el.setAttribute('size',sz);
        const color=node.getAttribute('color');if(color&&/^(#[0-9a-f]{3,8}|[a-z]{3,16}|rgb\([\d\s,%.]+\))$/i.test(color))el.setAttribute('color',color);
        const face=node.getAttribute('face');if(face&&/^[\w가-힣 ,'-]{1,65}$/.test(face))el.setAttribute('face',face);
      }
      const style=node.getAttribute('style');if(style){
        style.split(';').forEach(item=>{const [k,...v]=item.split(':');const key=k?.trim().toLowerCase(), val=v.join(':').trim();if(styleKeys.has(key)&&/^[\w\s#(),.%'-]{1,75}$/.test(val)&&!/(url|expression|behavior|javascript)/i.test(val))el.style.setProperty(key,val)})
      }
    }
    Array.from(node.childNodes).forEach(child=>el.appendChild(safeNode(child)));return el;
  }
  const wrapper=document.createElement('div');Array.from(parsed.body.firstElementChild?.childNodes||[]).forEach(n=>wrapper.appendChild(safeNode(n)));return wrapper.innerHTML;
}

let activeRecorder=null;
async function recordStart(onFile,onStatus){
  if(activeRecorder)throw Error('현재 녹음 중인 항목을 먼저 종료해 주세요.');
  if(!navigator.mediaDevices?.getUserMedia||!globalThis.MediaRecorder)throw Error('이 브라우저에서 음성 녹음을 지원하지 않습니다. 음성 파일을 선택해 주세요.');
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const options=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg'].find(t=>MediaRecorder.isTypeSupported(t));
  let recorder;try{recorder=options?new MediaRecorder(stream,{mimeType:options}):new MediaRecorder(stream)}catch(err){stream.getTracks().forEach(t=>t.stop());throw err}
  const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());activeRecorder=null;const mime=recorder.mimeType||'audio/webm';const ext=mime.includes('mp4')?'m4a':mime.includes('ogg')?'ogg':'webm';const file=new File(chunks,`recording-${Date.now()}.${ext}`,{type:mime});onFile(file);onStatus('녹음 완료 · '+(file.size/1024).toFixed(0)+'KB');};
  recorder.start();activeRecorder=recorder;onStatus('● 녹음 중입니다. 종료 버튼을 눌러 주세요.');
}

  const last=snap.exists()?snap.data():null;
  body.insertAdjacentHTML('beforeend',`<div class="card" id="quiz-stage"><div class="between"><div><span class="kicker">${esc(w.label)}</span><h2>${esc(w.quiz.title||'이번 주 단어 퀴즈')}</h2></div><span class="pill green">${w.quiz.questions.length}문항</span></div>${last?`<p class="notice" style="margin-top:17px">최근 점수: ${last.score??0}/${last.total??0}점 (${fmt(last.submittedAt)}) · 다시 풀 수 있습니다.</p>${feedbackMarkup(last)}`:''}<div style="margin-top:19px" id="quiz-content"></div></div>`);
  const qs=w.quiz.questions;S.quiz={id:w.id,questions:qs,shuffled:qs.map(shuffleQuestion),answers:Array(qs.length).fill(null),index:0,last};
  useMediaPaths(body);showQuestion();
}
function showQuestion(){const z=S.quiz;if(!z)return;const node=$('#quiz-content');if(!node)return;const n=z.index,q=z.questions[n];node.innerHTML=`<div class="question-count">QUESTION ${n+1} / ${z.questions.length}</div><div class="progress"><div style="width:${((n+1)/z.questions.length)*100}%"></div></div><h3 style="font-size:21px;margin-bottom:20px">${esc(q.stem)}</h3><div>${z.shuffled[n].map((choice,i)=>`<button class="answer-option ${z.answers[n]===choice.index?'selected':''}" data-answer="${choice.index}"><span class="answer-key">${i+1}</span><span>${esc(choice.text)}</span></button>`).join('')}</div><div class="between" style="margin-top:25px"><button class="btn secondary" id="quiz-prev" ${n===0?'disabled':''}>← 이전</button><button class="btn" id="quiz-next">${n===z.questions.length-1?'결과 확인하기':'다음 문제 →'}</button></div>`;
  $$('[data-answer]',node).forEach(el=>el.addEventListener('click',()=>{z.answers[n]=Number(el.dataset.answer);$$('[data-answer]',node).forEach(a=>a.classList.toggle('selected',Number(a.dataset.answer)===z.answers[n]))}));
  $('#quiz-prev').addEventListener('click',()=>{z.index--;showQuestion()});$('#quiz-next').addEventListener('click',()=>{if(z.answers[n]===null){toast('선택지를 하나 선택해 주세요.',true);return}if(n<z.questions.length-1){z.index++;showQuestion()}else finishQuiz()});
}
async function finishQuiz(){const z=S.quiz;if(!z)return;const score=z.questions.filter((q,i)=>Number(q.correctIndex)===z.answers[i]).length;const target=$('#quiz-content');loading(target);try{await setDoc(doc(db,'classes',S.classId,'weeks',z.id,'quizResults',S.user.uid),{userId:S.user.uid,studentName:S.profile.displayName||S.user.email,email:S.user.email||'',answers:z.answers,score,total:z.questions.length,submittedAt:serverTimestamp()},{merge:true});if(S.weekId!==z.id||S.tab!=='quiz')return;
  const pct=Math.round(score/z.questions.length*100);target.innerHTML=`<div style="text-align:center"><div class="eyebrow">QUIZ COMPLETE ✨</div><h2>복습을 완료했어요!</h2><div class="score-ring" style="--angle:${pct}%"><div class="score-ring-inner"><div><strong>${score} / ${z.questions.length}</strong><br><span>정답 ${pct}%</span></div></div></div><p class="muted">틀린 문제도 아래에서 함께 복습할 수 있어요.</p></div><div class="separator"></div>${z.questions.map((q,i)=>{const good=Number(q.correctIndex)===z.answers[i];return `<div class="review-line"><div class="between"><strong>${i+1}. ${esc(q.stem)}</strong><span class="pill ${good?'green':'red'}">${good?'정답':'오답'}</span></div><p class="hint" style="margin-top:7px">내 답: ${esc(q.options[z.answers[i]])} · 정답: ${esc(q.options[q.correctIndex])}</p>${q.explanation?`<p class="hint" style="margin-top:5px">💡 ${esc(q.explanation)}</p>`:''}</div>`}).join('')}${feedbackMarkup(z.last)}<button id="quiz-retry" class="btn secondary full" style="margin-top:20px">다시 풀기</button>`;useMediaPaths(target);$('#quiz-retry').onclick=()=>renderBody();toast('복습 결과가 저장되었습니다.');
 }catch(e){toast(ex(e),true);showQuestion()}}
async function renderPreview(body){const w=week();body.innerHTML=weekHeader('다음 차시 안내','수업 전에 미리 읽고, 보고, 생각해 보는 시간입니다.');weeklyPicker();const p=w.preview;
  if(!p?.enabled){body.insertAdjacentHTML('beforeend',empty('다음 차시 안내를 준비하고 있습니다'));return}
  const mode=p.mode||'rich';body.insertAdjacentHTML('beforeend',`<div class="card stack"><div class="between"><div><span class="kicker">${esc(w.label)}</span><h2>${esc(p.title||'다음 시간에 만나요')}</h2></div><span class="pill green">PRÓXIMA CLASE</span></div>${mode==='image'?(p.imagePath?`<img class="article-image" alt="다음 차시 안내" data-media-path="${esc(p.imagePath)}">`:empty('안내 이미지가 없습니다')):`<div class="article">${sanitizeRich(p.richHtml||'<p>학습 내용을 곧 안내할 예정입니다.</p>')}</div>`}${(p.videos||[]).length?`<div class="separator"></div><h3>🎬 수업 영상</h3>${p.videos.map(v=>`<div class="stack"><strong style="font-size:13px">${esc(v.name||'수업 영상')}</strong><video controls preload="metadata" class="media-preview" data-media-path="${esc(v.path)}"></video></div>`).join('')}`:''}${(p.files||[]).length?`<div class="separator"></div><h3>📎 첨부 자료</h3><div class="media-list">${p.files.map(f=>`<a href="#" data-media-path="${esc(f.path)}" class="media-item">${esc(f.name||'첨부 파일')} ↗</a>`).join('')}</div>`:''}</div>`);useMediaPaths(body);
}
async function renderMyPage(body){body.innerHTML=bodyHeader('마이페이지','내 학습 정보와 출석 기록을 한곳에서 확인하세요.');
  body.insertAdjacentHTML('beforeend',`<div class="grid2"><div class="card"><h3>👋 프로필</h3><div class="separator"></div><dl class="info-grid"><dt>이름</dt><dd>${esc(S.profile.displayName)}</dd><dt>로그인 ID</dt><dd>${esc(S.user.email)}</dd><dt>현재 반</dt><dd>${esc(currentClass()?.name||'미등록')}</dd><dt>수강 시작</dt><dd>반별 등록 기록 기준</dd></dl><div class="separator"></div><div class="field"><label>수강반 변경</label><select id="student-class-switch">${S.classes.map(c=>`<option value="${esc(c.id)}" ${c.id===S.classId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div><div class="card"><h3>📋 출석 현황</h3><p class="hint" style="margin:6px 0 12px">공개된 주차 기준으로 표시됩니다.</p><div id="attendance-overview" class="loading">불러오는 중</div></div></div><div class="card" style="margin-top:17px"><h3 style="margin-bottom:10px">➕ 다른 반 참여</h3><p class="muted" style="font-size:13px;margin-bottom:16px">다른 수업도 수강하시나요? 강사가 알려준 반 ID와 코드를 입력하세요.</p><form id="join-form" class="grid2"><div class="field"><label>반 ID</label><input name="classId" required></div><div class="field"><label>입장 코드</label><input name="code" required></div><div><button class="btn soft" type="submit">새 수강반 등록</button></div></form></div>`);
  $('#student-class-switch')?.addEventListener('change',async e=>{S.classId=e.target.value;localStorage.setItem('spanish-lms-class',S.classId);S.weekId='';await loadWeeks();renderBody()});wireJoin();
  const statuses=await Promise.all(S.weeks.map(async w=>{try{const d=await getDoc(doc(db,'classes',S.classId,'weeks',w.id,'attendance',S.user.uid));return {label:w.label,status:d.exists()?d.data().status:'unchecked'}}catch(e){return {label:w.label,status:'unchecked'}}}));
  const dict={present:['출석','green'],late:['지각','amber'],absent:['결석','red'],excused:['인정결석','gray'],unchecked:['미체크','gray']};
  const spot=$('#attendance-overview');if(spot)spot.innerHTML=statuses.length?statuses.map(item=>`<div class="between" style="padding:10px 0;border-bottom:1px solid var(--line)"><span style="font-size:13px">${esc(item.label)}</span><span class="pill ${dict[item.status]?.[1]||'gray'}">${dict[item.status]?.[0]||'미체크'}</span></div>`).join(''):empty('아직 출석 기록이 없습니다');
}
if(CONFIGURED){onAuthStateChanged(auth,async user=>{try{if(!user){S.user=null;mountAuth(root);return}S.user=user;root.innerHTML='<div class="loading" style="min-height:90vh">학습 정보를 준비하고 있습니다</div>';S.profile=await ensureProfile(user);if(S.profile.role==='admin'){root.innerHTML=`<div style="max-width:450px;margin:100px auto;padding:24px" class="card"><h2>강사 계정입니다</h2><p style="margin:15px 0">강사 관리 페이지를 이용해 주세요.</p><a class="btn" href="admin.html">강사 페이지로 이동 →</a></div>`;return}await loadStudent()}catch(e){console.error(e);root.innerHTML=`<div class="card" style="max-width:550px;margin:70px auto"><h3>불러오기 실패</h3><p class="error">${esc(ex(e))}</p><button class="btn secondary" id="retry-student">다시 시도</button></div>`;$('#retry-student').onclick=()=>location.reload()}})}else mountAuth(root);

</script>
</body>
</html>
