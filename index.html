<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a91e3c">
<meta name="description" content="스페인어 교육 학습관리 시스템. 과제, 복습 퀴즈, 다음 수업 안내, 출석과 피드백을 한곳에서 관리하세요.">
<title>쎄뇨라유 스페인어 | 수강생 학습공간</title>
<link rel="icon" type="image/png" href="senorayu-icon.png">
<link rel="icon" type="image/svg+xml" href="senorayu-mark.svg">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 글꼴: Pretendard(한글·라틴 본문, OFL) + Fraunces(스페인어 장식 문구·큰 숫자, OFL) -->
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&display=swap">
<!-- 배포할 때 CSS를 바꾸면 ?v= 값을 함께 올려 브라우저 캐시를 갱신하세요 -->
<link rel="stylesheet" href="common.css?v=20261029">
<link rel="stylesheet" href="student.css?v=20261029">
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module">

import { onAuthStateChanged, updateProfile, signOut } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
import { doc, getDoc, getDocs, collection, query, where, addDoc, setDoc, updateDoc, serverTimestamp, onSnapshot, runTransaction } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';
import { CONFIGURED, auth, db, $, $$, esc, fmt, ex, toast, loading, loaded, empty, makeId, enId, uploadMedia, useMediaPaths, sanitizeRich, ensureProfile, mountAuth, isRecording, stopRecordingForNavigation, makeMediaUi, wireMediaUi, showLiveNotice, modalConfirm } from './common.js?v=20261029';


// ===== INDEX PAGE =====
const root=$('#root');
// 로그아웃하면 이 초기값으로 되돌립니다(P0-09).
const studentInitialState=()=>({user:null,profile:null,classes:[],classId:'',weeks:[],weekId:'',tab:'assignment',quiz:null,live:{},activeQuestionId:'',directory:[],enrollmentRealName:'',enrollments:[],hadEnrollment:false,audioDrafts:{},joining:false});
const S=studentInitialState();
const NAV=[['assignment','pencil','과제'],['quiz','review','복습'],['preview','book','다음차시'],['questions','chat','질문'],['classmates','people','우리 반'],['mypage','user','내 정보']];
// 하단 메뉴 아이콘: 강사 화면 사이드바와 같은 선 아이콘(기기마다 모양이 달라지는 이모지 대신)
const NAV_ICONS={
 pencil:'<path d="M4 20h4L19.5 8.5a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/>',
 review:'<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3.5V8h4.5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20.5V16h-4.5"/>',
 book:'<path d="M12 7C8 4 5 4 2 5v14c3-1 6-1 10 2 4-3 7-3 10-2V5c-3-1-6-1-10 2zM12 7v14"/>',
 chat:'<path d="M20 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-3-.4-4.2-1.1L3 20l1.2-4.2A8.5 8.5 0 1 1 20 11.5z"/>',
 people:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 11a3 3 0 0 0 0-6M18 14a5 5 0 0 1 3 5v1"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/>'
};
const navIcon=name=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${NAV_ICONS[name]||''}</svg>`;
const week=()=>S.weeks.find(w=>w.id===S.weekId);
const currentClass=()=>S.classes.find(c=>c.id===S.classId);
function stopLive(key){if(S.live[key]){S.live[key]();delete S.live[key]}}
function clearPageLive(){for(const k of Object.keys(S.live))if(!['enrollments','weeks','classSchedule'].includes(k))stopLive(k)}
function onLiveError(err){console.error('실시간 구독 실패',err);toast('실시간 연결을 확인해 주세요: '+ex(err),true)}
// 실시간 비교에서는 저장 시각만 바뀐 경우를 무시합니다.
const comparableWeeks=list=>JSON.stringify(list.map(({updatedAt,createdAt,...rest})=>rest));
const assignmentDraftKey=(wid=S.weekId)=>`${S.user?.uid}:${S.classId}:${wid}`;
// 저장하지 않은 작업: 녹음 중, 작성 중인 답안, 첨부만 해 둔 음성, 풀고 있는 퀴즈
function studentHasUnsavedWork(){
  if(isRecording())return true;
  const z=S.quiz;
  if(z&&!z.finished&&z.answers.some(a=>Array.isArray(a)?a.length:a!==null))return true;
  const text=$('#assignment-text');
  if(text&&text.value.trim()!==(text.dataset.saved||'').trim())return true;
  return S.tab==='assignment'&&!!S.audioDrafts[assignmentDraftKey()];
}
// P0-10: 작업 중(저장 안 한 작업, 입력칸 사용 중, 퀴즈 결과 확인 중)이면 화면을 다시 그리지 않습니다.
function isStudentBusy(){
  if(studentHasUnsavedWork())return true;
  if(document.activeElement?.matches('textarea,input,select,[contenteditable]'))return true;
  return !!S.quiz?.finished&&S.tab==='quiz';
}
function startWeekLive(){stopLive('weeks');if(!S.classId)return;const cid=S.classId;
  S.live.weeks=onSnapshot(query(collection(db,'classes',cid,'weeks'),where('published','==',true)),snap=>{
    if(S.classId!==cid)return;
    const incoming=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order??0)-(b.order??0));
    if(comparableWeeks(S.weeks)===comparableWeeks(incoming))return;
    const viewingGone=!!S.weekId&&!incoming.some(w=>w.id===S.weekId);
    S.weeks=incoming;
    if(isStudentBusy()){
      showLiveNotice($('#student-body'),viewingGone?'지금 보고 있는 차시가 비공개로 바뀌었어요.':'선생님이 학습 자료를 업데이트했어요.','지금 반영',applyWeekUpdate);
      return;
    }
    applyWeekUpdate();
  },handleClassAccessError);
}
async function applyWeekUpdate(){
  if(studentHasUnsavedWork()&&!(await modalConfirm('풀던 문제나 작성 중인 내용이 사라질 수 있어요. 지금 반영할까요?'))){
    showLiveNotice($('#student-body'),'선생님이 학습 자료를 업데이트했어요.','지금 반영',applyWeekUpdate);
    return;
  }
  if(!S.weeks.some(w=>w.id===S.weekId))S.weekId=S.weeks.at(-1)?.id||'';
  S.quiz=null;
  if($('#student-body'))renderBody();
}
// P0-08: 반이 보관되었거나 수강이 중지되어 반 자료를 더 읽을 수 없게 되면 수강 정보를 다시 확인합니다.
let reloadingStudent=null;
function reloadStudentClass(){
  if(!reloadingStudent)reloadingStudent=loadStudent().catch(e=>{console.error(e);toast(ex(e),true)}).finally(()=>{reloadingStudent=null});
  return reloadingStudent;
}
function handleClassAccessError(err){
  if(err?.code==='permission-denied'&&S.user){console.warn('반 접근 권한이 바뀌었습니다.',err);reloadStudentClass();return}
  onLiveError(err);
}
function startClassScheduleLive(){stopLive('classSchedule');if(!S.classId)return;const cid=S.classId;
  S.live.classSchedule=onSnapshot(doc(db,'classes',cid),snap=>{
    if(!snap.exists()||S.classId!==cid)return;
    if(snap.data().archived){reloadStudentClass();return}
    const prev=JSON.stringify(currentClass()?.schedule||[]);
    S.classes=[{id:cid,...snap.data()}];
    if(prev!==JSON.stringify(snap.data().schedule||[])&&S.tab==='mypage'&&$('#student-body')){
      if(!document.activeElement?.matches('input,textarea'))renderMyPage($('#student-body'));
      else toast('수업 일정이 바뀌었어요. 내 정보를 다시 열면 반영됩니다.');
    }
  },handleClassAccessError);
}
// D4: 한 학생은 동시에 한 반만 수강합니다. 가장 최근에 등록한 반 중 '열 수 있는'(보관되지 않은) 반을 고릅니다(P0-08).
const byJoinedDesc=(a,b)=>(b.joinedAt?.seconds||0)-(a.joinedAt?.seconds||0);
async function readOpenClass(cid){
  try{const c=await getDoc(doc(db,'classes',cid));return c.exists()&&!c.data().archived?{id:c.id,...c.data()}:null}
  catch(e){if(e?.code==='permission-denied')return null;throw e}
}
async function pickActiveClass(enrollments){
  for(const e of enrollments.filter(x=>x.status==='active').sort(byJoinedDesc)){
    const cls=await readOpenClass(e.classId);
    if(cls)return {enrollment:e,cls};
  }
  return null;
}
function startEnrollmentLive(){stopLive('enrollments');
  S.live.enrollments=onSnapshot(query(collection(db,'enrollments'),where('uid','==',S.user.uid)),async snap=>{
    const list=snap.docs.map(d=>({id:d.id,...d.data()}));
    S.enrollments=list;S.hadEnrollment=list.length>0;
    if(S.joining)return; // 학생이 방금 직접 입장한 경우는 loadStudent가 처리합니다.
    const picked=await pickActiveClass(list);
    const next=picked?.cls.id||'';
    if(next===S.classId)return;
    stopLive('weeks');stopLive('classSchedule');clearPageLive();
    S.classId=next;S.classes=picked?[picked.cls]:[];S.weeks=[];S.weekId='';S.quiz=null;
    S.enrollmentRealName=String(picked?.enrollment.studentName||'').trim();
    if(next){try{await loadWeeks();startWeekLive();startClassScheduleLive()}catch(e){onLiveError(e)}}
    frame();toast(next?'선생님이 지정한 반 정보가 반영되었어요.':'수강 상태가 바뀌었어요.');
  },onLiveError);
}

const wselect=()=>`<select id="student-week-picker" class="input week-chooser">${S.weeks.map(w=>`<option value="${esc(w.id)}" ${w.id===S.weekId?'selected':''}>${esc(w.label)}</option>`).join('')}</select>`;
function enterStudentHistory(){if(history.state?.senorayuStudent)return;history.replaceState({senorayuStudent:true,tab:'assignment'},'');history.pushState({senorayuStudent:true,tab:S.tab},'','#'+S.tab)}
window.addEventListener('popstate',e=>{if(!S.user||!document.querySelector('.student-app'))return;S.tab=e.state?.senorayuStudent?e.state.tab:'assignment';S.quiz=null;renderBody()});
function frame(){
  enterStudentHistory();
  root.innerHTML=`<div class="student-app"><header class="student-header"><div class="brand"><div class="logo"><img src="senorayu-mark.svg" alt="쎄뇨라유 스페인어 로고"></div><div><strong>쎄뇨라유 스페인어</strong><small>MI ESPACIO DE ESPAÑOL</small></div></div><div class="row"><span class="pill user-pill">${esc(((S.profile?.displayName==='수강생'&&S.user?.displayName)?S.user.displayName:S.profile?.displayName)||S.user?.displayName||'수강생')} 님</span><button id="student-logout" class="btn ghost small">로그아웃</button></div></header><main id="student-body"></main></div><nav class="student-nav" aria-label="하단 메뉴"><div class="student-nav-inner">${NAV.map(([key,icon,label])=>`<button type="button" class="nav-item ${S.tab===key?'active':''}" data-tab="${key}" aria-label="${label}"><span class="nav-icon">${navIcon(icon)}</span><span>${label}</span></button>`).join('')}</div></nav>`;
  $('#student-logout').addEventListener('click',()=>{resetStudentSession();signOut(auth)}); // P0-09: 구독을 먼저 끊고 로그아웃
  $$('[data-tab]').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;history.pushState({senorayuStudent:true,tab:S.tab},'','#'+S.tab);S.quiz=null;renderBody()}));
  renderBody();
}
function bodyHeader(title,description){return `<div class="page-head"><div class="eyebrow">LEARNING JOURNEY</div><h1>${title}</h1><p>${description}</p></div>`}
function weekHeader(title,description){return `<div class="section-title"><div>${bodyHeader(title,description)}</div>${S.weeks.length?wselect():''}</div>`}
function weeklyPicker(){ $('#student-week-picker')?.addEventListener('change',e=>{S.weekId=e.target.value;S.quiz=null;renderBody()}) }
function renderBody(){
  stopRecordingForNavigation(); // P0-02: 화면을 옮기면 녹음을 멈춥니다.
  clearPageLive();$$('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.tab===S.tab));const body=$('#student-body');if(!body)return;
  if(!S.classes.length){renderJoin(body);return}
  if(S.weeks.length&&!S.weeks.some(w=>w.id===S.weekId))S.weekId=S.weeks.at(-1).id;
  if(S.tab==='mypage'){renderMyPage(body);return}
  if(S.tab==='questions'){renderQuestions(body);return}
  if(S.tab==='classmates'){renderClassmates(body);return}
  if(!S.weeks.length){body.innerHTML=bodyHeader('첫 수업을 준비하고 있어요','선생님이 학습 자료를 공개하면 이곳에서 확인할 수 있어요.')+empty('아직 공개된 차시가 없습니다','선생님이 학습 자료를 게시한 뒤 다시 확인해 주세요.');return}
  if(S.tab==='assignment')renderAssignment(body);
  if(S.tab==='quiz')renderQuiz(body);
  if(S.tab==='preview')renderPreview(body);
}
function renderJoin(body){
  const returning=S.hadEnrollment;
  body.innerHTML=`${bodyHeader(returning?'새 반에 입장해 볼까요?':'우리 반에 입장해 볼까요?',returning?'이전 반 수강이 끝났거나 수강이 중지되었어요.':'선생님이 알려 준 수강 코드 하나로 입장할 수 있어요.')}<div class="card join-card">${returning?'<p class="notice">새로 개설된 반의 수강 코드를 입력해 주세요. 이전 반으로 돌아가거나 반을 바꾸려면 선생님께 문의해 주세요.</p>':''}<form class="stack" id="join-form"><div class="field"><label for="join-code">수강 코드</label><input id="join-code" name="code" required maxlength="30" placeholder="예: HOLA2026" autocomplete="off" autocapitalize="characters"></div><button type="submit" class="btn">반에 참여하기 →</button></form></div>`;
  wireJoin();
}
function wireJoin(){const form=$('#join-form');form?.addEventListener('submit',async e=>{
  e.preventDefault();const code=String(new FormData(form).get('code')||'').trim().toUpperCase().replace(/\s+/g,'');
  if(!code){toast('수강 코드를 입력해 주세요.',true);return}
  const btn=$('button[type="submit"]',form);if(btn)btn.disabled=true;
  try{
    const mapping=await getDoc(doc(db,'joinCodes',code));
    if(!mapping.exists()||!mapping.data().classId)throw Error('등록된 수강 코드가 없습니다. 코드를 확인해 주세요.');
    const cid=mapping.data().classId;
    // 같은 반에 이전 등록 기록이 있으면 학생이 스스로 되살릴 수 없습니다. 강사가 다시 등록합니다(P0-08).
    const previous=S.enrollments.find(x=>x.classId===cid);
    if(previous)throw Error(previous.status==='active'?'이미 등록된 반입니다. 화면을 새로고침해 주세요.':'이 반은 이전에 등록한 기록이 있어요. 선생님께 다시 등록을 요청해 주세요.');
    const entry={uid:S.user.uid,classId:cid,studentName:((S.profile.displayName==='수강생'&&S.user.displayName)?S.user.displayName:S.profile.displayName)||S.user.email,email:S.user.email||'',joinCode:code,status:'active',joinedAt:serverTimestamp()};
    S.joining=true;
    try{await setDoc(doc(db,'enrollments',enId(S.user.uid,cid)),entry)}
    catch(err){if(err?.code==='permission-denied')throw Error('지금은 이 반에 입장할 수 없어요. 이전 반 수강이 아직 진행 중이라면 선생님께 문의해 주세요.');throw err}
    try{await setDoc(doc(db,'classes',cid,'members',S.user.uid),{uid:S.user.uid,name:entry.studentName,status:'active',joinedAt:serverTimestamp()},{merge:true})}catch(err){console.warn('반 명단 업데이트 실패',err)}
    try{await updateDoc(doc(db,'users',S.user.uid),{assignedClassId:cid});S.profile.assignedClassId=cid}catch(err){console.warn('소속반 정보 저장 실패',err)}
    toast('수강반에 참여했어요!');await loadStudent();
  }catch(err){toast(err?.code?'수강 코드로 입장할 수 없습니다. '+ex(err):ex(err),true)}
  finally{S.joining=false;if(btn?.isConnected)btn.disabled=false}
})}
async function loadStudent(){
  const snaps=await getDocs(query(collection(db,'enrollments'),where('uid','==',S.user.uid)));
  S.enrollments=snaps.docs.map(d=>({id:d.id,...d.data()}));
  S.hadEnrollment=S.enrollments.length>0;
  stopLive('weeks');stopLive('classSchedule');clearPageLive();
  S.classes=[];S.classId='';S.weeks=[];S.weekId='';S.quiz=null;
  const picked=await pickActiveClass(S.enrollments);
  S.enrollmentRealName=String(picked?.enrollment.studentName||'').trim();
  if(picked){
    S.classId=picked.cls.id;S.classes=[picked.cls];
    if(!S.profile?.assignedClassId){try{await updateDoc(doc(db,'users',S.user.uid),{assignedClassId:S.classId});S.profile.assignedClassId=S.classId}catch(e){console.warn('기존 수강생 소속반 갱신 실패',e)}}
    await loadWeeks();
  }
  frame();startWeekLive();startEnrollmentLive();startClassScheduleLive();
}
// 로그아웃 때 모든 실시간 연결·녹음·초안·화면 상태를 정리합니다(P0-09).
function resetStudentSession(){
  stopRecordingForNavigation();
  for(const k of Object.keys(S.live))stopLive(k);
  Object.assign(S,studentInitialState());
}
window.addEventListener('beforeunload',e=>{if(S.user&&studentHasUnsavedWork()){e.preventDefault();e.returnValue=''}});
async function loadWeeks(){const snap=await getDocs(query(collection(db,'classes',S.classId,'weeks'),where('published','==',true)));
  S.weeks=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order??0)-(b.order??0));
  if(!S.weeks.some(w=>w.id===S.weekId))S.weekId=S.weeks.at(-1)?.id||'';
}
function feedbackMarkup(obj){
  const comments=[...(obj?.feedbacks||[])];
  if(obj?.feedback?.text||obj?.feedback?.audioPath)comments.unshift({text:obj.feedback.text,audioPath:obj.feedback.audioPath,createdAt:obj.feedback.updatedAt});
  if(!comments.length)return '';
  return `<div class="student-feedback"><h3 style="margin-bottom:12px">💬 선생님의 피드백 (${comments.length})</h3><div class="stack">${comments.map(f=>`<div class="feedback"><strong>선생님 · ${esc(typeof f.createdAt==='string'?f.createdAt.slice(0,16).replace('T',' '):fmt(f.createdAt))}</strong>${f.text?`<div style="white-space:pre-wrap">${esc(f.text)}</div>`:''}${f.audioPath?`<div style="margin-top:10px"><audio controls preload="none" data-media-path="${esc(f.audioPath)}"></audio></div>`:''}</div>`).join('')}</div></div>`;
}
async function renderAssignment(body){const w=week();body.innerHTML=weekHeader('과제','말하기와 쓰기를 차근차근 연습해 보세요.');weeklyPicker();
  if(!w.assignment?.enabled){body.insertAdjacentHTML('beforeend',empty('이 주차의 과제는 아직 열리지 않았습니다','강사가 과제를 공개하면 여기서 제출할 수 있습니다.'));return}
  body.insertAdjacentHTML('beforeend',`<div class="card stack"><div class="between"><div><h2>${esc(w.assignment.title||'스페인어 과제')}</h2></div><span class="pill amber">TAREA</span></div><div class="subtle article" style="white-space:pre-wrap">${esc(w.assignment.instructions||'과제 내용을 확인해 주세요.')}</div>${w.assignment.dueAt?`<p class="hint">⏰ 제출 권장일: ${esc(w.assignment.dueAt.replace('T',' '))}</p>`:''}<div id="assignment-form-area" class="stack"><div class="loading">제출 기록 확인 중</div></div></div>`);

// 이전 4지선다 문제도 자동으로 단일 정답형으로 처리합니다.
function normalizeQuestion(q={}){
  const type=['single','multiple','ox'].includes(q.type)?q.type:'single';
  const options=type==='ox'?['O','X']:(q.options||[]);
  let correctIndices=Array.isArray(q.correctIndices)?q.correctIndices.map(Number):[Number(q.correctIndex??0)];
  correctIndices=[...new Set(correctIndices.filter(i=>i>=0&&i<options.length))];
  return {...q,type,options,correctIndices};
}
function isCorrect(q,answer){
  const a=Array.isArray(answer)?answer:answer===null||answer===undefined?[]:[answer];
  return a.length===q.correctIndices.length&&a.every(i=>q.correctIndices.includes(Number(i)));
}
function answerLabel(q,answer){
  const a=Array.isArray(answer)?answer:answer===null||answer===undefined?[]:[answer];
  return a.length?a.map(i=>q.options[Number(i)]||'?').join(', '):'미응답';
}
function shuffleQuestion(q){
  const opt=q.options.map((text,index)=>({text,index}));
  if(q.type==='ox')return opt;
  for(let i=opt.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opt[i],opt[j]]=[opt[j],opt[i]]}
  return opt;
}

function showQuestion(){const z=S.quiz;if(!z)return;const node=$('#quiz-content');if(!node)return;

async function finishQuiz(){const z=S.quiz;if(!z)return;

      const oldSnap=await tx.get(resultRef),old=oldSnap.exists()?oldSnap.data():null;

      tx.set(resultRef,{userId:S.user.uid,studentName:name,email:S.user.email||'',answers:z.answers,score,total:z.questions.length,submittedAt:serverTimestamp(),firstAttempt:first,attemptCount:count},{merge:true});

    useMediaPaths(target);$('#quiz-retry').onclick=()=>renderBody();toast('복습 결과가 저장되었습니다.');
  }catch(e){target.classList.remove('loading');toast(ex(e),true);showQuestion()}
}

function renderQuestions(body){
  body.innerHTML=bodyHeader('질문하기','궁금한 점을 선생님께 남겨보세요. 답변은 실시간으로 표시됩니다.')+`<div class="grid2" style="align-items:start"><div class="card stack"><h3>새 질문</h3><form id="question-create" class="stack"><div class="field"><label>제목</label><input name="title" required maxlength="100" placeholder="예: 오늘 배운 표현이 궁금해요"></div><div class="field"><label>질문 내용</label><textarea name="content" required maxlength="8000" rows="6" placeholder="질문을 자세히 작성해 주세요."></textarea></div><button class="btn" type="submit">질문 보내기</button></form></div><div class="stack"><div class="between"><h3>내 질문</h3><span class="pill green" id="question-count">0건</span></div><div id="question-list" class="question-list"><div class="loading">질문 확인 중</div></div></div></div><div id="student-thread" style="margin-top:17px"></div>`;
  $('#question-create').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,fd=new FormData(form);const title=String(fd.get('title')||'').trim(),content=String(fd.get('content')||'').trim();if(!title||!content)return;const btn=$('button[type="submit"]',form);btn.disabled=true;try{await addDoc(collection(db,'classes',S.classId,'questions'),{uid:S.user.uid,studentName:S.profile.displayName||'수강생',title,content,createdAt:serverTimestamp(),status:'open'});form.reset();toast('질문이 전송되었습니다.')}catch(err){toast(ex(err),true)}finally{btn.disabled=false}};
  S.live.questions=onSnapshot(query(collection(db,'classes',S.classId,'questions'),where('uid','==',S.user.uid)),snap=>{
    if(S.tab!=='questions')return;const list=$('#question-list');if(!list)return;
    const docs=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    $('#question-count').textContent=docs.length+'건';list.classList.remove('loading');
    list.innerHTML=docs.map(q=>`<button class="question-thread ${S.activeQuestionId===q.id?'thread-open':''}" type="button" data-qid="${esc(q.id)}" style="text-align:left"><div class="between"><strong>${esc(q.title)}</strong><span class="pill ${q.status==='answered'?'green':'gray'}">${q.status==='answered'?'답변 완료':'답변 대기'}</span></div><p class="hint" style="margin-top:5px">${fmt(q.createdAt)}</p><p class="muted" style="font-size:13px;margin-top:7px">${esc(q.content.slice(0,110))}</p></button>`).join('')||empty('아직 질문이 없습니다','첫 질문을 남겨 보세요.');
    $$('[data-qid]',list).forEach(el=>el.onclick=()=>{S.activeQuestionId=el.dataset.qid;$$('[data-qid]',list).forEach(b=>b.classList.toggle('thread-open',b===el));showStudentThread(docs.find(q=>q.id===S.activeQuestionId))});
    if(S.activeQuestionId&&!docs.some(q=>q.id===S.activeQuestionId)){S.activeQuestionId='';stopLive('replies');$('#student-thread').innerHTML=''}
    else if(S.activeQuestionId && !S.live.replies)showStudentThread(docs.find(q=>q.id===S.activeQuestionId));
  },onLiveError);
}
function showStudentThread(q){if(!q)return;stopLive('replies');const holder=$('#student-thread');if(!holder)return;
  holder.innerHTML=`<div class="card stack"><div class="between"><div><h3>${esc(q.title)}</h3><p class="hint">${fmt(q.createdAt)}</p></div><button class="btn ghost small" type="button" id="close-thread">닫기 ×</button></div><div class="subtle" style="white-space:pre-wrap">${esc(q.content)}</div><h3>대화</h3><div id="student-replies" class="stack"><div class="loading">답변 확인 중</div></div><form id="student-reply-form" class="stack"><div class="field"><label>추가 질문 또는 답장</label><textarea name="text" rows="3" required maxlength="8000" placeholder="선생님께 전할 말을 작성해 주세요."></textarea></div><button class="btn" type="submit">답장 보내기</button></form></div>`;
  $('#close-thread').onclick=()=>{S.activeQuestionId='';stopLive('replies');holder.innerHTML='';$$('[data-qid]').forEach(b=>b.classList.remove('thread-open'))};
  $('#student-reply-form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,text=String(new FormData(form).get('text')||'').trim();if(!text)return;const btn=$('button[type="submit"]',form);btn.disabled=true;try{await addDoc(collection(db,...questionPath(q.id),'replies'),{uid:S.user.uid,role:'student',author:S.profile.displayName||'수강생',text,createdAt:serverTimestamp()});form.reset()}catch(err){toast(ex(err),true)}finally{btn.disabled=false}};
  S.live.replies=onSnapshot(collection(db,...questionPath(q.id),'replies'),snap=>{if(S.activeQuestionId!==q.id)return;const list=$('#student-replies');if(!list)return;const replies=snap.docs.map(d=>d.data()).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));loaded(list,replies.map(r=>`<div class="reply-bubble ${r.role==='admin'?'teacher':'student'}"><p class="hint">${r.role==='admin'?'선생님':'나'} · ${fmt(r.createdAt)}</p><p style="white-space:pre-wrap">${esc(r.text)}</p></div>`).join('')||'<p class="hint">아직 댓글이 없습니다.</p>')},onLiveError);
}
function renderClassmates(body){body.innerHTML=bodyHeader('우리 반','함께 스페인어를 공부하는 친구들이에요.')+`<div class="card"><div class="between" style="margin-bottom:18px"><h3>${esc(currentClass()?.name||'수강반')}</h3><span class="pill green" id="classmate-count">—</span></div><div id="classmates-list" class="grid3"><div class="loading">수강생 확인 중</div></div><p class="hint" style="margin-top:17px">개인정보 보호를 위해 이름만 공개되며, 이메일이나 개별 학습 성적은 보이지 않습니다.</p></div>`;
  S.live.classmates=onSnapshot(collection(db,'classes',S.classId,'members'),snap=>{
    if(S.tab!=='classmates')return;const list=$('#classmates-list');if(!list)return;const members=snap.docs.map(d=>d.data()).filter(m=>m.status==='active').sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));$('#classmate-count').textContent=members.length+'명';loaded(list,members.map(m=>`<div class="classmate-card"><span class="classmate-avatar">${esc((m.name||'?')[0])}</span><div><strong>${esc(m.name||'이름 미등록')}</strong>${m.uid===S.user.uid?'<p class="hint">나</p>':''}</div></div>`).join('')||empty('아직 반 명단이 없습니다','강사가 수강생 관리를 열면 기존 명단도 동기화됩니다.'));
  },onLiveError);
}

if(CONFIGURED){onAuthStateChanged(auth,async user=>{try{if(!user){resetStudentSession();mountAuth(root);return}S.user=user;root.innerHTML='<div class="loading" style="min-height:90vh">학습 정보를 준비하고 있습니다</div>';S.profile=await ensureProfile(user);if(S.profile.role==='admin'){root.innerHTML=`<div style="max-width:450px;margin:100px auto;padding:24px" class="card"><h2>강사 계정입니다</h2><p style="margin:15px 0">강사 관리 페이지를 이용해 주세요.</p><a class="btn" href="admin.html">강사 페이지로 이동 →</a></div>`;return}await loadStudent()}catch(e){console.error(e);root.innerHTML=`<div class="card" style="max-width:550px;margin:70px auto"><h3>불러오기 실패</h3><p class="error">${esc(ex(e))}</p><button class="btn secondary" id="retry-student">다시 시도</button></div>`;$('#retry-student').onclick=()=>location.reload()}})}else mountAuth(root);


</script>
</body>
</html>
