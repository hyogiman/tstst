/* 쎄뇨라유 스페인어 — studio redesign v2: warm editorial design system */
:root{
 --bg:#f5f6f7;--surface:#ffffff;--ink:#20303d;--muted:#71808b;
 --line:#e5eaf0;--primary:#c9604d;--primary-deep:#a94637;
 --primary-light:#fff0e9;--accent:#efba67;--danger:#b84f50;
 --shadow:0 10px 32px rgba(28,44,58,.035);--radius:18px;
 --navy:#1a2e3a;--navy2:#253c49;--peach:#fff3e7;
}
html{scroll-behavior:smooth}body{background:var(--bg);font-family:'Manrope','Noto Sans KR',system-ui,sans-serif;letter-spacing:-.22px;line-height:1.55}
h1,h2,h3,h4{font-weight:800;color:var(--ink);letter-spacing:-1px}
h1{font-size:clamp(29px,2.7vw,39px);line-height:1.28}h2{font-size:24px}h3{font-size:18px}
small{font-size:12px}button,input,select,textarea{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #eeb17d;outline-offset:2px}
.eyebrow{color:var(--primary);font-size:10px;letter-spacing:2.4px;font-weight:800;margin-bottom:9px}
.muted,.hint{color:var(--muted)}.hint{line-height:1.65}
.card{border:1px solid var(--line);border-radius:19px;padding:25px;box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.btn{border-radius:11px;min-height:44px;padding:11px 17px;font-weight:800;font-size:13px;box-shadow:none;transition:background .18s,border-color .18s,transform .18s}
.btn:hover{box-shadow:0 7px 15px rgba(130,59,41,.095)}
.btn.secondary{border-color:#dfe5e9;background:white;color:#344652}
.btn.secondary:hover{background:#f7f9fa}
.btn.soft{background:#fff2eb;color:#ac5140;border-color:#f7e3d8}
.btn.soft:hover{background:#ffe8dc}
.btn.danger{background:#fff1f0;border-color:#f5d4d1;color:#b44444}
.btn.small{min-height:37px;font-size:12px;padding:8px 13px}
.btn.ghost{color:var(--muted)}
.logo{background:var(--primary);border-radius:14px;width:45px;height:45px;box-shadow:none;color:white;font-family:Georgia,serif;font-size:30px}
.brand strong{font-size:18px;letter-spacing:-.8px}.brand small{letter-spacing:1.15px;color:var(--muted)}
.pill{font-size:11px;border-radius:7px;padding:5px 10px;line-height:1.5;background:#f3f5f7;color:#60717d}
.pill.green{background:#eaf7f0;color:#207853}.pill.amber{background:#fff3e3;color:#a26d27}.pill.red{background:#fff0ed;color:#b35043}.pill.gray{background:#f2f4f6;color:#76848e}
.field>label,.field-label{font-weight:800;font-size:12px;color:#465662}
.field input,.field select,.field textarea,.input{border:1px solid #dce4ea;border-radius:11px;min-height:45px;padding:11px 13px;font-size:14px;color:var(--ink)}
.field textarea{line-height:1.75}.field input:focus,.field select:focus,.field textarea:focus,.input:focus{border-color:#cd7563;box-shadow:0 0 0 3px #fae8e1;outline:0}
.card .subtle,.subtle{background:#f8f9fa;border:1px solid #ecf0f2;border-radius:13px;padding:17px}
.notice{background:#eff8f3;color:#267a5d;border-radius:10px;font-size:13px;padding:13px 15px}
.notice.warn{background:#fff5e8;color:#93652b}
.section-title{margin-bottom:22px;align-items:center;gap:22px}.section-title p,.page-head p{font-size:13px;margin-top:8px;color:var(--muted)}
.tabset{background:#edf0f3;border-radius:12px;padding:4px;gap:4px}.tab{border-radius:9px;font-size:13px;font-weight:750;min-height:40px}
.tab.active{background:white;color:var(--primary);box-shadow:0 2px 7px #192b3210}
.empty{background:#fbfcfd;border:1px dashed #dce4e9;padding:54px 20px}.empty strong{color:var(--ink)}
.loading{min-height:86px;justify-content:flex-start;padding:17px 0;gap:12px;font-size:13px}
.loading:before{border:2px solid #f0ddd8;border-top-color:var(--primary);width:16px;height:16px}
.mini-stat{background:#fff;border:1px solid var(--line);padding:25px;border-radius:18px;min-height:134px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.mini-stat strong{font-size:37px;letter-spacing:-1.8px;color:var(--navy);line-height:1.1}.mini-stat span{font-size:13px}
/* Admin workspace */
.admin-shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh;background:var(--bg)}
.sidebar{height:100dvh;top:0;position:sticky;background:var(--navy);border:0;padding:31px 16px 20px;gap:43px;overflow-y:auto}
.sidebar .brand{padding:0 12px}.sidebar .brand .logo{background:#e89b70;color:#222e37}
.sidebar .brand strong{color:#fff;font-size:19px}.sidebar .brand small{color:#8eabb9;font-size:9px}
.side-nav{display:flex;flex-direction:column;gap:5px}

const sizeLimit={audio:15*1024*1024,image:8*1024*1024,video:2*1024*1024*1024,file:20*1024*1024};
async function uploadMedia(file,path,kind,progressEl){
  if(!file)throw Error('파일을 선택해 주세요.');
  if(!isMedia(file,kind))throw Error('선택한 파일 형식을 확인해 주세요.');
  if(file.size>sizeLimit[kind])throw Error(`파일 크기 제한을 초과했습니다. (${Math.round(sizeLimit[kind]/1024/1024)}MB)`);
  const r=storageRef(storage,path);
  return new Promise((resolve,reject)=>{
    const task=uploadBytesResumable(r,file,{contentType:file.type||'application/octet-stream'});
    task.on('state_changed',snap=>{if(progressEl)progressEl.textContent=`업로드 ${Math.round(snap.bytesTransferred/snap.totalBytes*100)}%`},reject,()=>{if(progressEl)progressEl.textContent='업로드 완료';resolve(path)});
  });
}
async function urlFor(path){try{return path?await getDownloadURL(storageRef(storage,path)):null}catch(e){console.warn('파일을 열 수 없습니다.',e);return null}}
function useMediaPaths(container){
  if(!container)return;
  $$('[data-media-path]',container).forEach(async el=>{
    const path=el.dataset.mediaPath;
    if(!path)return;
    try{
      // <audio src="Firebase 다운로드 URL">로 바로 재생: getBlob()·CORS 수동 설정 불필요.
      // 다운로드 URL을 가진 사람은 링크를 공유할 수 있으므로 유료/고보안 음성 보호에는 적합하지 않습니다.
      const url=await urlFor(path);
      if(!el.isConnected || !el.closest('body'))return;
      if(!url)throw Error('파일 주소가 없습니다.');
      if(el.tagName==='A'){
        el.href=url;el.target='_blank';el.rel='noopener noreferrer';
      }else{
        el.src=url;
        if(el.tagName==='AUDIO')el.preload='none';
        if(el.tagName==='VIDEO'){el.addEventListener('contextmenu',ev=>ev.preventDefault());el.setAttribute('controlsList','nodownload noremoteplayback');}
      }
    }catch(e){
      console.warn('미디어 주소 확인 실패',path,e);
      if(el.isConnected){
        const message=document.createElement('span');
        message.className='error';message.textContent='파일을 불러오지 못했습니다. 저장 경로 또는 파일 권한을 확인해 주세요.';
        el.replaceWith(message);
      }
    }
  });
}
function sanitizeRich(html){
  const parsed=new DOMParser().parseFromString(`<div>${html||''}</div>`,'text/html');
  const allowed=new Set(['P','DIV','BR','STRONG','B','EM','I','U','S','UL','OL','LI','H1','H2','H3','H4','BLOCKQUOTE','SPAN','FONT','A']);
  const styleKeys=new Set(['color','background-color','font-size','font-family','font-weight','text-align','font-style','text-decoration']);
  function safeNode(node){
    if(node.nodeType===Node.TEXT_NODE)return document.createTextNode(node.textContent);
    if(node.nodeType!==Node.ELEMENT_NODE)return document.createDocumentFragment();
    const tag=node.tagName; const el=allowed.has(tag)?document.createElement(tag.toLowerCase()):document.createDocumentFragment();
    if(el.nodeType===Node.ELEMENT_NODE){
      if(tag==='A'){const href=node.getAttribute('href')||'';if(/^https?:\/\//i.test(href)){el.setAttribute('href',href);el.setAttribute('target','_blank');el.setAttribute('rel','noopener noreferrer')}}
      if(tag==='FONT'){
        const sz=node.getAttribute('size');if(sz&&/^[1-7]$/.test(sz))el.setAttribute('size',sz);
        const color=node.getAttribute('color');if(color&&/^(#[0-9a-f]{3,8}|[a-z]{3,16}|rgb\([\d\s,%.]+\))$/i.test(color))el.setAttribute('color',color);
        const face=node.getAttribute('face');if(face&&/^[\w가-힣 ,'-]{1,65}$/.test(face))el.setAttribute('face',face);
      }
      const style=node.getAttribute('style');if(style){
        style.split(';').forEach(item=>{const [k,...v]=item.split(':');const key=k?.trim().toLowerCase(), val=v.join(':').trim();if(styleKeys.has(key)&&/^[\w\s#(),.%'-]{1,75}$/.test(val)&&!/(url|expression|behavior|javascript)/i.test(val))el.style.setProperty(key,val)})
      }
    }
    Array.from(node.childNodes).forEach(child=>el.appendChild(safeNode(child)));return el;
  }
  const wrapper=document.createElement('div');Array.from(parsed.body.firstElementChild?.childNodes||[]).forEach(n=>wrapper.appendChild(safeNode(n)));return wrapper.innerHTML;
}
async function ensureProfile(user){
  const r=doc(db,'users',user.uid),snap=await getDoc(r);

    const profile=snap.data();

    const authName=(user.displayName||'').trim();
    if(profile.role==='student' && (!profile.displayName || profile.displayName==='수강생') && authName && authName!=='수강생'){
      await updateDoc(r,{displayName:authName,updatedAt:serverTimestamp()});
      return {...profile,displayName:authName};
    }
    return profile;
  }
  const data={displayName:(user.displayName||'').trim()||'수강생',email:user.email||'',role:'student',createdAt:serverTimestamp()};
  await setDoc(r,data);
  return data;
}

function mountAuth(root,opts={signup:true}){

  let mode='login';alt?.addEventListener('click',()=>{mode=mode==='login'?'signup':'login';const form=$('#login-form');form.innerHTML=mode==='login'?`<div class="field"><label>이메일</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>비밀번호</label><input name="password" type="password" required autocomplete="current-password"></div><button class="btn full" type="submit">로그인 →</button>`:`<div class="field"><label>이름</label><input name="name" type="text" required maxlength="35" autocomplete="name" placeholder="실명 또는 강사에게 알린 이름"></div><div class="field"><label>이메일</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>비밀번호 (6자 이상)</label><input name="password" type="password" required minlength="6" autocomplete="new-password"></div><button class="btn full" type="submit">수강생 계정 만들기</button>`;alt.textContent=mode==='login'?'회원가입':'로그인으로 돌아가기';$('#login-message').textContent='';});
  $('#login-form').addEventListener('submit',async e=>{e.preventDefault();if(!CONFIGURED){toast('Firebase 설정을 먼저 입력해 주세요.',true);return} const form=e.currentTarget;const data=new FormData(form);const btn=$('button[type="submit"]',form);btn.disabled=true;try{if(mode==='login')await signInWithEmailAndPassword(auth,String(data.get('email')).trim(),String(data.get('password')));else{const cred=await createUserWithEmailAndPassword(auth,String(data.get('email')).trim(),String(data.get('password')));await updateProfile(cred.user,{displayName:String(data.get('name')).trim()});await ensureProfile(cred.user);await updateDoc(doc(db,'users',cred.user.uid),{displayName:String(data.get('name')).trim(),updatedAt:serverTimestamp()});} }catch(err){$('#login-message').textContent=ex(err)}finally{btn.disabled=false}});
  $('#forgot-password').addEventListener('click',async()=>{if(!CONFIGURED){toast('Firebase 설정이 필요합니다.',true);return}const email=$('input[name="email"]')?.value?.trim();if(!email){toast('먼저 이메일을 입력해 주세요.',true);return}try{await sendPasswordResetEmail(auth,email);toast('비밀번호 재설정 메일을 발송했습니다.')}catch(e){toast(ex(e),true)}});

// 한 번에 하나의 마이크 녹음만 활성화됩니다. 파일 선택 업로드를 대안으로 함께 제공합니다.
let activeRecorder=null;
async function recordStart(onFile,onStatus){
  if(activeRecorder)throw Error('현재 녹음 중인 항목을 먼저 종료해 주세요.');
  if(!navigator.mediaDevices?.getUserMedia||!globalThis.MediaRecorder)throw Error('이 브라우저에서 음성 녹음을 지원하지 않습니다. 음성 파일을 선택해 주세요.');
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const options=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg'].find(t=>MediaRecorder.isTypeSupported(t));
  let recorder;try{recorder=options?new MediaRecorder(stream,{mimeType:options}):new MediaRecorder(stream)}catch(err){stream.getTracks().forEach(t=>t.stop());throw err}
  const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());activeRecorder=null;const mime=recorder.mimeType||'audio/webm';const ext=mime.includes('mp4')?'m4a':mime.includes('ogg')?'ogg':'webm';const file=new File(chunks,`recording-${Date.now()}.${ext}`,{type:mime});onFile(file);onStatus('녹음 완료 · '+(file.size/1024).toFixed(0)+'KB');};
  recorder.start();activeRecorder=recorder;onStatus('● 녹음 중입니다. 종료 버튼을 눌러 주세요.');
}
function recordStop(){if(activeRecorder&&activeRecorder.state==='recording')activeRecorder.stop()}
function makeMediaUi(kind,label){return `<div class="stack" style="gap:9px"><div class="record-controls"><button class="btn soft small" type="button" data-record-start>🎙️ 녹음 시작</button><button class="btn secondary small" type="button" data-record-stop>■ 녹음 종료</button><span class="file-note" data-rec-status></span></div><div class="field"><label>${esc(label||'또는 음성 파일 선택')}</label><input type="file" accept="audio/*" data-audio-input></div><audio controls data-local-audio class="hide"></audio><p class="hint">마이크 권한과 HTTPS 연결이 필요합니다. 음성 파일은 최대 15MB입니다.</p></div>`}
function wireMediaUi(container,onFile){const status=$('[data-rec-status]',container),player=$('[data-local-audio]',container);const onSelected=file=>{if(!file)return;onFile(file);if(player.dataset.blob)URL.revokeObjectURL(player.dataset.blob);const url=URL.createObjectURL(file);player.dataset.blob=url;player.src=url;player.classList.remove('hide');status.textContent=`선택됨: ${file.name}`;};$('[data-record-start]',container)?.addEventListener('click',async()=>{try{await recordStart(onSelected,t=>status.textContent=t)}catch(e){toast(ex(e),true)}});$('[data-record-stop]',container)?.addEventListener('click',recordStop);$('[data-audio-input]',container)?.addEventListener('change',e=>onSelected(e.target.files[0]));}


// 모든 확인/수정은 브라우저 기본 팝업 대신 접근 가능한 앱 내부 모달로 처리합니다.
function modalDialog({title='확인',message='',value=null,choices=null,placeholder='',danger=false,confirmText='확인',verify=null,multiline=false,allowEmpty=false}={}){
  return new Promise(resolve=>{
    document.querySelector('.app-modal-backdrop')?.remove();
    const layer=document.createElement('div');layer.className='app-modal-backdrop';
    layer.innerHTML=`<section class="app-modal" role="dialog" aria-modal="true" aria-labelledby="app-modal-title"><div class="app-modal-head"><div><span class="eyebrow">쎄뇨라유 · 안내</span><h2 id="app-modal-title">${esc(title)}</h2></div><button type="button" class="app-modal-x" aria-label="닫기">×</button></div><p class="app-modal-message">${esc(message)}</p>${choices?`<div class="field"><label>선택</label><select class="input app-modal-input">${choices.map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join('')}</select></div>`:value!==null?`<div class="field"><label>${verify?'삭제할 반 이름':'입력'}</label>${multiline?`<textarea class="input app-modal-input" rows="7" maxlength="500" placeholder="${esc(placeholder)}">${esc(value)}</textarea>`:`<input class="input app-modal-input" maxlength="150" placeholder="${esc(placeholder)}" value="${esc(value)}" ${verify?'autocomplete="off"':''}>`}</div>`:''}${verify?`<p class="app-modal-verify">확인을 위해 <strong>${esc(verify)}</strong>을(를) 정확히 입력해 주세요.</p>`:''}<div class="app-modal-actions"><button type="button" class="btn secondary app-modal-cancel">취소</button><button type="button" class="btn ${danger?'danger-solid':''} app-modal-ok">${esc(confirmText)}</button></div></section>`;
    document.body.appendChild(layer);document.body.classList.add('modal-open');const input=layer.querySelector('.app-modal-input'),ok=layer.querySelector('.app-modal-ok');
    if(verify)ok.disabled=true;
    const done=v=>{document.removeEventListener('keydown',keyHandler);layer.remove();document.body.classList.remove('modal-open');resolve(v)};
    function keyHandler(e){if(e.key==='Escape'){e.preventDefault();done(null)}if(e.key==='Enter'&&document.activeElement===input){e.preventDefault();if(!ok.disabled)ok.click()}}
    document.addEventListener('keydown',keyHandler);
    layer.querySelector('.app-modal-cancel').onclick=()=>done(null);layer.querySelector('.app-modal-x').onclick=()=>done(null);
    layer.onclick=e=>{if(e.target===layer)done(null)};
    input?.addEventListener('input',()=>{if(verify)ok.disabled=input.value.trim()!==verify});
    ok.onclick=()=>{if(input&&value!==null&&!verify&&!allowEmpty&&!input.value.trim()){input.focus();return}done(input?input.value:true)};
    requestAnimationFrame(()=>{(input||ok).focus();if(input&&value!==null&&!verify)input.select()});
  });
}

  S.live.weeks=onSnapshot(query(collection(db,'classes',S.classId,'weeks'),where('published','==',true)),snap=>{
    const incoming=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order??0)-(b.order??0));
    const old=JSON.stringify(S.weeks),now=JSON.stringify(incoming);if(old===now)return;
    S.weeks=incoming;if(!incoming.some(w=>w.id===S.weekId))S.weekId=incoming.at(-1)?.id||'';
    if(document.activeElement?.matches('textarea,input,[contenteditable]')){toast('새 학습자료가 반영되었습니다. 메뉴를 다시 선택하면 확인할 수 있습니다.');return}
    if($('#student-body'))renderBody();
  },onLiveError);
}
function startClassScheduleLive(){stopLive('classSchedule');if(!S.classId)return;const cid=S.classId;S.live.classSchedule=onSnapshot(doc(db,'classes',cid),snap=>{if(!snap.exists()||S.classId!==cid)return;const prev=JSON.stringify(currentClass()?.schedule||[]);S.classes=[{id:cid,...snap.data()}];if(prev!==JSON.stringify(snap.data().schedule||[])&&S.tab==='mypage'&&$('#student-body')){if(!document.activeElement?.matches('input,textarea'))renderMyPage($('#student-body'));else toast('수업 일정이 변경되었습니다. 마이페이지를 다시 열면 반영됩니다.')}},onLiveError)}
function startEnrollmentLive(){stopLive('enrollments');
  S.live.enrollments=onSnapshot(query(collection(db,'enrollments'),where('uid','==',S.user.uid)),async snap=>{
    const active=snap.docs.filter(d=>d.data().status==='active');
    const next=active[0]?.data().classId||'';
    if(next===S.classId)return;
    stopLive('weeks');stopLive('classSchedule');clearPageLive();
    S.classId=next;S.classes=[];S.weeks=[];S.weekId='';
    if(next){try{const c=await getDoc(doc(db,'classes',next));if(c.exists()&&!c.data().archived){S.classes=[{id:c.id,...c.data()}];await loadWeeks();startWeekLive();startClassScheduleLive()}}catch(e){onLiveError(e)}}
    frame();toast(next?'강사가 지정한 반 정보가 반영되었습니다.':'수강 상태가 변경되었습니다.');
  },onLiveError);
}

  return `<div class="student-feedback"><h3 style="margin-bottom:12px">💬 선생님의 피드백 (${comments.length})</h3><div class="stack">${comments.map(f=>`<div class="feedback"><strong>선생님 · ${esc(typeof f.createdAt==='string'?f.createdAt.slice(0,16).replace('T',' '):fmt(f.createdAt))}</strong>${f.text?`<div style="white-space:pre-wrap">${esc(f.text)}</div>`:''}${f.audioPath?`<div style="margin-top:10px"><audio controls preload="none" data-media-path="${esc(f.audioPath)}"></audio></div>`:''}</div>`).join('')}</div></div>`;

// 이전 4지선다 문제도 자동으로 단일 정답형으로 처리합니다.
function normalizeQuestion(q={}){
  const type=['single','multiple','ox'].includes(q.type)?q.type:'single';
  const options=type==='ox'?['O','X']:(q.options||[]);
  let correctIndices=Array.isArray(q.correctIndices)?q.correctIndices.map(Number):[Number(q.correctIndex??0)];
  correctIndices=[...new Set(correctIndices.filter(i=>i>=0&&i<options.length))];
  return {...q,type,options,correctIndices};
}
function isCorrect(q,answer){
  const a=Array.isArray(answer)?answer:answer===null||answer===undefined?[]:[answer];
  return a.length===q.correctIndices.length&&a.every(i=>q.correctIndices.includes(Number(i)));
}
function answerLabel(q,answer){
  const a=Array.isArray(answer)?answer:answer===null||answer===undefined?[]:[answer];
  return a.length?a.map(i=>q.options[Number(i)]||'?').join(', '):'미응답';
}
function shuffleQuestion(q){
  const opt=q.options.map((text,index)=>({text,index}));
  if(q.type==='ox')return opt;
  for(let i=opt.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opt[i],opt[j]]=[opt[j],opt[i]]}
  return opt;
}

function showQuestion(){const z=S.quiz;if(!z)return;const node=$('#quiz-content');if(!node)return;
  const n=z.index,q=z.questions[n],multi=q.type==='multiple';const current=z.answers[n],selected=Array.isArray(current)?current:current===null?[]:[current];
  node.innerHTML=`<div class="question-count">QUESTION ${n+1} / ${z.questions.length} <span class="pill ${multi?'amber':'green'}" style="margin-left:7px">${multi?'복수정답':q.type==='ox'?'O / X':'객관식'}</span></div>
  <div class="progress"><div style="width:${((n+1)/z.questions.length)*100}%"></div></div>
  <h3 style="font-size:21px;margin-bottom:8px">${esc(q.stem)}</h3>
  <p class="hint" style="margin-bottom:19px">${multi?'정답이라고 생각하는 항목을 모두 선택하세요.':'정답 한 개를 선택하세요.'}</p>
  <div>${z.shuffled[n].map((choice,i)=>`<button type="button" aria-pressed="${selected.includes(choice.index)}" class="answer-option ${selected.includes(choice.index)?'selected':''}" data-answer="${choice.index}"><span class="answer-key">${multi?(selected.includes(choice.index)?'☑':'□'):(q.type==='ox'?choice.text:i+1)}</span><span>${esc(choice.text)}</span></button>`).join('')}</div>
  <div class="between" style="margin-top:25px"><button class="btn secondary" id="quiz-prev" ${n===0?'disabled':''}>← 이전</button><button class="btn" id="quiz-next">${n===z.questions.length-1?'결과 확인하기':'다음 문제 →'}</button></div>`;
  $$('[data-answer]',node).forEach(el=>el.addEventListener('click',()=>{
    const value=Number(el.dataset.answer);if(multi){const a=Array.isArray(z.answers[n])?[...z.answers[n]]:[];z.answers[n]=a.includes(value)?a.filter(x=>x!==value):[...a,value]}
    else z.answers[n]=value;
    showQuestion();
  }));
  $('#quiz-prev').onclick=()=>{z.index--;showQuestion()};
  $('#quiz-next').onclick=()=>{if(z.answers[n]===null||Array.isArray(z.answers[n])&&!z.answers[n].length){toast('선택지를 하나 이상 선택해 주세요.',true);return}if(n<z.questions.length-1){z.index++;showQuestion()}else finishQuiz()};
}
async function finishQuiz(){const z=S.quiz;if(!z)return;
  const score=z.questions.filter((q,i)=>isCorrect(q,z.answers[i])).length,target=$('#quiz-content');loading(target);
  try{
    const resultRef=doc(db,'classes',S.classId,'weeks',z.id,'quizResults',S.user.uid);
    const attemptRef=doc(collection(db,'classes',S.classId,'weeks',z.id,'quizResults',S.user.uid,'attempts'));
    await runTransaction(db,async tx=>{
      const oldSnap=await tx.get(resultRef),old=oldSnap.exists()?oldSnap.data():null;
      const first=old?.firstAttempt || (old?{score:Number(old.score)||0,total:Number(old.total)||0,submittedAt:old.submittedAt||null,answers:old.answers||[],legacy:true}:{score,total:z.questions.length,submittedAt:new Date().toISOString(),legacy:false});
      const count=Math.max(0,Number(old?.attemptCount)|| (old?1:0))+1;
      const name=((S.profile.displayName==='수강생'&&S.user.displayName)?S.user.displayName:S.profile.displayName)||S.user.email;
      tx.set(attemptRef,{userId:S.user.uid,answers:z.answers,score,total:z.questions.length,attemptNumber:count,submittedAt:serverTimestamp()});
      tx.set(resultRef,{userId:S.user.uid,studentName:name,email:S.user.email||'',answers:z.answers,score,total:z.questions.length,submittedAt:serverTimestamp(),firstAttempt:first,attemptCount:count},{merge:true});
    });
    if(S.weekId!==z.id||S.tab!=='quiz')return;
    const pct=Math.round(score/z.questions.length*100);target.classList.remove('loading');
    target.innerHTML=`<div style="text-align:center"><div class="eyebrow">QUIZ COMPLETE ✨</div><h2>복습을 완료했어요!</h2><div class="score-ring" style="--angle:${pct}%"><div class="score-ring-inner"><div><strong>${score} / ${z.questions.length}</strong><br><span>정답 ${pct}%</span></div></div></div><p class="muted">복수정답은 정답을 모두 선택해야 1점입니다.</p></div><div class="separator"></div>${z.questions.map((q,i)=>{const good=isCorrect(q,z.answers[i]);return `<div class="review-line"><div class="between"><strong>${i+1}. ${esc(q.stem)}</strong><span class="pill ${good?'green':'red'}">${good?'정답':'오답'}</span></div><p class="hint" style="margin-top:7px">내 답: ${esc(answerLabel(q,z.answers[i]))} · 정답: ${esc(answerLabel(q,q.correctIndices))}</p>${q.explanation?`<p class="hint" style="margin-top:5px">💡 ${esc(q.explanation)}</p>`:''}</div>`}).join('')}${feedbackMarkup(z.last)}<button id="quiz-retry" class="btn secondary full" style="margin-top:20px">다시 풀기</button>`;
    useMediaPaths(target);$('#quiz-retry').onclick=()=>renderBody();toast('복습 결과가 저장되었습니다.');
  }catch(e){target.classList.remove('loading');toast(ex(e),true);showQuestion()}
}
async function renderPreview(body){const w=week();body.innerHTML=weekHeader('다음 차시 안내','수업 전에 미리 읽고, 보고, 생각해 보는 시간입니다.');weeklyPicker();const p=w.preview;
  if(!p?.enabled){body.insertAdjacentHTML('beforeend',empty('다음 차시 안내를 준비하고 있습니다'));return}
  const mode=p.mode||'rich';body.insertAdjacentHTML('beforeend',`<div class="card stack"><div class="between"><div><h2>${esc(p.title||'다음 시간에 만나요')}</h2></div><span class="pill green">PRÓXIMA CLASE</span></div>${mode==='image'?(p.imagePath?`<img class="article-image" alt="다음 차시 안내" data-media-path="${esc(p.imagePath)}">`:empty('안내 이미지가 없습니다')):`<div class="article">${sanitizeRich(p.richHtml||'<p>학습 내용을 곧 안내할 예정입니다.</p>')}</div>`}${(p.videos||[]).length?`<div class="separator"></div><h3>🎬 수업 영상</h3><p class="hint">앱 안에서 재생됩니다. 다운로드 메뉴는 숨겨져 있습니다.</p>${p.videos.map(v=>`<div class="stack"><strong style="font-size:13px">${esc(v.name||'수업 영상')}</strong><video controls controlslist="nodownload noremoteplayback" disablepictureinpicture disableremoteplayback playsinline preload="metadata" class="media-preview" data-media-path="${esc(v.path)}"></video></div>`).join('')}`:''}${(p.files||[]).length?`<div class="separator"></div><h3>📎 첨부 자료</h3><div class="media-list">${p.files.map(f=>`<a href="#" data-media-path="${esc(f.path)}" class="media-item">${esc(f.name||'첨부 파일')} ↗</a>`).join('')}</div>`:''}</div>`);useMediaPaths(body);
}
async function renderMyPage(body){body.innerHTML=bodyHeader('마이페이지','내 학습 정보와 출석 기록을 한곳에서 확인하세요.');
  body.insertAdjacentHTML('beforeend',`<div class="grid2"><div class="card"><h3>👋 프로필</h3><div class="separator"></div><dl class="info-grid"><dt>이름</dt><dd>${esc(S.profile.displayName)}</dd><dt>로그인 ID</dt><dd>${esc(S.user.email)}</dd><dt>현재 반</dt><dd>${esc(currentClass()?.name||'미등록')}</dd><dt>수강 시작</dt><dd>${esc((currentClass()?.schedule||[]).map(x=>x.date).filter(Boolean).sort()[0]||'수업 날짜 미설정')}</dd></dl><div class="separator"></div><form id="student-name-form" class="row" style="align-items:end"><div class="field" style="flex:1;min-width:160px"><label>표시 이름 변경</label><input name="displayName" maxlength="35" required value="${esc(S.profile.displayName||'')}" placeholder="수강생 이름"></div><button class="btn secondary small" type="submit">이름 저장</button></form><p class="hint">이름 변경 시 강사 화면에도 최신 이름이 표시됩니다.</p><div class="quiet-note">반 변경이 필요하시면 강사에게 요청해 주세요.</div></div><div class="card"><h3>📋 출석 현황</h3><p class="hint" style="margin:6px 0 12px">등록된 차시별 수업 날짜와 출결을 표시합니다.</p><div id="attendance-overview" class="loading">불러오는 중</div></div></div>`);
  $('#student-name-form')?.addEventListener('submit',async e=>{
    e.preventDefault();const form=e.currentTarget,name=String(new FormData(form).get('displayName')||'').trim();
    if(!name||name.length>35){toast('이름은 1~35자로 입력해 주세요.',true);return}
    const btn=$('button[type="submit"]',form);btn.disabled=true;
    try{await updateDoc(doc(db,'users',S.user.uid),{displayName:name,updatedAt:serverTimestamp()});
      await updateProfile(S.user,{displayName:name});S.profile.displayName=name;try{await setDoc(doc(db,'classes',S.classId,'members',S.user.uid),{uid:S.user.uid,name,status:'active'},{merge:true})}catch(e){console.warn(e)}
      toast('이름을 저장했습니다.');frame();}
    catch(err){toast(ex(err),true)}finally{if(btn.isConnected)btn.disabled=false}
  });

  const profileSessions=(currentClass()?.schedule?.length?currentClass().schedule.map(w=>({id:w.weekId,label:w.label,date:w.date||''})):S.weeks);
  const statuses=await Promise.all(profileSessions.map(async w=>{try{const d=await getDoc(doc(db,'classes',S.classId,'weeks',w.id,'attendance',S.user.uid));return {id:w.id,label:w.label,date:w.date||'',status:d.exists()?d.data().status:'unchecked'}}catch(e){return {id:w.id,label:w.label,date:w.date||'',status:'unchecked'}}}));
  const dict={present:['출석','green'],late:['지각','amber'],absent:['결석','red'],excused:['인정결석','gray'],unchecked:['미체크','gray']};
  const spot=$('#attendance-overview');if(spot){spot.classList.remove('loading');spot.innerHTML=statuses.length?statuses.map(item=>`<div class="between" data-attendance-week="${esc(item.id)}" style="padding:10px 0;border-bottom:1px solid var(--line)"><span style="font-size:13px">${esc(item.label)}${item.date?` <small style="color:var(--muted)">· ${esc(item.date)}</small>`:''}</span><span class="pill ${dict[item.status]?.[1]||'gray'}">${dict[item.status]?.[0]||'미체크'}</span></div>`).join(''):empty('아직 출석 기록이 없습니다');}
  for(const w of profileSessions){S.live['attendance:'+w.id]=onSnapshot(doc(db,'classes',S.classId,'weeks',w.id,'attendance',S.user.uid),snap=>{
    if(S.tab!=='mypage')return;const row=$(`[data-attendance-week="${w.id}"]`);if(!row)return;
    const status=snap.exists()?snap.data().status:'unchecked';const tag=$('.pill',row);if(tag){tag.className='pill '+(dict[status]?.[1]||'gray');tag.textContent=dict[status]?.[0]||'미체크'}
  },onLiveError)}
}

// 질문 · 답변: 질문은 본인과 강사만, 댓글은 질문 작성자와 강사만 볼 수 있습니다.
function questionPath(qid){return ['classes',S.classId,'questions',qid]}
function renderQuestions(body){
  body.innerHTML=bodyHeader('질문하기','궁금한 점을 선생님께 남겨보세요. 답변은 실시간으로 표시됩니다.')+`<div class="grid2" style="align-items:start"><div class="card stack"><h3>새 질문</h3><form id="question-create" class="stack"><div class="field"><label>제목</label><input name="title" required maxlength="100" placeholder="예: 오늘 배운 표현이 궁금해요"></div><div class="field"><label>질문 내용</label><textarea name="content" required maxlength="8000" rows="6" placeholder="질문을 자세히 작성해 주세요."></textarea></div><button class="btn" type="submit">질문 보내기</button></form></div><div class="stack"><div class="between"><h3>내 질문</h3><span class="pill green" id="question-count">0건</span></div><div id="question-list" class="question-list"><div class="loading">질문 확인 중</div></div></div></div><div id="student-thread" style="margin-top:17px"></div>`;
  $('#question-create').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,fd=new FormData(form);const title=String(fd.get('title')||'').trim(),content=String(fd.get('content')||'').trim();if(!title||!content)return;const btn=$('button[type="submit"]',form);btn.disabled=true;try{await addDoc(collection(db,'classes',S.classId,'questions'),{uid:S.user.uid,studentName:S.profile.displayName||'수강생',title,content,createdAt:serverTimestamp(),status:'open'});form.reset();toast('질문이 전송되었습니다.')}catch(err){toast(ex(err),true)}finally{btn.disabled=false}};
  S.live.questions=onSnapshot(query(collection(db,'classes',S.classId,'questions'),where('uid','==',S.user.uid)),snap=>{
    if(S.tab!=='questions')return;const list=$('#question-list');if(!list)return;
    const docs=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    $('#question-count').textContent=docs.length+'건';list.classList.remove('loading');
    list.innerHTML=docs.map(q=>`<button class="question-thread ${S.activeQuestionId===q.id?'thread-open':''}" type="button" data-qid="${esc(q.id)}" style="text-align:left"><div class="between"><strong>${esc(q.title)}</strong><span class="pill ${q.status==='answered'?'green':'gray'}">${q.status==='answered'?'답변 완료':'답변 대기'}</span></div><p class="hint" style="margin-top:5px">${fmt(q.createdAt)}</p><p class="muted" style="font-size:13px;margin-top:7px">${esc(q.content.slice(0,110))}</p></button>`).join('')||empty('아직 질문이 없습니다','첫 질문을 남겨 보세요.');
    $$('[data-qid]',list).forEach(el=>el.onclick=()=>{S.activeQuestionId=el.dataset.qid;$$('[data-qid]',list).forEach(b=>b.classList.toggle('thread-open',b===el));showStudentThread(docs.find(q=>q.id===S.activeQuestionId))});
    if(S.activeQuestionId&&!docs.some(q=>q.id===S.activeQuestionId)){S.activeQuestionId='';stopLive('replies');$('#student-thread').innerHTML=''}
    else if(S.activeQuestionId && !S.live.replies)showStudentThread(docs.find(q=>q.id===S.activeQuestionId));
  },onLiveError);
}
function showStudentThread(q){if(!q)return;stopLive('replies');const holder=$('#student-thread');if(!holder)return;
  holder.innerHTML=`<div class="card stack"><div class="between"><div><h3>${esc(q.title)}</h3><p class="hint">${fmt(q.createdAt)}</p></div><button class="btn ghost small" type="button" id="close-thread">닫기 ×</button></div><div class="subtle" style="white-space:pre-wrap">${esc(q.content)}</div><h3>대화</h3><div id="student-replies" class="stack"><div class="loading">답변 확인 중</div></div><form id="student-reply-form" class="stack"><div class="field"><label>추가 질문 또는 답장</label><textarea name="text" rows="3" required maxlength="8000" placeholder="선생님께 전할 말을 작성해 주세요."></textarea></div><button class="btn" type="submit">답장 보내기</button></form></div>`;
  $('#close-thread').onclick=()=>{S.activeQuestionId='';stopLive('replies');holder.innerHTML='';$$('[data-qid]').forEach(b=>b.classList.remove('thread-open'))};
  $('#student-reply-form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,text=String(new FormData(form).get('text')||'').trim();if(!text)return;const btn=$('button[type="submit"]',form);btn.disabled=true;try{await addDoc(collection(db,...questionPath(q.id),'replies'),{uid:S.user.uid,role:'student',author:S.profile.displayName||'수강생',text,createdAt:serverTimestamp()});form.reset()}catch(err){toast(ex(err),true)}finally{btn.disabled=false}};
  S.live.replies=onSnapshot(collection(db,...questionPath(q.id),'replies'),snap=>{if(S.activeQuestionId!==q.id)return;const list=$('#student-replies');if(!list)return;const replies=snap.docs.map(d=>d.data()).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));loaded(list,replies.map(r=>`<div class="reply-bubble ${r.role==='admin'?'teacher':'student'}"><p class="hint">${r.role==='admin'?'선생님':'나'} · ${fmt(r.createdAt)}</p><p style="white-space:pre-wrap">${esc(r.text)}</p></div>`).join('')||'<p class="hint">아직 댓글이 없습니다.</p>')},onLiveError);
}
function renderClassmates(body){body.innerHTML=bodyHeader('우리 반','함께 스페인어를 공부하는 친구들이에요.')+`<div class="card"><div class="between" style="margin-bottom:18px"><h3>${esc(currentClass()?.name||'수강반')}</h3><span class="pill green" id="classmate-count">—</span></div><div id="classmates-list" class="grid3"><div class="loading">수강생 확인 중</div></div><p class="hint" style="margin-top:17px">개인정보 보호를 위해 이름만 공개되며, 이메일이나 개별 학습 성적은 보이지 않습니다.</p></div>`;
  S.live.classmates=onSnapshot(collection(db,'classes',S.classId,'members'),snap=>{
    if(S.tab!=='classmates')return;const list=$('#classmates-list');if(!list)return;const members=snap.docs.map(d=>d.data()).filter(m=>m.status==='active').sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));$('#classmate-count').textContent=members.length+'명';loaded(list,members.map(m=>`<div class="classmate-card"><span class="classmate-avatar">${esc((m.name||'?')[0])}</span><div><strong>${esc(m.name||'이름 미등록')}</strong>${m.uid===S.user.uid?'<p class="hint">나</p>':''}</div></div>`).join('')||empty('아직 반 명단이 없습니다','강사가 수강생 관리를 열면 기존 명단도 동기화됩니다.'));
  },onLiveError);
}

if(CONFIGURED){onAuthStateChanged(auth,async user=>{try{if(!user){Object.keys(S.live).forEach(stopLive);S.user=null;mountAuth(root);return}S.user=user;root.innerHTML='<div class="loading" style="min-height:90vh">학습 정보를 준비하고 있습니다</div>';S.profile=await ensureProfile(user);if(S.profile.role==='admin'){root.innerHTML=`<div style="max-width:450px;margin:100px auto;padding:24px" class="card"><h2>강사 계정입니다</h2><p style="margin:15px 0">강사 관리 페이지를 이용해 주세요.</p><a class="btn" href="admin.html">강사 페이지로 이동 →</a></div>`;return}await loadStudent()}catch(e){console.error(e);root.innerHTML=`<div class="card" style="max-width:550px;margin:70px auto"><h3>불러오기 실패</h3><p class="error">${esc(ex(e))}</p><button class="btn secondary" id="retry-student">다시 시도</button></div>`;$('#retry-student').onclick=()=>location.reload()}})}else mountAuth(root);


</script>
</body>
</html>
